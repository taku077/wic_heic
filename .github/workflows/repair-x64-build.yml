name: HEIC encoder repair - x64 build (experimental)

on:
  push:
    branches:
      - repair/heic-frame-encode-interface
      - investigate/rotated-exif-orientation
      - investigate/geometry-jpeg-vs-heic
      - feature/lossless-heic-rotation
      - feature/wic-heif-encoder-options
      - feature/lossless-wic-native
      - feature/wic-lossless-source-transfer
      - diagnostic/photos-wic-calltrace
      - fix/encoder-geometry-failsafe
      - fix/photos-118-selfwic-incremental
      - experiment/thumb-hevc-workers-1128-isolated
      - candidate/thumb-adaptive-1129-win10-pilot
      - fix/grid-rotation-lossless-safety-20261028
      - experiment/embedded-hevc-thumb-path-20261029
      - candidate/photos-responsive-1130-win10
  workflow_dispatch:

permissions:
  contents: read
  # Expose push-check results to linked readers via commit statuses.
  statuses: write

jobs:
  compile-x64:
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      # Make run id discoverable immediately, even though native Actions
      # Checks cannot be enumerated by the linked commit-status reader.
      - name: Expose x64 Actions run id as pending commit status
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $link="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body=@{
            state='pending'
            context='ci/wic-heic-x64'
            description='x64 synthetic WIC tests running'
            target_url=$link
          } | ConvertTo-Json -Compress
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='wic-heic-ci'
          }
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
          $status=Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType 'application/json'
          if($status.state -ne 'pending' -or $status.context -ne 'ci/wic-heic-x64') {
            throw 'Unexpected pending status response'
          }
          Write-Host "CI_PENDING_STATUS_PUBLISHED run=$env:GITHUB_RUN_ID"
      - name: Check out pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Test lossless HEIC orientation metadata without recompression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile tools/lossless_heic_rotate_experimental.py
          if ($LASTEXITCODE -ne 0) { throw 'Lossless HEIC tool syntax invalid' }
          python tools/test_lossless_heic_rotate.py
          if ($LASTEXITCODE -ne 0) { throw 'Lossless HEIC metadata tests failed' }

      - name: Confirm source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'wic_heic/HeicBitmapFrameEncode.cpp' -Raw
          if (-not $source.Contains('IsEqualGUID(riid, IID_IWICBitmapFrameEncode)')) {
            throw 'Expected frame encoder QueryInterface fix is missing'
          }
          if ($source.Contains('IsEqualGUID(riid, IID_IWICBitmapFrameDecode)')) {
            throw 'Incorrect decoder IID remains in frame encoder'
          }
          Write-Host 'Frame encoder IID source check passed'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake unavailable' }
          # Do not fetch NASM from Chocolatey unless a native dependency
          # rebuild is actually required. Cache-hit builds do not use NASM.

      - name: Restore project dependencies
        shell: pwsh
        run: |
          msbuild wic_heic.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }

      - name: Compute pinned codec dependency signature
        shell: pwsh
        run: |
          $refs = (git submodule status --recursive) -join "`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($refs)
          $sha = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $key = [Convert]::ToHexString($sha).Substring(0, 20)
          "CODEC_DEPS=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore native codec build cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1

      - name: Build native codec dependencies (x64 only)
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            if (Test-Path 'C:\Program Files\NASM\nasm.exe') {
              $env:PATH = "C:\Program Files\NASM;$env:PATH"
            } else {
              choco install nasm -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed for real dependency rebuild' }
              $env:PATH = "C:\Program Files\NASM;$env:PATH"
            }
          }
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM unavailable for dependency rebuild' }
          foreach ($part in @('libde265','kvazaar','libheif')) {
            cmd /c "call build-$part.bat x64"
            if ($LASTEXITCODE -ne 0) { throw "Failed to build dependency: $part" }
          }
          if (-not (Test-Path '_out/x64/include')) { throw 'Missing x64 dependency include directory' }
          if (-not (Test-Path '_out/x64/lib')) { throw 'Missing x64 dependency lib directory' }

      - name: Save native codec build cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1

      - name: Build WIC HEIC DLL (Release x64)
        shell: pwsh
        run: |
          msbuild wic_heic/wic_heic.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Native DLL build failed' }

      - name: Inspect compiled DLL and record SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -LiteralPath 'wic_heic/(Build)' -Filter 'wic_heic.dll' -Recurse -File | Where-Object { $_.FullName -match 'x64' -and $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $dll) { throw 'No x64 Release wic_heic.dll was produced' }
          $hash = Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256
          "Build artifact: $($dll.FullName)" | Set-Content -Path 'SHA256.txt'
          "SHA256: $($hash.Hash)" | Add-Content -Path 'SHA256.txt'
          "Commit: $env:GITHUB_SHA" | Add-Content -Path 'SHA256.txt'
          Get-Content SHA256.txt

      - name: Build native WIC conversion smoke test (x64)
        shell: pwsh
        run: |
          msbuild wictest/wictest.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Native WIC test program failed to build' }

      - name: Test real WIC encode using checked-in sample images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $testExe = (Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $register = Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s', ('"{0}"' -f $dll)) -Wait -PassThru
          if ($register.ExitCode -ne 0) { throw "Runner-only COM registration failed: $($register.ExitCode)" }
          try {
            Push-Location -LiteralPath 'wictest'
            try {
              # Explicit opt-in, local test log only. The DLL never reads image
              # content into the trace or logs private names/paths.
              $trace = Join-Path (Get-Location).Path 'WIC_PhotosTrace_CI.txt'
              $env:WIC_HEIC_TRACE_FILE = $trace
              try {
                & $testExe
                if ($LASTEXITCODE -ne 0) { throw "Native WIC sample conversion test failed: $LASTEXITCODE" }
                # WIC 50 rapid FULL saves; no user images, no sleeps, unique
                # destination for every turn, exact container checks each time.
                & $testExe --stress50
                if ($LASTEXITCODE -ne 0) { throw "Fifty-turn HEIC rapid-save regression failed: $LASTEXITCODE" }
                # Distinguish actual resized-raster save from temporary viewer
                # downscale. Verify both scale->rotate and rotate->scale.
                & $testExe --scale-matrix
                if ($LASTEXITCODE -ne 0) { throw "WIC scale/rotation matrix failed: $LASTEXITCODE" }
                # Model 50 back-to-back clicks whose save Commit calls overlap.
                # All writes are unique artificial output files, never original.
                & $testExe --burst50
                if ($LASTEXITCODE -ne 0) { throw "WIC 50 overlapping Commit stress failed: $LASTEXITCODE" }
                # Keep every previous revision of a synthetic working file
                # under a brand-new CI folder. Simulates Photos-like stable
                # path replacements without ever writing to the pinned source.
                & $testExe --replace50
                if ($LASTEXITCODE -ne 0) { throw "Fifty same-path synthetic ReplaceFile saves failed: $LASTEXITCODE" }
                # Identical artificial pixels, Windows native JPEG/PNG.
                # Disable WIC tracing ONLY during performance comparison;
                # otherwise HEIC pays trace file locks while JPEG/PNG do not,
                # making the measured ratio unfair. Restore afterward.
                $previousTrace=$env:WIC_HEIC_TRACE_FILE
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
                try {
                  # 5,000 GetFrame calls emit too many DecoderGetFrame events
                  # for the privacy-capped trace, hiding later save-route
                  # events. Run this microbenchmark ONLY while trace is off.
                  & $testExe --getframe-latency
                  if ($LASTEXITCODE -ne 0) { throw "Standalone GetFrame benchmark failed: $LASTEXITCODE" }
                  & $testExe --perf-compare
                  if ($LASTEXITCODE -ne 0) { throw "HEIC/PNG/JPEG WIC stage benchmark failed: $LASTEXITCODE" }
                  # Same Windows runner, same codec binary, same artificial
                  # HEIC. IStream proxy alternates legacy Seek(CUR,0) after
                  # every Read versus direct byte-count bookkeeping.
                  & $testExe --stream-ab
                  if ($LASTEXITCODE -ne 0) { throw "Synthetic HEIC same-host IStream A/B failed: $LASTEXITCODE" }
                  & $testExe --container-latency
                  if ($LASTEXITCODE -ne 0) { throw "Six HEIF container metadata timing probe failed: $LASTEXITCODE" }
                  & $testExe --arbitration-audit
                  if ($LASTEXITCODE -ne 0) { throw "Read-only WIC decoder arbitration audit failed: $LASTEXITCODE" }
                } finally {
                  $env:WIC_HEIC_TRACE_FILE=$previousTrace
                }
              }
              finally {
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              }
              if (-not (Test-Path -LiteralPath $trace)) { throw 'WIC opt-in trace was not produced' }
              $events = Get-Content -LiteralPath $trace
              foreach ($required in @('DecoderContainerParsed','DecoderFullDecode','FrameInitializeOptions','WriteSourceLossless','EncoderCommitLossless','WriteSourceRejected','EncoderCommitRecompressed','EncoderCommitExit','EncoderSetThumbnail','EncoderSetColorContexts','EncoderMetadataWriterUnavailable','WriteSourceOriginalExact')) {
                if (-not ($events | Where-Object { $_ -like "*event=$required *" })) { throw "Missing expected diagnostic event: $required" }
              }
              # A reliable timeline needs matched encoder Commit spans.
              $starts = @($events | Where-Object { $_ -match '\bevent=EncoderCommitEnter ' })
              $ends = @($events | Where-Object { $_ -match '\bevent=EncoderCommitExit ' })
              $traceBytes=(Get-Item -LiteralPath $trace).Length
              # Event-only counts; diagnostic output contains no filenames,
              # original pixels, user data or file-system paths.
              Write-Host "WIC_TRACE_PAIR_COUNTS starts=$($starts.Count) ends=$($ends.Count) size_bytes=$traceBytes cap_bytes=2097152"
              if ($starts.Count -eq 0 -or $starts.Count -ne $ends.Count) {
                throw 'WIC operation trace has unpaired encoder commits'
              }
              foreach ($line in ($starts + $ends)) {
                if ($line -notmatch '\boperation=[1-9][0-9]*\b' -or
                    $line -notmatch '\btid=[1-9][0-9]*\b' -or
                    $line -notmatch '\butc_filetime=[1-9][0-9]*\b' -or
                    $line -notmatch '\belapsed_ms=[0-9]+\b') {
                  throw 'Missing numeric WIC save timing fields'
                }
              }
              Write-Host "WIC_COMMIT_TIMING_SPANS_PASS count=$($ends.Count)"
              if ($events -match '(?i)\\samples\\|[A-Z]:\\|\.heic|\.jpg|\.png|GPS|EXIF|maker.?note') {
                throw 'Sensitive file-identifying content leaked into WIC trace'
              }
              $analyzer = Join-Path (Resolve-Path -LiteralPath '../diagnostics/photos_trace').Path 'PhotosTrace_Analyze.ps1'
              & $analyzer -TracePath $trace
              $summary = Get-ChildItem -LiteralPath '../diagnostics/photos_trace' -Filter 'WIC_Photos_Trace_Summary_*.txt' -File | Select-Object -First 1
              if (-not $summary) { throw 'WIC trace analyzer did not save a summary' }
              $body = Get-Content -LiteralPath $summary.FullName -Raw
              if ($body -notmatch 'EncoderCommitLossless=' -or $body -notmatch 'EncoderCommitRecompressed=') {
                throw 'WIC trace analyzer omitted required summary fields'
              }
              Write-Host "WIC opt-in trace passed; event lines=$($events.Count); no paths or image metadata"
            }
            finally {
              Pop-Location
            }
          }
          finally {
            $unregister = Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u', '/s', ('"{0}"' -f $dll)) -Wait -PassThru
            if ($unregister.ExitCode -ne 0) { Write-Warning "Runner-only COM deregistration failed: $($unregister.ExitCode)" }
          }

      # Never ship the WIC_HEIC_THUMB_WORKERS_LAB codec. On a disposable
      # Windows runner generate the SAME 12MP artificial HEIC, compare
      # 0/default vs 2 vs 4 codec worker hints, require bit-exact RGB.
      # No MSI artifact, no user's files, no real PC registry changes.
      # Run the existing synthetic 12MP worker benchmark on the active repair
      # branch too. Previously a green repair-branch workflow skipped BOTH
      # fixture generation and worker/RGB-parity checks entirely.
      - name: Generate synthetic 12MP fixture for experimental HEVC workers
        if: github.ref == 'refs/heads/experiment/thumb-hevc-workers-1128-isolated' || github.ref == 'refs/heads/candidate/thumb-adaptive-1129-win10-pilot' || github.ref == 'refs/heads/fix/grid-rotation-lossless-safety-20261028' || github.ref == 'refs/heads/candidate/photos-responsive-1130-win10'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/Synthetic12MpHeic.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Failed to build isolated 12MP generator'}
          $generator=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/Synthetic12MpHeic.exe').Path
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          if(Test-Path -LiteralPath $fixture){throw 'Refuse to overwrite existing synthetic file'}
          & $generator $dll $fixture
          if($LASTEXITCODE -ne 0){throw 'Synthetic 12MP HEIC generator failed'}
          if((Get-Item -LiteralPath $fixture).Length -gt 33554432){throw '12MP fixture exceeded 32MiB'}
          # Distinct 8-bit RGBA sample: never overwrite the opaque fixture.
          # WIC encoder must preserve a real HEIF alpha auxiliary plane.
          $alpha=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024_alpha.heic'
          if(Test-Path -LiteralPath $alpha){throw 'Refuse to overwrite synthetic alpha HEIC'}
          & $generator $dll $alpha alpha
          if($LASTEXITCODE -ne 0){throw 'Synthetic 12MP alpha HEIC encode failed'}
          if((Get-Item -LiteralPath $alpha).Length -gt 33554432){throw 'Alpha HEIC exceeded 32MiB'}
          Write-Host 'THUMB_WORKERS_12MP_ALPHA_SYNTHETIC_FIXTURE_PASS'
          Write-Host 'THUMB_WORKERS_12MP_SYNTHETIC_FIXTURE_PASS'

      - name: Compare 12MP cold HEVC 0 versus 2 versus 4 worker decode with exact RGB
        if: github.ref == 'refs/heads/experiment/thumb-hevc-workers-1128-isolated' || github.ref == 'refs/heads/candidate/thumb-adaptive-1129-win10-pilot' || github.ref == 'refs/heads/fix/grid-rotation-lossless-safety-20261028' || github.ref == 'refs/heads/candidate/photos-responsive-1130-win10'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $tester=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($reg.ExitCode -ne 0){throw 'Temporary CI COM registration failed'}
          try {
            Push-Location -LiteralPath 'wictest'
            try {
              Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              & $tester --thumbnail-worker-lab | Tee-Object -Variable labLines
              if($LASTEXITCODE -ne 0){throw '12MP worker A/B accuracy or performance regression'}
              $joined=($labLines -join "`n")
              foreach($required in @(
                'THUMB_WORKERS_AB_PIXEL_PARITY_PASS',
                'THUMB_CONCURRENT_AUTO_RGB_PARITY_PASS',
                'THUMB_MIXED_PARALLEL_RGB_PARITY_PASS',
                'THUMB_MIXED_BATCH_LATENCY',
                'THUMB_PILOT_PRODUCTION_AUTO_SELECTED workers=4 width=4032 height=3024 alpha=0 luma_bits=8',
                'THUMB_PILOT_NOENV_RGB_PARITY_PASS',
                'THUMB_NO_EMBEDDED_FALLBACK_PASS',
                'PHOTOS_UI_CODEC_WORKER_BUDGET_PASS',
                'PHOTOS_UI_2WORKER_RGB_PARITY_PASS',
                'THUMB_PILOT_PRODUCTION_AUTO_SELECTED workers=2 width=4032 height=3024',
                'THUMB_WORKERS_POLICY_DECISION requested=a selected=0 width=4032 height=3024 luma_bits=8 chroma_bits=8 alpha=1',
                'THUMB_WORKERS_POLICY_DECISION requested=a selected=0 width=1080 height=1920 luma_bits=10 chroma_bits=10 alpha=0'
              )) {
                if(-not $joined.Contains($required)) {
                  throw ('Mixed HEIC actual alpha/high-depth guard or RGB test missing: '+$required)
                }
              }
              Write-Host 'THUMB_MIXED_SOURCE_ALPHA_AND_10BIT_FALLBACK_PASS'
            } finally { Pop-Location }
          } finally {
            Remove-Item Env:\WIC_HEIC_THUMB_LAB_WORKERS -ErrorAction SilentlyContinue
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unreg.ExitCode -ne 0){throw 'Temporary CI COM unregister failed'}
          }
          Write-Host 'THUMB_WORKERS_12MP_RGB_PARITY_PASS'

      # New independent HEVC fixture rather than the legacy 12MP WIC encoder
      # (the latter does NOT embed thmb). Test branch only until CI passes.
      - name: Generate real HEVC container with embedded 320x240 thumbnail
        if: github.ref == 'refs/heads/experiment/embedded-hevc-thumb-path-20261029' || github.ref == 'refs/heads/fix/grid-rotation-lossless-safety-20261028' || github.ref == 'refs/heads/candidate/photos-responsive-1130-win10'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/SyntheticEmbeddedHevcThumb.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Cannot build independent HEVC thumb fixture generator'}
          $exe=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/SyntheticEmbeddedHevcThumb.exe').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_embedded_4032x3024.heic'
          if(Test-Path -LiteralPath $fixture){throw 'Refuse existing synthetic embedded fixture'}
          & $exe $fixture
          if($LASTEXITCODE -ne 0){throw 'Cannot write artificial HEVC embedded thumbnail'}
          if(-not(Test-Path -LiteralPath $fixture)){throw 'Embedded HEVC fixture missing'}

      - name: Verify WIC embedded HEVC does not decode primary 12MP pixels
        if: github.ref == 'refs/heads/experiment/embedded-hevc-thumb-path-20261029' || github.ref == 'refs/heads/fix/grid-rotation-lossless-safety-20261028' || github.ref == 'refs/heads/candidate/photos-responsive-1130-win10'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $trace=Join-Path $env:RUNNER_TEMP 'wicfast_embedded_trace.txt'
          if(Test-Path -LiteralPath $trace){throw 'Refuse existing trace file'}
          $register=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($register.ExitCode -ne 0){throw 'Cannot register CI WIC decoder'}
          try {
            $env:WIC_HEIC_TRACE_FILE=$trace
            & $exe --embedded-thumbnail-probe
            if($LASTEXITCODE -ne 0){throw 'Embedded HEVC WIC probe failed'}
            if(-not(Test-Path -LiteralPath $trace)){throw 'Embedded HEVC trace missing'}
            $events=Get-Content -LiteralPath $trace -Raw
            foreach($required in @(
              'event=DecoderThumbnailEmbedded width=320 height=240',
              'event=FrameThumbnailEmbedded width=320 height=240',
              'event=DecoderFullDecode width=320 height=240'
            )){
              if(-not $events.Contains($required)){throw "Embedded HEVC expected trace missing: $required"}
            }
            if($events.Contains('event=DecoderFullDecode width=4032 height=3024')){
              throw 'Embedded thumbnail unexpectedly decoded full 12MP primary'
            }
            Write-Host 'THUMB_EMBEDDED_HEVC_NO_FULL_DECODE_PASS thumb=320x240'
          } finally {
            Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
            $unregister=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unregister.ExitCode -ne 0){Write-Warning 'CI COM unregistration failed'}
          }

      - name: Run isolated and reversible WIC decoder priority / competitor A-B
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          & './diagnostics/wic_arbitration/RunnerOnly_Arbitration_AB.ps1' -TestExe $exe -CodecDll $dll

      - name: Confirm HKCU trace reaches real WIC codec without environment override
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $root=(Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $start=Join-Path $root 'PhotosTrace_Start.ps1'
          $stop=Join-Path $root 'PhotosTrace_Stop.ps1'
          Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($reg.ExitCode -ne 0) { throw 'HKCU trace COM registration failed' }
          $started=$false
          try {
            & $start
            $started=$true
            $props=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            $trace=[string]$props.TraceFile
            if(-not $trace -or -not (Test-Path -LiteralPath $trace)) { throw 'HKCU trace log not created' }
            Push-Location -LiteralPath 'wictest'
            try {
              & $exe
              if($LASTEXITCODE -ne 0) { throw 'Native WIC test failed with HKCU trace enabled' }
            } finally { Pop-Location }
            $lines=@(Get-Content -LiteralPath $trace -Encoding UTF8)
            foreach($event in @('DecoderOpen','EncoderInitialize','FrameInitializeOptions','EncoderCommitLossless')) {
              if(-not ($lines | Where-Object { $_ -match ('\bevent='+$event+' ') })) {
                throw "HKCU trace missing actual native WIC event: $event"
              }
            }
            $lengthBefore=(Get-Item -LiteralPath $trace).Length
            if($lengthBefore -eq 0) { throw 'HKCU capture was empty' }
            # Expire tracing in the disposable runner and verify that the codec
            # does not append events. Restore the deadline before Stop to
            # preserve its ownership verification.
            $deadline=[long]$props.TraceUntilFileTime
            try {
              Set-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceUntilFileTime -Value ([DateTime]::UtcNow.AddMinutes(-1).ToFileTimeUtc()) -ErrorAction Stop
              Push-Location -LiteralPath 'wictest'
              try {
                & $exe
                if($LASTEXITCODE -ne 0) { throw 'Native WIC test failed with expired trace' }
              } finally { Pop-Location }
              $lengthAfter=(Get-Item -LiteralPath $trace).Length
              if($lengthBefore -ne $lengthAfter) { throw 'Expired HKCU diagnostic trace still appended' }
            } finally {
              Set-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceUntilFileTime -Value $deadline -ErrorAction Stop
            }
            Write-Host 'HKCU_TRACE_AND_EXPIRATION_PASSED (native runner, NOT Windows Photos)'
          } finally {
            if($started) { & $stop }
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unreg.ExitCode -ne 0) { throw 'HKCU trace COM deregistration failed' }
          }

      - name: Verify privacy-limited Photos trace enable and clean shutdown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          try {
            & (Join-Path $root 'PhotosTrace_Start.ps1')
            $prop = Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            if (-not $prop.TraceFile -or -not (Test-Path -LiteralPath $prop.TraceFile)) {
              throw 'Trace start failed to register local output'
            }
            if (-not $prop.TraceUntilFileTime) { throw '20-minute automatic expiration absent' }
            $path = $prop.TraceFile
          }
          finally {
            & (Join-Path $root 'PhotosTrace_Stop.ps1')
          }
          $remaining = Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceFile -ErrorAction SilentlyContinue
          if ($remaining -and $remaining.TraceFile) {
            throw 'Trace setting not cleaned up by Stop'
          }
          if (-not (Test-Path -LiteralPath $path)) {
            throw 'Trace evidence log was unexpectedly deleted'
          }
          Write-Host 'Privacy-limited WIC Photos trace start/stop passed'

      - name: Reject foreign or partially configured trace registry values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\WicHeic'
          $root = (Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $start = Join-Path $root 'PhotosTrace_Start.ps1'
          $state = Join-Path $root 'WIC_Photos_Trace_ACTIVE.txt'
          if (Test-Path -LiteralPath $state) { throw 'Unexpected active trace state in CI' }
          $existing = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
          if ($existing -and ((@($existing.PSObject.Properties.Name) -contains 'TraceFile') -or
                             (@($existing.PSObject.Properties.Name) -contains 'TraceUntilFileTime'))) {
            throw 'Unexpected existing trace values in fresh runner'
          }
          # Previously the start script overwrote this deadline, then deleted it on failure.
          New-ItemProperty -Path $key -Name TraceUntilFileTime -PropertyType QWord -Value ([long]123456789) | Out-Null
          try {
            $blocked = $false
            try { & $start | Out-Null } catch { $blocked = $true }
            if (-not $blocked) { throw 'Start accepted an existing deadline' }
            $still = Get-ItemProperty -Path $key
            if ([long]$still.TraceUntilFileTime -ne 123456789) { throw 'Pre-existing deadline was changed' }
            if (Test-Path -LiteralPath $state) { throw 'Rejected trace created state file' }
          } finally {
            Remove-ItemProperty -Path $key -Name TraceUntilFileTime -ErrorAction Stop
          }
          New-ItemProperty -Path $key -Name TraceFile -PropertyType String -Value '' | Out-Null
          try {
            $blocked = $false
            try { & $start | Out-Null } catch { $blocked = $true }
            if (-not $blocked) { throw 'Start accepted an existing empty TraceFile' }
            $still = Get-ItemProperty -Path $key
            if (-not (@($still.PSObject.Properties.Name) -contains 'TraceFile')) {
              throw 'Pre-existing TraceFile value was removed'
            }
            if (Test-Path -LiteralPath $state) { throw 'Rejected trace created state file' }
          } finally {
            Remove-ItemProperty -Path $key -Name TraceFile -ErrorAction Stop
          }
          Write-Host 'PASS: pre-existing trace registry settings are not changed'

      - name: Verify strict 2MiB trace cap on native synthetic fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($reg.ExitCode -ne 0) { throw 'Trace cap test COM registration failed' }
          try {
            Push-Location -LiteralPath 'wictest'
            try {
              $cap=Join-Path (Get-Location).Path 'WIC_TraceCap_CI.txt'
              [IO.File]::WriteAllBytes($cap,(New-Object byte[] ((2*1024*1024)-40)))
              $env:WIC_HEIC_TRACE_FILE=$cap
              try {
                & $exe
                if($LASTEXITCODE -ne 0) { throw 'Synthetic test failed during trace cap test' }
              } finally {
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              }
              $length=(Get-Item -LiteralPath $cap).Length
              if($length -gt 2*1024*1024) { throw "Trace exceeded 2MiB ($length bytes)" }
              Write-Host "TRACE_CAP_PASS length=$length"
              # Saturate the ordinary-event quota before a 50-Commit burst:
              # each save still needs a complete Enter+Exit pair and result.
              # Never touch any original image or trace from the user.
              $reserve=Join-Path (Get-Location).Path 'WIC_TracePriority_CI.txt'
              [IO.File]::WriteAllBytes($reserve,(New-Object byte[] ((3*512*1024)-40)))
              $env:WIC_HEIC_TRACE_FILE=$reserve
              try {
                & $exe --replace50
                if($LASTEXITCODE -ne 0) { throw 'Trace priority artificial same-path 50 probe failed' }
              } finally {
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              }
              $sizePriority=(Get-Item -LiteralPath $reserve).Length
              if($sizePriority -gt 2*1024*1024) { throw 'Priority trace exceeded 2MiB' }
              $textPriority=[IO.File]::ReadAllText($reserve)
              $priorityStarts=[regex]::Matches($textPriority,'event=EncoderCommitEnter ')
              $priorityEnds=[regex]::Matches($textPriority,'event=EncoderCommitExit ')
              if($priorityStarts.Count -ne 50 -or $priorityEnds.Count -ne 50) {
                throw "Reserved quota lost Commit boundaries: starts=$($priorityStarts.Count) ends=$($priorityEnds.Count)"
              }
              Write-Host "WIC_TRACE_RESERVED_COMMIT_50_PASS starts=$($priorityStarts.Count) ends=$($priorityEnds.Count) bytes=$sizePriority"
            } finally { Pop-Location }
          } finally {
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unreg.ExitCode -ne 0) { throw 'Trace cap test COM deregistration failed' }
          }

      - name: Save read-only baseline of WIC registration before isolated MSI test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $snapshot=& ./diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1 | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $snapshot)) { throw 'WIC inventory did not create snapshot' }
          $data=Get-Content -LiteralPath $snapshot -Raw | ConvertFrom-Json
          if(@($data.Registrations).Count -ne 12) { throw 'Incomplete 32/64-bit COM registration inventory' }
          "WIC_BASELINE=$snapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'WIC read-only baseline recorded'

      - name: Verify pinned synthetic HEIC custody and copy integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=& ./diagnostics/photos_trace/PhotosSynthetic_Prepare.ps1 | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $folder)) { throw 'Missing synthetic session' }
          $result=& ./diagnostics/photos_trace/PhotosSynthetic_Verify.ps1 -SessionDirectory $folder
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=UNCHANGED')) {
            throw 'Synthetic original/reference baseline failed'
          }
          # Simulate Photos changing ONLY the disposable work file; never touch reference.
          $working=Join-Path $folder 'work/synthetic-working.heic'
          $handle=[IO.File]::Open($working,[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try { $handle.Seek(0,[IO.SeekOrigin]::End) | Out-Null; $handle.WriteByte(0) }
          finally { $handle.Dispose() }
          $result=& ./diagnostics/photos_trace/PhotosSynthetic_Verify.ps1 -SessionDirectory $folder
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=MODIFIED')) {
            throw 'Synthetic work-file change not detected'
          }
          Write-Host 'SYNTHETIC_CUSTODY_CI_PASS'

      - name: Validate user-compatible Windows PowerShell 5.1 tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if($PSVersionTable.PSVersion.Major -ne 5) { throw 'This test must use Windows PowerShell 5.1' }
          $root=(Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $prepare=Join-Path $root 'PhotosSynthetic_Prepare.ps1'
          $verify=Join-Path $root 'PhotosSynthetic_Verify.ps1'
          $preflight=Join-Path $root 'WIC_Preflight_ReadOnly.ps1'
          $compare=Join-Path $root 'WIC_Preflight_Compare.ps1'
          $folder=& $prepare | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $folder)) { throw 'PS5.1 synthetic preparation failed' }
          $result=@(& $verify -SessionDirectory $folder)
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=UNCHANGED')) {
            throw 'PS5.1 synthetic verification failed'
          }
          $outside=Join-Path $root 'README_JA.md'
          $blocked=$false
          try { & $verify -SessionDirectory $outside | Out-Null } catch { $blocked=$true }
          if(-not $blocked) { throw 'PS5.1 verifier accepted an unrelated input path' }
          $before=& $preflight | Select-Object -Last 1
          $after=& $preflight | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $before) -or -not (Test-Path -LiteralPath $after)) {
            throw 'PS5.1 WIC inventory did not write local snapshots'
          }
          & $compare -Before $before -After $after
          $start=Join-Path $root 'PhotosTrace_Start.ps1'
          $stop=Join-Path $root 'PhotosTrace_Stop.ps1'
          try {
            & $start
            $props=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            if(-not $props.TraceFile -or -not (Test-Path -LiteralPath $props.TraceFile)) {
              throw 'PS5.1 trace registry opt-in failed'
            }
          } finally { & $stop }
          # Verify only the new read-only comparator against two checked-in
          # public synthetic fixtures. Do not require FFprobe on CI runner.
          $heicCompare=Join-Path $root 'HEIC_Compare_ReadOnly.ps1'
          $syntheticBefore=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
          $syntheticAfter=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6.heic').Path
          $h1=(Get-FileHash -LiteralPath $syntheticBefore -Algorithm SHA256).Hash
          $h2=(Get-FileHash -LiteralPath $syntheticAfter -Algorithm SHA256).Hash
          & $heicCompare -Before $syntheticBefore -After $syntheticAfter
          $report=Get-ChildItem -LiteralPath $root -Filter 'HEIC_Compare_ReadOnly_*.json' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $report) { throw 'Read-only comparator produced no report' }
          $meta=Get-Content -LiteralPath $report.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          if($meta.Schema -ne 1 -or $meta.Before.Bytes -le 0 -or $meta.After.Bytes -le 0) {
            throw 'Read-only comparator report is malformed'
          }
          if((Get-FileHash -LiteralPath $syntheticBefore -Algorithm SHA256).Hash -cne $h1 -or
             (Get-FileHash -LiteralPath $syntheticAfter -Algorithm SHA256).Hash -cne $h2) {
            throw 'Read-only comparator altered its input synthetic images'
          }
          Write-Host 'HEIC_COMPARE_READONLY_POWERSHELL_5_1_PASS'
          Write-Host 'WINDOWS_POWERSHELL_5_1_TOOLCHAIN_PASSED'

      - name: Validate Photos UI timing diagnostic with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 is required'}
          $root=(Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          & (Join-Path $root 'Photos_UI_Timeline_Capture.ps1') -DurationSeconds 5 -IntervalMs 250 -CiSimulateF9
          $record=Get-ChildItem -LiteralPath $root -Filter 'Photos_UI_Timeline_*.csv' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $record){throw 'UI capture produced no file'}
          $rows=@(Import-Csv -LiteralPath $record.FullName)
          if($rows.Count -lt 5){throw 'UI capture produced too few samples'}
          if(@($rows | Where-Object { $_.event -eq 'MARK_F9' }).Count -lt 1) {
            throw 'Queued F9 WM_HOTKEY marker was lost during foreground-independent capture'
          }
          Write-Host 'PHOTOS_GLOBAL_F9_HOTKEY_QUEUE_CI_PASS'
          $csv=Join-Path $root 'synthetic_timeline_ci.csv'
          $trace=Join-Path $root 'synthetic_wic_ci.txt'
          @(
            'utc_filetime,tick,event,foreground_pid,window_w,window_h,client_w,client_h,process_cpu_ms,working_set_kib',
            '134065152000001000,100010,MARK_F9,42,1000,800,980,750,50,2048'
          ) | Set-Content -LiteralPath $csv -Encoding ASCII
          'WIC_HEIC_TRACE v1 tick=100030 pid=42 event=DecoderFullDecode width=1080 height=1920 transform=0 compression=0 source=libheif-cold hr=0x00000000 tid=1 operation=0 elapsed_ms=40 utc_filetime=134065152000001100' |
            Set-Content -LiteralPath $trace -Encoding ASCII
          & (Join-Path $root 'Photos_UI_Timeline_Correlate.ps1') -TimelinePath $csv -TracePath $trace -WindowSeconds 1
          $report=Get-ChildItem -LiteralPath $root -Filter 'Photos_UI_Correlation_*.txt' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $report){throw 'UI correlation report was not saved'}
          $text=Get-Content -LiteralPath $report.FullName -Raw -Encoding UTF8
          if($text -notmatch 'approximate_decode_overlap=1') {
            throw ('WIC/UI clock correlation test failed: '+$text)
          }
          # Regression: a late focus switch must be explicit in the report.
          # A decoder event in the old window PID is not proof about the
          # new foreground window when F9 was pressed.
          $focusCsv=Join-Path $root 'synthetic_focus_switch_ci.csv'
          @(
            'utc_filetime,tick,event,foreground_pid,window_w,window_h,client_w,client_h,process_cpu_ms,working_set_kib',
            '134065152000000000,99990,SAMPLE,42,1000,800,980,750,50,2048',
            '134065152000001000,100010,MARK_F9,43,1000,800,980,750,50,2048'
          ) | Set-Content -LiteralPath $focusCsv -Encoding ASCII
          & (Join-Path $root 'Photos_UI_Timeline_Correlate.ps1') -TimelinePath $focusCsv -TracePath $trace -WindowSeconds 1
          $report=Get-ChildItem -LiteralPath $root -Filter 'Photos_UI_Correlation_*.txt' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $text=Get-Content -LiteralPath $report.FullName -Raw -Encoding UTF8
          if($text -notmatch 'FOREGROUND_SWITCH_BEFORE_MARK offset_ms=0 from_pid=42 to_pid=43' -or
             $text -notmatch 'FOREGROUND_CAUTION:' -or
             $text -notmatch 'MARK_PID_WIC_MATCH matched_events=0') {
            throw 'Photos foreground switch correlation regression'
          }
          # A no-F9 user recording still contains actionable aggregate WIC
          # statistics. Check that its report is not just "inconclusive".
          $noMark=Join-Path $root 'synthetic_timeline_no_mark_ci.csv'
          ((Get-Content -LiteralPath $csv -Raw -Encoding ASCII) -replace ',MARK_F9,',',SAMPLE,') |
            Set-Content -LiteralPath $noMark -Encoding ASCII
          & (Join-Path $root 'Photos_UI_Timeline_Correlate.ps1') -TimelinePath $noMark -TracePath $trace -WindowSeconds 1
          $report=Get-ChildItem -LiteralPath $root -Filter 'Photos_UI_Correlation_*.txt' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $text=Get-Content -LiteralPath $report.FullName -Raw -Encoding UTF8
          if($text -notmatch 'NO_F9_MARK' -or
             $text -notmatch 'PASSIVE_WIC_SUMMARY full_decode_count=1' -or
             $text -notmatch 'PASSIVE_DECODE_MS min=40 median_lower=40 max=40') {
            throw 'No-F9 passive WIC analysis regression'
          }
          # End-to-end 5s smoke for the one-click orchestration. It must
          # remove only its own HKCU trace settings, even without Photos.
          & (Join-Path $root 'Photos_UI_Timeline_Run.ps1') -DurationSeconds 5 -IntervalMs 250
          $settings=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($settings -and ($settings.PSObject.Properties.Name -contains 'TraceFile')) {
            throw 'Combined UI tool left HKCU TraceFile enabled'
          }
          Write-Host 'PHOTOS_UI_TIMELINE_DIAGNOSTICS_PS51_PASS'

      - name: Build experimental replacement x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild wic_heic.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "x64 installer build failed: $LASTEXITCODE" }
          $msi = Get-ChildItem -LiteralPath '(Build)' -Filter 'WicHeic.msi' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' -and $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $msi) { throw 'x64 WicHeic.msi not found' }
          Copy-Item -LiteralPath $msi.FullName -Destination 'WicHeic-HEIC-x64.msi'
          Get-FileHash 'WicHeic-HEIC-x64.msi' -Algorithm SHA256 |
            Format-List

      - name: Confirm candidate MSI version is 1.1.30
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=(Resolve-Path -LiteralPath 'WicHeic-HEIC-x64.msi').Path
          $installer=New-Object -ComObject WindowsInstaller.Installer
          $db=$installer.OpenDatabase($package,0)
          function ReadMsiProperty([string]$name) {
            $view=$db.OpenView("SELECT Value FROM Property WHERE Property = '$name'")
            try {
              $null=$view.Execute()
              $record=$view.Fetch()
              if(-not $record) { throw "MSI property missing: $name" }
              return [string]$record.StringData(1)
            } finally { $view.Close() }
          }
          $version=ReadMsiProperty 'ProductVersion'
          $productName=ReadMsiProperty 'ProductName'
          $productCode=ReadMsiProperty 'ProductCode'
          $upgradeCode=ReadMsiProperty 'UpgradeCode'
          try {
            $null=[Guid]::Parse($productCode)
            $null=[Guid]::Parse($upgradeCode)
          } catch {
            throw "Missing or invalid MSI major-upgrade identity: Product=$productCode Upgrade=$upgradeCode"
          }
          if($version -ne '1.1.30' -or $productName -ne 'WicHeic Repair Test') {
            throw "Candidate has unexpected identity: $productName $version"
          }
          Write-Host "MSI_RELEASE_VERSION_PASS version=$version"
          $db=$null;$installer=$null

      - name: Verify MSI installation and WIC roundtrip on temporary runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path -LiteralPath 'WicHeic-HEIC-x64.msi').Path
          $testExe = (Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $dll = (Resolve-Path -LiteralPath '(Build)/x64/Release/wic_heic.dll').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'wic-heic-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'wic-heic-uninstall.log'
          $installed = $false
          try {
            $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList ('/i "{0}" /qn /norestart /l*v "{1}"' -f $msi, $installLog) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "MSI installation failed with exit code $($proc.ExitCode)" }
            $installed = $true
            $key = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{0E8AB687-73A5-455B-8C19-B93CA9AC0EEB}\InprocServer32'
            $path = (Get-Item -LiteralPath $key -ErrorAction Stop).GetValue('')
            if (-not $path -or -not (Test-Path -LiteralPath $path)) {
              throw "MSI registered DLL path invalid: $path"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            $expected = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
            Write-Host "MSI DLL SHA256: $actual; x64 solution DLL SHA256: $expected"
            if ($actual -ne $expected) {
              throw "MSI installed DLL does not match tested x64 DLL: $path"
            }
            Write-Host "Installed MSI registered matching DLL: $path"
            Remove-Item -Path 'wictest/samples/out-*.heic' -Force -ErrorAction SilentlyContinue
            Push-Location -LiteralPath 'wictest'
            try {
              & $testExe
              if ($LASTEXITCODE -ne 0) { throw "MSI WIC roundtrip test failed: $LASTEXITCODE" }
            }
            finally { Pop-Location }
            Write-Host 'MSI install + WIC readback test PASSED'
          }
          finally {
            if ($installed) {
              $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList ('/x "{0}" /qn /norestart /l*v "{1}"' -f $msi, $uninstallLog) -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "MSI uninstall failed: $($proc.ExitCode)" }
              Write-Host 'MSI uninstall PASSED'
            }
          }

      - name: Verify isolated MSI uninstall restores WIC registration baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $after=& ./diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1 | Select-Object -Last 1
          & ./diagnostics/photos_trace/WIC_Preflight_Compare.ps1 -Before $env:WIC_BASELINE -After $after
          if(-not $?) { throw 'Read-only WIC restoration comparison failed' }

      # Upload PS5.1 diagnostic only after deliberate diagnostics(release): commit.
      # No DLL/MSI release and no changes to installed user environment.
      - name: Upload no-install Photos UI timing kit
        if: ${{ github.ref == 'refs/heads/fix/photos-118-selfwic-incremental' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'diagnostics(release):') }}
        uses: actions/upload-artifact@v4
        with:
          name: Photos-UI-Timeline-PS51-NoInstall-20261027
          path: |
            diagnostics/photos_trace/01_Photos_UI_Timeline.cmd
            diagnostics/photos_trace/Photos_UI_Timeline_Run.ps1
            diagnostics/photos_trace/Photos_UI_Timeline_Capture.ps1
            diagnostics/photos_trace/Photos_UI_Timeline_Correlate.ps1
            diagnostics/photos_trace/PhotosTrace_Start.ps1
            diagnostics/photos_trace/PhotosTrace_Stop.ps1
            diagnostics/photos_trace/README_UI_TIMELINE_JA.md
          if-no-files-found: error
          retention-days: 14

      # Never upload an MSI after every incremental push. A deliberate
      # release(candidate): commit triggers ONE candidate only AFTER all
      # WIC, MSI install/uninstall and COM restoration checks passed.
      - name: Prepare MSI candidate checksum and provenance
        if: ${{ github.ref == 'refs/heads/candidate/photos-responsive-1130-win10' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(candidate):') }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=(Resolve-Path -LiteralPath 'WicHeic-HEIC-x64.msi').Path
          $sha=(Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          if(-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw 'Release fixture is missing; refuse to publish untestable 1.1.30'
          }
          $fixtureInfo=Get-Item -LiteralPath $fixture
          if($fixtureInfo.Length -lt 1000 -or $fixtureInfo.Length -gt 33554432) {
            throw 'Release fixture size is outside expected 12MP synthetic bounds'
          }
          $fixtureSha=(Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
          @(
            "File: WicHeic-HEIC-x64.msi"
            "SHA256: $sha"
            "SyntheticFixture: wicfast_synthetic_4032x3024.heic"
            "SyntheticFixtureSHA256: $fixtureSha"
            "SyntheticFixtureBytes: $($fixtureInfo.Length)"
            "Commit: $env:GITHUB_SHA"
            "Actions run: $env:GITHUB_RUN_ID"
            "Status: Win10 Photos UI UNVERIFIED; Photos max 2 eligible workers, Explorer max 4; keep current MSI for rollback"
          ) | Set-Content -LiteralPath 'MSI_SHA256_AND_PROVENANCE.txt' -Encoding UTF8
          Get-Content -LiteralPath 'MSI_SHA256_AND_PROVENANCE.txt'

      - name: Upload one MSI candidate (Win10 Photos UNVERIFIED)
        if: ${{ github.ref == 'refs/heads/candidate/photos-responsive-1130-win10' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(candidate):') }}
        uses: actions/upload-artifact@v4
        with:
          name: WicHeic-1.1.30-x64-Photos-Responsive-UNVERIFIED-RC
          path: |
            WicHeic-HEIC-x64.msi
            MSI_SHA256_AND_PROVENANCE.txt
            docs/WIN10_PHOTOS_1130_RESPONSIVE_RELEASE_JA.md
            ${{ runner.temp }}/wicfast_synthetic_4032x3024.heic
            wictest/samples/fixture-irot3-exif6-noaux.heic
          if-no-files-found: error
          retention-days: 14

      # Push workflows create GitHub Checks, not commit statuses.
      # The linked commit-status reader will query this narrow bridge.
      - name: Report x64 CI result as commit status
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw 'GITHUB_TOKEN unavailable for commit status reporting'
          }
          $state = switch ($env:BUILD_RESULT) {
            'success' {'success';break}
            'cancelled' {'error';break}
            default {'failure'}
          }
          $link = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            state = $state
            context = 'ci/wic-heic-x64'
            description = "x64 synthetic WIC build/tests: $env:BUILD_RESULT"
            target_url = $link
          } | ConvertTo-Json -Compress
          $headers = @{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GITHUB_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='wic-heic-ci'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
          $result = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -ContentType 'application/json' -Body $body
          if($result.context -ne 'ci/wic-heic-x64' -or $result.state -ne $state) {
            throw 'Unexpected commit status API response'
          }
          Write-Host "CI_STATUS_PUBLISHED state=$state context=ci/wic-heic-x64"
          Write-Host "CI_RUN_URL $link"
