name: HEIC encoder repair - x64 build (experimental)

on:
  push:
    branches:
      - repair/heic-frame-encode-interface
      - investigate/rotated-exif-orientation
      - investigate/geometry-jpeg-vs-heic
      - feature/lossless-heic-rotation
      - feature/wic-heif-encoder-options
      - feature/lossless-wic-native
      - feature/wic-lossless-source-transfer
      - diagnostic/photos-wic-calltrace
      - fix/encoder-geometry-failsafe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-x64:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Check out pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Test lossless HEIC orientation metadata without recompression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile tools/lossless_heic_rotate_experimental.py
          if ($LASTEXITCODE -ne 0) { throw 'Lossless HEIC tool syntax invalid' }
          python tools/test_lossless_heic_rotate.py
          if ($LASTEXITCODE -ne 0) { throw 'Lossless HEIC metadata tests failed' }

      - name: Confirm source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'wic_heic/HeicBitmapFrameEncode.cpp' -Raw
          if (-not $source.Contains('IsEqualGUID(riid, IID_IWICBitmapFrameEncode)')) {
            throw 'Expected frame encoder QueryInterface fix is missing'
          }
          if ($source.Contains('IsEqualGUID(riid, IID_IWICBitmapFrameDecode)')) {
            throw 'Incorrect decoder IID remains in frame encoder'
          }
          Write-Host 'Frame encoder IID source check passed'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check CMake and NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "C:\Program Files\NASM;$env:PATH"
          }
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM not available' }

      - name: Restore project dependencies
        shell: pwsh
        run: |
          msbuild wic_heic.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed' }

      - name: Compute pinned codec dependency signature
        shell: pwsh
        run: |
          $refs = (git submodule status --recursive) -join "`n"
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($refs)
          $sha = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $key = [Convert]::ToHexString($sha).Substring(0, 20)
          "CODEC_DEPS=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore native codec build cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1

      - name: Build native codec dependencies (x64 only)
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($part in @('libde265','kvazaar','libheif')) {
            cmd /c "call build-$part.bat x64"
            if ($LASTEXITCODE -ne 0) { throw "Failed to build dependency: $part" }
          }
          if (-not (Test-Path '_out/x64/include')) { throw 'Missing x64 dependency include directory' }
          if (-not (Test-Path '_out/x64/lib')) { throw 'Missing x64 dependency lib directory' }

      - name: Save native codec build cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1

      - name: Build WIC HEIC DLL (Release x64)
        shell: pwsh
        run: |
          msbuild wic_heic/wic_heic.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Native DLL build failed' }

      - name: Inspect compiled DLL and record SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -LiteralPath 'wic_heic/(Build)' -Filter 'wic_heic.dll' -Recurse -File | Where-Object { $_.FullName -match 'x64' -and $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $dll) { throw 'No x64 Release wic_heic.dll was produced' }
          $hash = Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256
          "Build artifact: $($dll.FullName)" | Set-Content -Path 'SHA256.txt'
          "SHA256: $($hash.Hash)" | Add-Content -Path 'SHA256.txt'
          "Commit: $env:GITHUB_SHA" | Add-Content -Path 'SHA256.txt'
          Get-Content SHA256.txt

      - name: Build native WIC conversion smoke test (x64)
        shell: pwsh
        run: |
          msbuild wictest/wictest.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Native WIC test program failed to build' }

      - name: Test real WIC encode using checked-in sample images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $testExe = (Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $register = Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s', ('"{0}"' -f $dll)) -Wait -PassThru
          if ($register.ExitCode -ne 0) { throw "Runner-only COM registration failed: $($register.ExitCode)" }
          try {
            Push-Location -LiteralPath 'wictest'
            try {
              # Explicit opt-in, local test log only. The DLL never reads image
              # content into the trace or logs private names/paths.
              $trace = Join-Path (Get-Location).Path 'WIC_PhotosTrace_CI.txt'
              $env:WIC_HEIC_TRACE_FILE = $trace
              try {
                & $testExe
                if ($LASTEXITCODE -ne 0) { throw "Native WIC sample conversion test failed: $LASTEXITCODE" }
              }
              finally {
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              }
              if (-not (Test-Path -LiteralPath $trace)) { throw 'WIC opt-in trace was not produced' }
              $events = Get-Content -LiteralPath $trace
              foreach ($required in @('FrameInitializeOptions','WriteSourceLossless','EncoderCommitLossless','WriteSourceRejected','EncoderCommitRecompressed','EncoderSetThumbnail','EncoderSetColorContexts','EncoderMetadataWriterUnavailable')) {
                if (-not ($events | Where-Object { $_ -like "*event=$required *" })) { throw "Missing expected diagnostic event: $required" }
              }
              if ($events -match '(?i)\\samples\\|[A-Z]:\\|\.heic|\.jpg|\.png|GPS|EXIF|maker.?note') {
                throw 'Sensitive file-identifying content leaked into WIC trace'
              }
              $analyzer = Join-Path (Resolve-Path -LiteralPath '../diagnostics/photos_trace').Path 'PhotosTrace_Analyze.ps1'
              & $analyzer -TracePath $trace
              $summary = Get-ChildItem -LiteralPath '../diagnostics/photos_trace' -Filter 'WIC_Photos_Trace_Summary_*.txt' -File | Select-Object -First 1
              if (-not $summary) { throw 'WIC trace analyzer did not save a summary' }
              $body = Get-Content -LiteralPath $summary.FullName -Raw
              if ($body -notmatch 'EncoderCommitLossless=' -or $body -notmatch 'EncoderCommitRecompressed=') {
                throw 'WIC trace analyzer omitted required summary fields'
              }
              Write-Host "WIC opt-in trace passed; event lines=$($events.Count); no paths or image metadata"
              # Shell-warmup prototype uses no registration changes. Run only
              # on isolated synthetic HEIC copies and verify source integrity.
              $warmup=(Resolve-Path -LiteralPath '../diagnostics/thumbnail_warmup/Explorer_HEIC_Warmup.ps1').Path
              $self=@(& $warmup -Mode SelfTest)
              if(-not ($self -match 'WARMUP_SELFTEST_PASSED')) { throw 'HEIC shell warmup self-test failed' }
              # In a CI service session there is no interactive Explorer window.
              # Verify the watch loop starts and automatically stops without UI.
              $watch=@(& $warmup -Mode Watch -DurationSeconds 5 -MaxFiles 1)
              if(-not ($watch -match 'WARMUP_WATCH_COMPLETED')) {
                throw "HEIC warmup watch auto-exit failed: $($watch -join ',')"
              }
              $warmFolder=Join-Path $env:RUNNER_TEMP ('wic_thumb_warm_'+$PID+'_'+[guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $warmFolder | Out-Null
              try {
                $source=(Resolve-Path -LiteralPath 'samples/fixture-irot3-exif6-noaux.heic').Path
                $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash
                for($i=0;$i -lt 3;$i++) {
                  Copy-Item -LiteralPath $source -Destination (Join-Path $warmFolder ('test'+$i+'.heic'))
                }
                $first=@(& $warmup -Mode Folder -Folder $warmFolder -MaxFiles 3 -DurationSeconds 30)
                if(-not ($first -match 'attempted=3 cached=0 generated=3 failed=0')) {
                  throw "Shell warmup did not prime all synthetic images: $($first -join ',')"
                }
                $revisit=@(& $warmup -Mode Folder -Folder $warmFolder -MaxFiles 3 -DurationSeconds 30)
                if(-not ($revisit -match 'attempted=3 cached=3 generated=0 failed=0')) {
                  throw "Shell warmup did not skip cached images: $($revisit -join ',')"
                }
                if((Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash -ne $sourceHash) {
                  throw 'HEIC shell warmer changed its original fixture'
                }
                Write-Host 'EXPLORER_WARMUP_SYNTHETIC_CACHE_REVISIT_PASSED'
              } finally {
                Remove-Item -LiteralPath $warmFolder -Recurse -Force -ErrorAction SilentlyContinue
              }

            }
            finally {
              Pop-Location
            }
          }
          finally {
            $unregister = Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u', '/s', ('"{0}"' -f $dll)) -Wait -PassThru
            if ($unregister.ExitCode -ne 0) { Write-Warning "Runner-only COM deregistration failed: $($unregister.ExitCode)" }
          }

      - name: Confirm HKCU trace reaches real WIC codec without environment override
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $root=(Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $start=Join-Path $root 'PhotosTrace_Start.ps1'
          $stop=Join-Path $root 'PhotosTrace_Stop.ps1'
          Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($reg.ExitCode -ne 0) { throw 'HKCU trace COM registration failed' }
          $started=$false
          try {
            & $start
            $started=$true
            $props=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            $trace=[string]$props.TraceFile
            if(-not $trace -or -not (Test-Path -LiteralPath $trace)) { throw 'HKCU trace log not created' }
            Push-Location -LiteralPath 'wictest'
            try {
              & $exe
              if($LASTEXITCODE -ne 0) { throw 'Native WIC test failed with HKCU trace enabled' }
            } finally { Pop-Location }
            $lines=@(Get-Content -LiteralPath $trace -Encoding UTF8)
            foreach($event in @('DecoderOpen','EncoderInitialize','FrameInitializeOptions','EncoderCommitLossless')) {
              if(-not ($lines | Where-Object { $_ -match ('\bevent='+$event+' ') })) {
                throw "HKCU trace missing actual native WIC event: $event"
              }
            }
            $lengthBefore=(Get-Item -LiteralPath $trace).Length
            if($lengthBefore -eq 0) { throw 'HKCU capture was empty' }
            # Expire tracing in the disposable runner and verify that the codec
            # does not append events. Restore the deadline before Stop to
            # preserve its ownership verification.
            $deadline=[long]$props.TraceUntilFileTime
            try {
              Set-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceUntilFileTime -Value ([DateTime]::UtcNow.AddMinutes(-1).ToFileTimeUtc()) -ErrorAction Stop
              Push-Location -LiteralPath 'wictest'
              try {
                & $exe
                if($LASTEXITCODE -ne 0) { throw 'Native WIC test failed with expired trace' }
              } finally { Pop-Location }
              $lengthAfter=(Get-Item -LiteralPath $trace).Length
              if($lengthBefore -ne $lengthAfter) { throw 'Expired HKCU diagnostic trace still appended' }
            } finally {
              Set-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceUntilFileTime -Value $deadline -ErrorAction Stop
            }
            Write-Host 'HKCU_TRACE_AND_EXPIRATION_PASSED (native runner, NOT Windows Photos)'
          } finally {
            if($started) { & $stop }
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unreg.ExitCode -ne 0) { throw 'HKCU trace COM deregistration failed' }
          }

      - name: Verify privacy-limited Photos trace enable and clean shutdown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          try {
            & (Join-Path $root 'PhotosTrace_Start.ps1')
            $prop = Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            if (-not $prop.TraceFile -or -not (Test-Path -LiteralPath $prop.TraceFile)) {
              throw 'Trace start failed to register local output'
            }
            if (-not $prop.TraceUntilFileTime) { throw '20-minute automatic expiration absent' }
            $path = $prop.TraceFile
          }
          finally {
            & (Join-Path $root 'PhotosTrace_Stop.ps1')
          }
          $remaining = Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -Name TraceFile -ErrorAction SilentlyContinue
          if ($remaining -and $remaining.TraceFile) {
            throw 'Trace setting not cleaned up by Stop'
          }
          if (-not (Test-Path -LiteralPath $path)) {
            throw 'Trace evidence log was unexpectedly deleted'
          }
          Write-Host 'Privacy-limited WIC Photos trace start/stop passed'

      - name: Reject foreign or partially configured trace registry values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\WicHeic'
          $root = (Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $start = Join-Path $root 'PhotosTrace_Start.ps1'
          $state = Join-Path $root 'WIC_Photos_Trace_ACTIVE.txt'
          if (Test-Path -LiteralPath $state) { throw 'Unexpected active trace state in CI' }
          $existing = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
          if ($existing -and ((@($existing.PSObject.Properties.Name) -contains 'TraceFile') -or
                             (@($existing.PSObject.Properties.Name) -contains 'TraceUntilFileTime'))) {
            throw 'Unexpected existing trace values in fresh runner'
          }
          # Previously the start script overwrote this deadline, then deleted it on failure.
          New-ItemProperty -Path $key -Name TraceUntilFileTime -PropertyType QWord -Value ([long]123456789) | Out-Null
          try {
            $blocked = $false
            try { & $start | Out-Null } catch { $blocked = $true }
            if (-not $blocked) { throw 'Start accepted an existing deadline' }
            $still = Get-ItemProperty -Path $key
            if ([long]$still.TraceUntilFileTime -ne 123456789) { throw 'Pre-existing deadline was changed' }
            if (Test-Path -LiteralPath $state) { throw 'Rejected trace created state file' }
          } finally {
            Remove-ItemProperty -Path $key -Name TraceUntilFileTime -ErrorAction Stop
          }
          New-ItemProperty -Path $key -Name TraceFile -PropertyType String -Value '' | Out-Null
          try {
            $blocked = $false
            try { & $start | Out-Null } catch { $blocked = $true }
            if (-not $blocked) { throw 'Start accepted an existing empty TraceFile' }
            $still = Get-ItemProperty -Path $key
            if (-not (@($still.PSObject.Properties.Name) -contains 'TraceFile')) {
              throw 'Pre-existing TraceFile value was removed'
            }
            if (Test-Path -LiteralPath $state) { throw 'Rejected trace created state file' }
          } finally {
            Remove-ItemProperty -Path $key -Name TraceFile -ErrorAction Stop
          }
          Write-Host 'PASS: pre-existing trace registry settings are not changed'

      - name: Verify strict 2MiB trace cap on native synthetic fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $dll)) -Wait -PassThru
          if($reg.ExitCode -ne 0) { throw 'Trace cap test COM registration failed' }
          try {
            Push-Location -LiteralPath 'wictest'
            try {
              $cap=Join-Path (Get-Location).Path 'WIC_TraceCap_CI.txt'
              [IO.File]::WriteAllBytes($cap,(New-Object byte[] ((2*1024*1024)-40)))
              $env:WIC_HEIC_TRACE_FILE=$cap
              try {
                & $exe
                if($LASTEXITCODE -ne 0) { throw 'Synthetic test failed during trace cap test' }
              } finally {
                Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
              }
              $length=(Get-Item -LiteralPath $cap).Length
              if($length -gt 2*1024*1024) { throw "Trace exceeded 2MiB ($length bytes)" }
              Write-Host "TRACE_CAP_PASS length=$length"
            } finally { Pop-Location }
          } finally {
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $dll)) -Wait -PassThru
            if($unreg.ExitCode -ne 0) { throw 'Trace cap test COM deregistration failed' }
          }

      - name: Save read-only baseline of WIC registration before isolated MSI test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $snapshot=& ./diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1 | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $snapshot)) { throw 'WIC inventory did not create snapshot' }
          $data=Get-Content -LiteralPath $snapshot -Raw | ConvertFrom-Json
          if(@($data.Registrations).Count -ne 12) { throw 'Incomplete 32/64-bit COM registration inventory' }
          "WIC_BASELINE=$snapshot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'WIC read-only baseline recorded'

      - name: Verify pinned synthetic HEIC custody and copy integrity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=& ./diagnostics/photos_trace/PhotosSynthetic_Prepare.ps1 | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $folder)) { throw 'Missing synthetic session' }
          $result=& ./diagnostics/photos_trace/PhotosSynthetic_Verify.ps1 -SessionDirectory $folder
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=UNCHANGED')) {
            throw 'Synthetic original/reference baseline failed'
          }
          # Simulate Photos changing ONLY the disposable work file; never touch reference.
          $working=Join-Path $folder 'work/synthetic-working.heic'
          $handle=[IO.File]::Open($working,[IO.FileMode]::Open,[IO.FileAccess]::Write,[IO.FileShare]::None)
          try { $handle.Seek(0,[IO.SeekOrigin]::End) | Out-Null; $handle.WriteByte(0) }
          finally { $handle.Dispose() }
          $result=& ./diagnostics/photos_trace/PhotosSynthetic_Verify.ps1 -SessionDirectory $folder
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=MODIFIED')) {
            throw 'Synthetic work-file change not detected'
          }
          Write-Host 'SYNTHETIC_CUSTODY_CI_PASS'

      - name: Validate user-compatible Windows PowerShell 5.1 tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if($PSVersionTable.PSVersion.Major -ne 5) { throw 'This test must use Windows PowerShell 5.1' }
          $root=(Resolve-Path -LiteralPath 'diagnostics/photos_trace').Path
          $prepare=Join-Path $root 'PhotosSynthetic_Prepare.ps1'
          $verify=Join-Path $root 'PhotosSynthetic_Verify.ps1'
          $preflight=Join-Path $root 'WIC_Preflight_ReadOnly.ps1'
          $compare=Join-Path $root 'WIC_Preflight_Compare.ps1'
          $folder=& $prepare | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $folder)) { throw 'PS5.1 synthetic preparation failed' }
          $result=@(& $verify -SessionDirectory $folder)
          if(-not ($result -match 'SYNTHETIC_REFERENCE_PASS') -or
             -not ($result -match 'SYNTHETIC_WORKING_STATUS=UNCHANGED')) {
            throw 'PS5.1 synthetic verification failed'
          }
          $outside=Join-Path $root 'README_JA.md'
          $blocked=$false
          try { & $verify -SessionDirectory $outside | Out-Null } catch { $blocked=$true }
          if(-not $blocked) { throw 'PS5.1 verifier accepted an unrelated input path' }
          $before=& $preflight | Select-Object -Last 1
          $after=& $preflight | Select-Object -Last 1
          if(-not (Test-Path -LiteralPath $before) -or -not (Test-Path -LiteralPath $after)) {
            throw 'PS5.1 WIC inventory did not write local snapshots'
          }
          & $compare -Before $before -After $after
          # Regression: PowerShell's automatic $Matches variable is overwritten by -match.
          # A synthetic HKCU MSI entry must not corrupt our independent list.
          $syntheticKey='HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\WicHeicSyntheticPreflightCI'
          if(Test-Path -LiteralPath $syntheticKey) { throw 'Synthetic CI uninstall key already exists' }
          try {
            New-Item -Path $syntheticKey -Force | Out-Null
            New-ItemProperty -Path $syntheticKey -Name DisplayName -PropertyType String -Value 'WicHeic Synthetic CI' | Out-Null
            New-ItemProperty -Path $syntheticKey -Name DisplayVersion -PropertyType String -Value '0.0.0-ci' | Out-Null
            $syntheticSnapshot=& $preflight | Select-Object -Last 1
            $syntheticData=Get-Content -LiteralPath $syntheticSnapshot -Raw -Encoding UTF8 | ConvertFrom-Json
            $found=@($syntheticData.WicHeicMsi | Where-Object {
              $_.ProductKey -eq 'WicHeicSyntheticPreflightCI' -and $_.Name -eq 'WicHeic Synthetic CI'
            })
            if($found.Count -ne 1) { throw 'PowerShell 5.1 MSI inventory regression: expected injected entry missing' }
            Write-Host 'WIC_MSI_MATCHES_REGRESSION_PASS'
          } finally {
            Remove-Item -LiteralPath $syntheticKey -Recurse -Force -ErrorAction SilentlyContinue
          }
          $start=Join-Path $root 'PhotosTrace_Start.ps1'
          $stop=Join-Path $root 'PhotosTrace_Stop.ps1'
          try {
            & $start
            $props=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction Stop
            if(-not $props.TraceFile -or -not (Test-Path -LiteralPath $props.TraceFile)) {
              throw 'PS5.1 trace registry opt-in failed'
            }
          } finally { & $stop }
          Write-Host 'WINDOWS_POWERSHELL_5_1_TOOLCHAIN_PASSED'

      - name: Build experimental replacement x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild wic_heic.sln /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "x64 installer build failed: $LASTEXITCODE" }
          $msi = Get-ChildItem -LiteralPath '(Build)' -Filter 'WicHeic.msi' -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' -and $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $msi) { throw 'x64 WicHeic.msi not found' }
          Copy-Item -LiteralPath $msi.FullName -Destination 'WicHeic-HEIC-x64.msi'
          Get-FileHash 'WicHeic-HEIC-x64.msi' -Algorithm SHA256 |
            Format-List

      - name: Verify MSI installation and WIC roundtrip on temporary runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path -LiteralPath 'WicHeic-HEIC-x64.msi').Path
          $testExe = (Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          $dll = (Resolve-Path -LiteralPath '(Build)/x64/Release/wic_heic.dll').Path
          $installLog = Join-Path $env:RUNNER_TEMP 'wic-heic-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'wic-heic-uninstall.log'
          $installed = $false
          try {
            $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList ('/i "{0}" /qn /norestart /l*v "{1}"' -f $msi, $installLog) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "MSI installation failed with exit code $($proc.ExitCode)" }
            $installed = $true
            $key = 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{0E8AB687-73A5-455B-8C19-B93CA9AC0EEB}\InprocServer32'
            $path = (Get-Item -LiteralPath $key -ErrorAction Stop).GetValue('')
            if (-not $path -or -not (Test-Path -LiteralPath $path)) {
              throw "MSI registered DLL path invalid: $path"
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            $expected = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
            Write-Host "MSI DLL SHA256: $actual; x64 solution DLL SHA256: $expected"
            if ($actual -ne $expected) {
              throw "MSI installed DLL does not match tested x64 DLL: $path"
            }
            Write-Host "Installed MSI registered matching DLL: $path"
            Remove-Item -Path 'wictest/samples/out-*.heic' -Force -ErrorAction SilentlyContinue
            Push-Location -LiteralPath 'wictest'
            try {
              & $testExe
              if ($LASTEXITCODE -ne 0) { throw "MSI WIC roundtrip test failed: $LASTEXITCODE" }
            }
            finally { Pop-Location }
            Write-Host 'MSI install + WIC readback test PASSED'
          }
          finally {
            if ($installed) {
              $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList ('/x "{0}" /qn /norestart /l*v "{1}"' -f $msi, $uninstallLog) -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "MSI uninstall failed: $($proc.ExitCode)" }
              Write-Host 'MSI uninstall PASSED'
            }
          }

      - name: Upload MSI only after isolated installation verification
        uses: actions/upload-artifact@v4
        with:
          name: WicHeic-HEIC-x64-MSI-only-Win10-Photos-UNVERIFIED
          path: WicHeic-HEIC-x64.msi
          if-no-files-found: error
          retention-days: 14

      - name: Verify isolated MSI uninstall restores WIC registration baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $after=& ./diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1 | Select-Object -Last 1
          & ./diagnostics/photos_trace/WIC_Preflight_Compare.ps1 -Before $env:WIC_BASELINE -After $after
          if(-not $?) { throw 'Read-only WIC restoration comparison failed' }
