name: Fast CI D3D11 HEVC Main/Main10 hardware capability probe
on:
  push:
    branches: [experiment/heic-gpu-caps-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caps:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compile and run read-only Direct3D HEVC profile probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/D3D11HevcCaps.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'D3D11 HEVC profile probe did not compile'}
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/D3D11HevcCaps.exe').Path
          & $exe
          if($LASTEXITCODE -ne 0){throw 'D3D11 capability probe failed'}
          Write-Host 'HEIC_GPU_CAPS_CI_WIN_SERVER_CHECK_PASSED_NOT_INTEL_USER_PC'

      - name: Set up FFmpeg for pinned HEIC sample bitstream parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)){
            choco install ffmpeg -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'Research-only FFmpeg installation failed'}
            $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH"
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          if(-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)){throw 'ffmpeg.exe not found'}
      - name: Inspect read-only HEIC rotation metadata for safe transform selection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeicMetadataSignals.ps1
          if(-not $?){throw 'HEIC metadata inventory failed'}
      - name: Prove mirrors, shear, translation, or conflicting metadata fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeicOrientationPolicyTests.ps1
          if(-not $?){throw 'HEIC orientation safety policy tests failed'}
      - name: Validate metadata-selected HEIC orientation against AnnexB exact pixels
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeicMetadataDirectedParity.ps1
          if(-not $?){throw 'Metadata-directed HEIC rendering parity failed'}
      - name: Investigate existing HEIC fixture colors and rotation via AnnexB
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeicBridgeRepoCorpus.ps1
          if(-not $?){throw 'HEIC bridge corpus audit failed'}

