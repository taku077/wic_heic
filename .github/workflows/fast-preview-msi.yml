name: HEIC real-extension fast thumbnail preview MSI
on:
  push:
    branches: [preview/fast-heic-thumbnail-msi-v0.1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  fast-preview:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build fast Shell DLL and dedicated per-user MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeicShellFastPreview.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Fast thumbnail DLL build failed'}
          msbuild Installer/FastPreview.wixproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Fast thumbnail MSI build failed'}
      - name: Download already CI-tested WIC decoder MSI for isolated runtime test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'pinned-wic-codec'
          New-Item -ItemType Directory -Path $folder | Out-Null
          gh run download 39560736899 -n WicHeic-HEIC-x64-MSI-only-Win10-Photos-UNVERIFIED -D $folder -R taku077/wic_heic
          if($LASTEXITCODE -ne 0){throw 'Pinned CI-verified decoder MSI unavailable'}
          $codec=Join-Path $folder 'WicHeic-HEIC-x64.msi'
          if(-not (Test-Path -LiteralPath $codec)){throw 'Downloaded WIC MSI missing'}
          "PINNED_WIC_MSI=$codec" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify actual .heic Shell extraction and reversible MSI install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $codec=$env:PINNED_WIC_MSI
          $msi=(Resolve-Path -LiteralPath '(Build)/x64/Release/en-US/WicHeicFastPreview.msi').Path
          $fixture=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
          Write-Host 'FAST_PREVIEW_CI_BEFORE_PINNED_WIC_INSTALL'
          $p=Start-Process msiexec.exe -ArgumentList ('/i "{0}" /qn /norestart' -f $codec) -Wait -PassThru
          Write-Host ('FAST_PREVIEW_CI_PINNED_WIC_INSTALL_CODE='+$p.ExitCode)
          if($p.ExitCode -ne 0){throw "Pinned WIC MSI install failed $($p.ExitCode)"}
          try{
            Write-Host 'FAST_PREVIEW_CI_BEFORE_SMOKE'
            & ./diagnostics/thumbnail_warmup/CI_FastPreviewMsi.ps1 -MsiPath $msi -FixturePath $fixture
            if(-not $?){throw 'Real HEIC fast preview test failed'}
            Write-Host 'FAST_PREVIEW_CI_SMOKE_RETURNED'
          }finally{
            Write-Host 'FAST_PREVIEW_CI_BEFORE_PINNED_WIC_UNINSTALL'
            $p=$null
            for($attempt=0;$attempt -lt 8;$attempt++){
              $p=Start-Process msiexec.exe -ArgumentList ('/x "{0}" /qn /norestart' -f $codec) -Wait -PassThru
              Write-Host ('FAST_PREVIEW_CI_PINNED_WIC_UNINSTALL_CODE='+$p.ExitCode+' attempt='+$attempt)
              if($p.ExitCode -ne 1618){break}
              Start-Sleep -Seconds 2
            }
            if($p.ExitCode -ne 0){throw "Pinned WIC MSI uninstall failed $($p.ExitCode)"}
          }
      - name: Upload real .heic Fast Thumbnail MSI after all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: WicHeic-FastThumbnail-Preview-v0.1-Win10-UNVERIFIED
          path: (Build)/x64/Release/en-US/WicHeicFastPreview.msi
          if-no-files-found: error
          retention-days: 14
