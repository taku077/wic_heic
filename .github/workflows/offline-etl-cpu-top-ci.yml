name: Offline ETL all-process CPU summary (NO uploaded user trace)
on:
  push:
    branches:
      - investigate/win10-100cpu-after-1133-20261030
    paths:
      - 'tools/etl_cpu_top/**'
      - '.github/workflows/offline-etl-cpu-top-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-readonly:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows 10 native ETL offline CPU attribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build tools/etl_cpu_top/EtlCpuTop.csproj -c Release /p:PlatformTarget=x64 --nologo
          if($LASTEXITCODE -ne 0){throw 'NET48 offline CPU analyzer compilation failed'}
          $exe='tools/etl_cpu_top/bin/Release/net48/WicHeic_EtlCpuTop_ReadOnly.exe'
          if(-not(Test-Path $exe)){throw 'No executable'}
          $help=& $exe --help
          if($LASTEXITCODE -ne 0 -or -not (($help -join ' ').Contains('OFFLINE') -or ($help -join ' ').Contains('offline'))){
            throw 'Command help smoke test failed'
          }
          $pidTest=& $exe --self-test
          if($LASTEXITCODE -ne 0 -or -not (($pidTest -join ' ').Contains('PID_BUCKET_SELFTEST_PASS'))){
            throw 'Two same-name instances were not reliably separated by PID'
          }
          $out=Join-Path $env:RUNNER_TEMP 'cpu_report_never_overwrite.txt'
          Set-Content -LiteralPath $out -Value 'ORIGINAL' -NoNewline
          $source=Join-Path $env:RUNNER_TEMP 'artificial-blank.etl'
          Set-Content -LiteralPath $source -Value 'INVALID'
          & $exe $source $out | Out-Null
          if($LASTEXITCODE -ne 4 -or (Get-Content $out -Raw) -ne 'ORIGINAL'){
            throw 'Existing report overwritten or clobber gate failed'
          }
          $global:LASTEXITCODE=0 # Expected prior tool failure (exit 4) was asserted above.
          $tokens=$null; $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/etl_cpu_top/Run_Existing_ETL_CPU_Report.ps1).Path,
            [ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -gt 0){throw 'PowerShell GUI entrypoint has parser errors'}
          $outDir='tools/etl_cpu_top/bin/Release/net48'
          Copy-Item -LiteralPath 'tools/etl_cpu_top/Run_Existing_ETL_CPU_Report.ps1' -Destination $outDir
          Copy-Item -LiteralPath 'tools/etl_cpu_top/Run_Existing_ETL_CPU_Report.cmd' -Destination $outDir
          Copy-Item -LiteralPath 'tools/etl_cpu_top/README_JA.md' -Destination $outDir
          Write-Host 'ETL_CPU_ALL_PROCESS_TOOL_BUILD_AND_NO_OVERWRITE_PASS'
      - name: Smoke-test real short synthetic WPR CPU ETL (never user data)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $wpr=Get-Command wpr.exe -ErrorAction SilentlyContinue
          if(-not $wpr){
            Write-Host 'ETL_PARSER_REAL_WPR_TEST_SKIPPED_NO_WPR'
            exit 0
          }
          $etl=Join-Path $env:RUNNER_TEMP 'ci_short_kernel_cpu_synthetic.etl'
          $report=Join-Path $env:RUNNER_TEMP 'ci_short_kernel_cpu_report.txt'
          if((Test-Path $etl) -or (Test-Path $report)){throw 'Do not overwrite pre-existing fixtures'}
          $started=$false
          try {
            & $wpr.Source -start CPU.light
            $code=$LASTEXITCODE
            if($code -ne 0){
              Write-Host ('ETL_PARSER_REAL_WPR_TEST_SKIPPED_NO_KERNEL_PRIVILEGES exit='+$code)
              $global:LASTEXITCODE=0
            } else {
              $started=$true
              $sw=[System.Diagnostics.Stopwatch]::StartNew()
              $value=0.0
              while($sw.Elapsed.TotalSeconds -lt 3){
                for($i=1;$i -le 10000;$i++){ $value+=[Math]::Sqrt($i) }
              }
              & $wpr.Source -stop $etl -skipPdbGen
              if($LASTEXITCODE -ne 0){throw 'WPR synthetic CPU stop failed'}
              $started=$false
              if(-not(Test-Path $etl)){throw 'Synthetic WPR trace missing'}
              $exe=(Resolve-Path 'tools/etl_cpu_top/bin/Release/net48/WicHeic_EtlCpuTop_ReadOnly.exe').Path
              & $exe $etl $report
              if($LASTEXITCODE -ne 0){throw 'ETL CPU parser failed on real WPR synthetic fixture'}
              $summary=Get-Content -LiteralPath $report -Raw
              if(-not $summary.Contains('TOP EXECUTABLE NAMES') -or
                 -not $summary.Contains('TOP PROCESS INSTANCES') -or
                 -not $summary.Contains('TOP 10-SECOND WINDOWS') -or
                 -not $summary.Contains('WithThreadID=') -or
                 -not $summary.Contains('NoThreadID=')){
                throw 'Synthetic ETL CPU report missing all-process sample summary'
              }
              Write-Host 'ETL_CPU_ALL_PROCESS_REAL_WPR_SAMPLED_PARSE_PASS'
              $global:LASTEXITCODE=0
            }
          } finally {
            if($started){ & $wpr.Source -cancel | Out-Null }
            Remove-Item -LiteralPath $etl,$report -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE=0
      - name: Upload read-only offline Windows 10 tool
        uses: actions/upload-artifact@v4
        with:
          name: WicHeic-Offline-Existing-ETL-CPU-Reader-ReadOnly-UNVERIFIED
          path: tools/etl_cpu_top/bin/Release/net48/**
          if-no-files-found: error
          retention-days: 7
