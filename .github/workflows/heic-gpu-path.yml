name: HEIC D3D11 GPU feasibility and AnnexB bridge without MSI
on:
  push:
    branches: [experiment/heic-gpu-decode-probe, experiment/heic-gpu-d3d11va-firstframe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avx2-ab:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compute precise dependency cache key
        shell: pwsh
        run: |
          $refs=(git submodule status --recursive) -join ([string][char]10)
          $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))).Substring(0,20)
          "CODEC_DEPS=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore baseline native dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Install NASM on baseline native build cache miss
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            choco install nasm -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'NASM setup failed'}
            $env:PATH="C:\Program Files\NASM;$env:PATH"
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Compile baseline libheif and libde265 if not cached
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('libde265','kvazaar','libheif')){
            cmd /c "call build-$name.bat x64"
            if($LASTEXITCODE -ne 0){throw "Baseline native dependency failed: $name"}
          }
      - name: Save baseline native build cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build baseline WIC HEIC DLL and test tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:CL='/DWIC_HEIC_PRIVATE_FAST_ADAPTIVE'
          msbuild wic_heic/wic_heic.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Baseline WIC decoder compile failed'}
          Remove-Item Env:\CL
          $root=(Resolve-Path $env:RUNNER_TEMP).Path
          $base=Join-Path $root 'BaselineWicCodec.dll'
          Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination $base
          "BASELINE_CODEC=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          msbuild wictest/isolated_shell/Synthetic12MpHeic.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Synthetic12MpHeic compile failed'}
      - name: Generate synthetic 12MP HEIC for equal-input A/B and record SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          $tool=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/Synthetic12MpHeic.exe').Path
          & $tool $env:BASELINE_CODEC $fixture
          if($LASTEXITCODE -ne 0){throw 'Synthetic HEIC creation failed'}
          "AVX2_INPUT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AVX2_INPUT_SHA=$((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Read ordered HEIF irot imir clap properties on pinned samples
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeifPrimaryTransforms.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'HEIF primary item property audit did not compile'}
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifPrimaryTransforms.exe').Path
          & $exe
          if($LASTEXITCODE -ne 0){throw 'HEIF item property audit failed'}
          Write-Host 'HEIC_PRIMARY_ITEM_TRANSFORMS_CI_READONLY_PASSED'
      - name: Verify provisional GPU 8bit preflight rejects unsafe HEIC types
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifPrimaryTransforms.exe').Path
          $output=@(& $exe)
          if($LASTEXITCODE -ne 0){throw 'HEIF item inspection failed'}
          $pre=@($output | Where-Object {$_ -like 'HEIC_GPU_PRECHECK file=*'})
          if($pre.Count -ne 7){throw 'Incomplete GPU preflight'}
          foreach($line in $pre){
            $isCandidate=$line.EndsWith('candidate=1 rejection_mask=0')
            $isSafe=(($line -like '*bpp=8/8 alpha=0 rawICCbytes=0 *') -or ($line -like '*bpp=10/10 alpha=0 rawICCbytes=0 *'))
            if($isCandidate -and -not $isSafe){throw "Unsafe GPU candidate: $line"}
            if($line -notmatch 'candidate=[01] rejection_mask=[0-9]+$'){throw "Invalid GPU record: $line"}
          }
          $safeMain10=@($pre | Where-Object {$_ -like '*route=main10 candidate=1 rejection_mask=0'})
          if($safeMain10.Count -ne 2){throw 'Pinned two 10-bit opaque HEIC examples were not preserved as Main10 candidates'}
          Write-Host 'HEIC_GPU_PRECHECK_MAIN10_TWO_OPAQUE_FIXTURES_PASSED'
          Write-Host 'HEIC_GPU_PRECHECK_CLASSIFICATION_GUARDS_PASS'
      - name: Compile and run D3D11 HEVC profile capability check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/D3D11HevcCaps.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'D3D11 HEVC capability compile failed'}
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/D3D11HevcCaps.exe').Path
          & $exe
          if($LASTEXITCODE -ne 0){throw 'D3D11 decoder profile query failed'}
          Write-Host 'HEIC_GPU_D3D11_READONLY_PROBE_PASSED'
      - name: Ensure FFmpeg HEIC copy utility in disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $command=Get-Command ffmpeg -ErrorAction SilentlyContinue
          if(-not $command){
            choco install ffmpeg -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'FFmpeg CLI installation failed'}
            $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH"
            $command=Get-Command ffmpeg -ErrorAction SilentlyContinue
          }
          if(-not $command){throw 'FFmpeg CLI unavailable'}
          "HEIC_BRIDGE_FFMPEG=$($command.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "HEIC_BRIDGE_FFMPEG_SHA256=$((Get-FileHash $command.Source -Algorithm SHA256).Hash)"
      - name: Cross-check independent libheif and FFprobe transform metadata before GPU routing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeifCrosscheckRotation.ps1
          if(-not $?){throw 'HEIF versus FFprobe orientation validation failed'}
      - name: Build direct libheif HEVC AnnexB source parser (no FFmpeg process to extract)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeifNativeAnnexB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Direct HEIC encoded-image to HEVC AnnexB bridge failed to compile'}
          Write-Host 'HEIC_NATIVE_ANNEXB_CPP_COMPILED_NO_REGISTER'
      - name: Refuse malformed HEVC NAL, hvcC and ISOBMFF lengths before GPU submission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifNativeAnnexB.exe').Path
          & $exe --selftest
          if($LASTEXITCODE -ne 0){throw 'Annex B malformed-input selftests failed'}
          Write-Host 'HEIC_NATIVE_ANNEXB_MALFORMED_INPUT_GUARDS_CI_PASSED'
      - name: Compare native HEIC raw-item AnnexB output against FFmpeg reference pixels
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifNativeAnnexB.exe').Path
          $ffmpeg=$env:HEIC_BRIDGE_FFMPEG
          $dest=Join-Path $env:RUNNER_TEMP 'heic_native_bridge'
          if(Test-Path -LiteralPath $dest){throw 'Refuse to reuse output directory'}
          New-Item -ItemType Directory -Path $dest | Out-Null
          $names=@('03.heic','04.heic','05.heic','06.heic','07.heic',
                   'fixture-irot3-exif6-noaux.heic','fixture-irot3-exif6.heic')
          $corpus=(Resolve-Path 'wictest/samples').Path
          $sources=@($names | ForEach-Object {Join-Path $corpus $_}) + @($env:AVX2_INPUT)
          $count=0
          foreach($source in $sources) {
            $name=[IO.Path]::GetFileNameWithoutExtension($source)
            $result=Join-Path $dest "$name.h265"
            $reference=Join-Path $dest "$name.heic.bgra"
            $recreated=Join-Path $dest "$name.native.bgra"
            $hash=(Get-FileHash $source -Algorithm SHA256).Hash
            & $exe $source $result
            if($LASTEXITCODE -ne 0){throw "Native HEIC stream extraction failed for $name"}
            & $ffmpeg -hide_banner -nostdin -loglevel error -noautorotate -i $source -frames:v 1 -pix_fmt bgra -f rawvideo $reference
            if($LASTEXITCODE -ne 0){throw "Original HEIC unrotated decode failed for $name"}
            & $ffmpeg -hide_banner -nostdin -loglevel error -f hevc -i $result -frames:v 1 -pix_fmt bgra -f rawvideo $recreated
            if($LASTEXITCODE -ne 0){throw "Native HEVC Annex B decode failed for $name"}
            $left=(Get-FileHash $reference -Algorithm SHA256).Hash
            $right=(Get-FileHash $recreated -Algorithm SHA256).Hash
            $exact=$left -eq $right -and ((Get-Item $reference).Length -eq (Get-Item $recreated).Length)
            Write-Host "HEIC_NATIVE_ANNEXB_COMPARE file=$name exact=$exact output_bytes=$((Get-Item $result).Length)"
            if(-not $exact){throw "Native HEIC reconstruction pixel mismatch for $name"}
            if((Get-FileHash $source -Algorithm SHA256).Hash -ne $hash){throw "Source changed: $name"}
            $count++
          }
          if($count -ne 8){throw 'Incomplete reference corpus'}
          Write-Host 'HEIC_NATIVE_ANNEXB_EIGHT_IMAGES_EXACT_NO_REENCODING_PASSED'
      - name: Test HEIC frame lossless extraction into HEVC Annex B (no real photos)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $in=$env:AVX2_INPUT
          $ffmpeg=$env:HEIC_BRIDGE_FFMPEG
          $temp=$env:RUNNER_TEMP
          if($in -ne (Join-Path $temp 'wicfast_synthetic_4032x3024.heic')){throw 'Only generated synthetic HEIC allowed'}
          if((Get-FileHash $in -Algorithm SHA256).Hash -ne $env:AVX2_INPUT_SHA){throw 'Artificial HEIC source hash mismatch'}
          $annexB=Join-Path $temp 'wicfast_synthetic_4032x3024.h265'
          $reference=Join-Path $temp 'wicfast_heif_ref_4032x3024.bgra'
          $recreated=Join-Path $temp 'wicfast_annexb_ref_4032x3024.bgra'
          foreach($path in @($annexB,$reference,$recreated)){
            if(Test-Path -LiteralPath $path){throw 'Output already exists; refusing overwrite'}
          }
          & $ffmpeg -hide_banner -nostdin -loglevel error -threads 2 -i $in -frames:v 1 -pix_fmt bgra -f rawvideo $reference
          if($LASTEXITCODE -ne 0){throw 'Baseline FFmpeg BGRA decode failed'}
          Write-Host "HEIC_BRIDGE_BASE_BGRA_SHA256=$((Get-FileHash $reference -Algorithm SHA256).Hash)"
          & $ffmpeg -hide_banner -nostdin -loglevel error -i $in -map 0:v:0 -c:v copy -bsf:v hevc_mp4toannexb -f hevc $annexB
          $copied=($LASTEXITCODE -eq 0) -and (Test-Path $annexB) -and ((Get-Item -LiteralPath $annexB).Length -gt 100)
          if($copied){
            Write-Host "HEIC_BRIDGE_ANNEXB_OUTPUT_BYTES=$((Get-Item $annexB).Length)"
            & $ffmpeg -hide_banner -nostdin -loglevel error -threads 2 -f hevc -i $annexB -frames:v 1 -pix_fmt bgra -f rawvideo $recreated
            $decoded=($LASTEXITCODE -eq 0) -and (Test-Path $recreated)
            if($decoded){
              $originalHash=(Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash
              $newHash=(Get-FileHash -LiteralPath $recreated -Algorithm SHA256).Hash
              $sameBytes=(Get-Item $reference).Length -eq (Get-Item $recreated).Length
              $exact=$sameBytes -and $originalHash -eq $newHash
              Write-Host "HEIC_BRIDGE_PIXEL_BYTES_EQUAL=$exact"
              Write-Host "HEIC_BRIDGE_ANNEXB_BGRA_SHA256=$newHash"
              if($exact){Write-Host 'HEIC_BRIDGE_ANNEXB_BGRA_EXACT_PARITY_PASSED'}
              else{Write-Host 'HEIC_BRIDGE_ANNEXB_NOT_PIXEL_EXACT_NEEDS_INVESTIGATION'}
            } else {Write-Host 'HEIC_BRIDGE_ANNEXB_DECODE_UNAVAILABLE'}
          } else {Write-Host 'HEIC_BRIDGE_ANNEXB_EXTRACTION_UNAVAILABLE'}
          if((Get-FileHash -LiteralPath $in -Algorithm SHA256).Hash -ne $env:AVX2_INPUT_SHA){
            throw 'HEIC original changed during study'
          }
          Write-Host 'HEIC_BRIDGE_SYNTHETIC_SOURCE_SHA256_PASSED'
      - name: Exercise guarded first-frame D3D11VA path and require CPU readback for any claimed GPU output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/CI_HeicD3d11vaFirstFrame.ps1
          if(-not $?){throw 'D3D11VA first frame / fallback probe failed'}
      - name: Prepare pinned LGPL FFmpeg SDK for single-process CPU/GPU test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/Prepare_FFmpeg_Inprocess_GPU_SDK_CI.ps1
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'FFmpeg SDK headers/libraries unavailable'}
      - name: Build C++ one-process Annex B AVCodec D3D11VA test harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeicInprocessGpuAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'In-process HEVC A/B native build failed'}
          Write-Host 'HEIC_INPROCESS_NATIVE_COMPILED_NO_MSI'
      - name: Verify in-process HEVC software pixels without ffmpeg.exe startup per image
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeicInprocessGpuAB.exe').Path
          & $exe software
          if($LASTEXITCODE -ne 0){throw 'Software in-process baseline failed'}
          foreach($stem in @('04','fixture-irot3-exif6-noaux')){
            $reference=Join-Path $env:RUNNER_TEMP "heic_native_bridge/$stem.native.bgra"
            $actual=Join-Path $env:RUNNER_TEMP "heic_inprocess_software/$stem.bgra"
            if(-not (Test-Path $reference) -or -not (Test-Path $actual)){throw "Missing in-process comparison file $stem"}
            $hashA=(Get-FileHash -LiteralPath $reference -Algorithm SHA256).Hash
            $hashB=(Get-FileHash -LiteralPath $actual -Algorithm SHA256).Hash
            $lengthA=(Get-Item -LiteralPath $reference).Length
            $lengthB=(Get-Item -LiteralPath $actual).Length
            $exact=($hashA -eq $hashB) -and ($lengthA -eq $lengthB)
            Write-Host "HEIC_INPROCESS_VS_REFERENCE file=$stem exact=$exact reference_bytes=$lengthA output_bytes=$lengthB"
            if(-not $exact){throw "In-process HEVC software baseline not pixel-identical: $stem"}
          }
          Write-Host 'HEIC_INPROCESS_SOFTWARE_TWO_MAIN10_EXACT_NO_FFMPEG_PROCESS_PASS'
      - name: Attempt D3D11VA only if a genuine hardware adapter exposes a Main10 12MP config
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeicInprocessGpuAB.exe').Path
          $caps=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/D3D11HevcCaps.exe').Path
          $lines=@(& $caps)
          if($LASTEXITCODE -ne 0){throw 'Native D3D11 capability probe failed'}
          # Both pinned Main10 sources must be supported by the SAME adapter.
          # A 4032x3024 capability query alone is not a sufficient eligibility test.
          $square=@($lines | ForEach-Object {
            if($_ -match '^HEIC_GPU_MAIN10_TARGET adapter=(\d+) width=2048 height=2048 decoder_config=1$'){[int]$Matches[1]}
          })
          $portrait=@($lines | ForEach-Object {
            if($_ -match '^HEIC_GPU_MAIN10_TARGET adapter=(\d+) width=1080 height=1920 decoder_config=1$'){[int]$Matches[1]}
          })
          $eligible=@($square | Where-Object {$_ -in $portrait})
          if($eligible.Count -eq 0){
            Write-Host 'HEIC_INPROCESS_GPU_NOT_PROVEN reason=runner_has_no_main10_hw_adapter'
          } else {
            $adapter=$eligible[0]
            & $exe "gpu:$adapter"
            if($LASTEXITCODE -ne 0){throw 'GPU path crashed or violated input safety contract'}
            foreach($stem in @('04','fixture-irot3-exif6-noaux')){
              $sw=Join-Path $env:RUNNER_TEMP "heic_inprocess_software/$stem.bgra"
              $gpu=Join-Path $env:RUNNER_TEMP "heic_inprocess_gpu/$stem.bgra"
              if(Test-Path $gpu){
                $exact=(Get-FileHash $sw -Algorithm SHA256).Hash -eq (Get-FileHash $gpu -Algorithm SHA256).Hash
                Write-Host "HEIC_INPROCESS_GPU_PIXEL_AUDIT file=$stem exact=$exact product_enabled=0"
              }else{
                Write-Host "HEIC_INPROCESS_GPU_NOT_PROVEN file=$stem gpu_output_missing=1 product_enabled=0"
              }
            }
          }
          Write-Host 'HEIC_INPROCESS_NO_EXPLORER_INTEGRATION_NO_GLOBAL_CODEC_PASS'
      - name: Confirm no installer or global system codec registration
        shell: pwsh
        run: |
          Write-Host 'HEIC_GPU_RESEARCH_NO_GPU_DECODE_SUBMISSION_NO_MSI_NO_USER_PHOTOS'
