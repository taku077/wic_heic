name: Photos WIC arbitration regression - no MSI distribution
on:
  push:
    branches: [investigate/photos-wic-arbitration-after-120-failure]
    paths: ['.github/workflows/photos-wic-postfail-arbitration-ci.yml', 'wic_heic/**', 'wictest/**', 'diagnostics/photos_trace/Uninstall_WIC_Trial_RestorePreview.ps1', 'diagnostics/photos_trace/Compare_WIC_Encoder_RAM.ps1']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Reuse existing native library cache keyed to pinned submodules
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $refs=(git submodule status --recursive) -join ([string][char]10)
          $sig=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))).Substring(0,20)
          "CODEC_DEPS=$sig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore known-good native codec libs
        id: native
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Prepare pinned native dependencies on isolated runner only if uncached
        if: steps.native.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            choco install nasm -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'NASM bootstrap failed'}
            $env:PATH="C:\Program Files\NASM;$env:PATH"
          }
          Push-Location 'wic_heic/3rdparty'
          try {
            foreach($part in @('libde265','kvazaar','libheif')){
              cmd /c "call build-$part.bat x64"
              if($LASTEXITCODE -ne 0){throw "Native dependency failed: $part"}
            }
          } finally {Pop-Location}
      - name: Cache matching deps after clean native compile
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build separate global WIC and isolated 0.4.0 private-preview installers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wic_heic.sln /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Solution restore failed'}
          # Build DLL first, then global MSI with FastPreview.wxs excluded only
          # from the disposable runner's working tree. Restoring the .wxs file
          # is mandatory before building the separate v0.4.0 preview MSI.
          msbuild wic_heic/wic_heic.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Global WIC DLL build failed'}
          $previewSource='Installer/FastPreview.wxs'
          $isolatedName='Installer/FastPreview.wxs.ci-global-disabled'
          if((Test-Path -LiteralPath $isolatedName) -or
             !(Test-Path -LiteralPath $previewSource)){throw 'Installer isolation preflight failed'}
          Move-Item -LiteralPath $previewSource -Destination $isolatedName -ErrorAction Stop
          try {
            msbuild Installer/Installer.wixproj /p:Configuration=Release /p:Platform=x64 /nologo
            if($LASTEXITCODE -ne 0){throw 'Global WIC MSI isolated build failed'}
          } finally {
            Move-Item -LiteralPath $isolatedName -Destination $previewSource -ErrorAction Stop
          }
          if(!(Test-Path -LiteralPath $previewSource) -or
             (Test-Path -LiteralPath $isolatedName)){
            throw 'Preview Wix source not restored after global build'
          }
          Write-Host 'GLOBAL_WIC_MSI_AND_V04_WIX_SOURCE_ISOLATION_PASS'
          $msi=@(Get-ChildItem -LiteralPath 'Installer/(Build)' -Filter 'WicHeic.msi' -File -Recurse |
            Where-Object {$_.FullName -match '[\\/]x64[\\/]' -and $_.FullName -match '[\\/]Release[\\/]'})
          if($msi.Count -ne 1){throw "Expected one global WIC x64 MSI"}
          $dir=Join-Path $env:RUNNER_TEMP 'wic_coexist'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $dir 'global.msi')
          Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination (Join-Path $dir 'global.dll')
          # Build WIC read/encode/rotation smoke probe before rebuilding the
          # decoder with the v0.4 private-only macro.
          msbuild wictest/wictest.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'WIC integration test executable build failed'}
          $env:CL='/DWIC_HEIC_PRIVATE_FAST_ADAPTIVE'
          try {
            msbuild wic_heic/wic_heic.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo
            if($LASTEXITCODE -ne 0){throw 'Private 2/4 worker build failed'}
          } finally {Remove-Item Env:\CL -ErrorAction SilentlyContinue}
          Copy-Item 'wic_heic/(Build)/x64/Release/wic_heic.dll' 'Installer/WicHeicPrivateCodec.dll'
          # The standalone read-only diagnosis tool is NEVER packaged in
          # either codec MSI. File/registry tracing also stays compiled out of
          # both release DLLs; an opt-in diagnostic DLL requires an explicit
          # separate compiler definition and distribution.
          foreach($dll in @((Join-Path $env:RUNNER_TEMP 'wic_coexist/global.dll'),
                             'Installer/WicHeicPrivateCodec.dll')){
            $raw=[IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $dll).Path)
            $ascii=[Text.Encoding]::ASCII.GetString($raw)
            if($ascii.Contains('WIC_HEIC_TRACE v1')){
              throw ('Production codec unexpectedly contains diagnostic trace: '+$dll)
            }
          }
          Write-Host 'WIC_GLOBAL_AND_PRIVATE_MSI_DIAGNOSTIC_TRACE_ABSENT_PASS'
          msbuild wictest/isolated_shell/HeicShellFastPreview.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Preview Shell handler build failed'}
          msbuild Installer/FastPreview.wixproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Preview MSI build failed'}
          msbuild wictest/isolated_shell/Synthetic12MpHeic.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Disposable 8bit 12MP HEIC generator build failed'}
          $generator=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/Synthetic12MpHeic.exe').Path
          $codec=(Resolve-Path 'Installer/WicHeicPrivateCodec.dll').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          & $generator $codec $fixture
          if($LASTEXITCODE -ne 0){throw 'Disposable 12MP Main 8bit HEIC generation failed'}
      - name: Prepare one-time opt-in Photos restore field kit on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
          if(Test-Path -LiteralPath $stage){throw 'Refuse to overwrite field trial staging'}
          New-Item -ItemType Directory -Path $stage | Out-Null
          $files=@{
            'Installer/(Build)/x64/Release/en-US/WicHeic.msi'='WicHeic-Repair-EXPERIMENTAL-x64.msi'
            'diagnostics/windows_install/Install_Experimental_WIC.ps1'='Install_Experimental_WIC.ps1'
            'diagnostics/photos_trace/Uninstall_WIC_Trial_RestorePreview.ps1'='Uninstall_WIC_Trial_RestorePreview.ps1'
            'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1'='WIC_Preflight_ReadOnly.ps1'
            'diagnostics/photos_trace/WIC_Photos_P0_OneTimeTrial_README_JA.md'='README_JA.md'
          }
          foreach($pair in $files.GetEnumerator()){
            Copy-Item -LiteralPath $pair.Key -Destination (Join-Path $stage $pair.Value) -ErrorAction Stop
          }
          # Synthetic 4032x3024 8bit Main HEIC generated afresh in isolated CI;
          # avoid using a 10bit RExt diagnostic for the user's initial UI check.
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic') -Destination (Join-Path $stage 'Synthetic_Test_Only.heic') -ErrorAction Stop
          $digest=(Get-FileHash -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Algorithm SHA256).Hash
          # The x64 Global WIC DLL has been overwritten by the PRIVATE adaptive
          # build, so take expected public hash ONLY from pinned global stash.
          $digest=(Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'wic_coexist/global.dll') -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $stage 'EXPECTED_GLOBAL_WIC_DLL_SHA256.txt'),($digest+[Environment]::NewLine),[Text.Encoding]::ASCII)
          foreach($p in @('Install_Experimental_WIC.ps1','Uninstall_WIC_Trial_RestorePreview.ps1','WIC_Preflight_ReadOnly.ps1')){
            $full=(Join-Path $stage $p)
            $errors=$null;$tokens=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($full,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Windows PS5.1 syntax guard failed: $p"}
          }
          Write-Host 'HEIC_ONE_TIME_TRIAL_KIT_SOURCE_AND_SAFETY_SCRIPTS_PREPARED'
      - name: Verify global decoder-encoder and private preview stay installed independently
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temp=Join-Path $env:RUNNER_TEMP 'wic_coexist'
          $global=(Resolve-Path -LiteralPath (Join-Path $temp 'global.msi')).Path
          $preview=(Resolve-Path -LiteralPath '(Build)/x64/Release/en-US/WicHeicFastPreview.msi').Path
          $expectedWic=(Get-FileHash -LiteralPath (Join-Path $temp 'global.dll') -Algorithm SHA256).Hash
          $expectedPrivate=(Get-FileHash -LiteralPath 'Installer/WicHeicPrivateCodec.dll' -Algorithm SHA256).Hash
          if($expectedWic -eq $expectedPrivate){throw 'Public/private WIC builds unexpectedly identical'}
          $decoder='{6215667C-74CA-4076-A769-3F834C3F25F5}'
          $encoder='{0E8AB687-73A5-455B-8C19-B93CA9AC0EEB}'
          $handler='{D973196C-165C-4FCE-8838-17C37037D384}'
          $shell='{E357FCCD-A995-4576-B01F-234630154E96}'
          function ReadVal([string]$p,[string]$root){
            if($root -eq 'HKLM'){$hive=[Microsoft.Win32.Registry]::LocalMachine}
            else{$hive=[Microsoft.Win32.Registry]::CurrentUser}
            $k=$hive.OpenSubKey($p)
            if(!$k){return ''}
            try{return [string]$k.GetValue('')}finally{$k.Close()}
          }
          function TestGlobal([bool]$exists){
            foreach($cls in @($decoder,$encoder)){
              $p=ReadVal "SOFTWARE\Classes\CLSID\$cls\InprocServer32" 'HKLM'
              if(!$exists){if($p){throw 'Unexpected system WIC registration'};continue}
              if(!$p -or !(Test-Path -LiteralPath $p -PathType Leaf)){throw "Missing global WIC CLSID: $cls"}
              if((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash -ne $expectedWic){throw 'System WIC DLL changed'}
            }
          }
          function TestPreview([bool]$exists){
            $p=ReadVal "SOFTWARE\Classes\CLSID\$handler\InprocServer32" 'HKLM'
            $u=ReadVal "Software\Classes\.heic\ShellEx\$shell" 'HKCU'
            if(!$exists){if($p -or $u){throw 'Thumbnail handler unexpectedly registered'};return}
            if(!$p -or !(Test-Path -LiteralPath $p -PathType Leaf) -or $u -cne $handler){throw 'Preview handler/association missing'}
            $private=Join-Path (Split-Path -Parent $p) 'WicHeicPrivateCodec.dll'
            if(!(Test-Path -LiteralPath $private -PathType Leaf)){throw 'Private preview codec missing'}
            if((Get-FileHash -LiteralPath $private -Algorithm SHA256).Hash -ne $expectedPrivate){throw 'Private preview codec changed'}
          }
          function Msi([string]$operation,[string]$path){
            $argsText="/$operation "+'"'+$path+'"'+' /qn /norestart'
            $process=Start-Process -FilePath 'msiexec.exe' -ArgumentList $argsText -Wait -PassThru
            if($process.ExitCode -ne 0){throw "MSI $operation failed code=$($process.ExitCode)"}
          }
          TestGlobal $false;TestPreview $false
          $g=$false;$p=$false
          try {
            Msi 'i' $global;$g=$true
            TestGlobal $true;TestPreview $false
            Msi 'i' $preview;$p=$true
            TestGlobal $true;TestPreview $true
            Msi 'x' $preview;$p=$false
            TestGlobal $true;TestPreview $false
            Msi 'x' $global;$g=$false
            TestGlobal $false;TestPreview $false
            Write-Host 'HEIC_GLOBAL_THEN_PREVIEW_COINSTALL_AND_ROLLBACK_PASS'
          } finally {
            if($p){Msi 'x' $preview}
            if($g){Msi 'x' $global}
          }
          # This is the actual user repair ordering: leave v0.4 present,
          # add global WIC, remove ONLY global WIC, then remove preview.
          TestGlobal $false;TestPreview $false
          $g=$false;$p=$false
          try {
            Msi 'i' $preview;$p=$true
            TestGlobal $false;TestPreview $true
            $stage=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
            & (Join-Path $stage 'Install_Experimental_WIC.ps1') -CheckOnly
            if(-not $?){throw 'Field trial pre-install gate failed'}
            & (Join-Path $stage 'Install_Experimental_WIC.ps1')
            if(-not $?){throw 'Field trial global WIC installation failed'}
            $g=$true
            TestGlobal $true;TestPreview $true
            # Populate pinned synthetic lossless 90/180/270° fixtures in the
            # disposable runner exactly as the original native WIC CI does.
            # No real user media, and the repo fixture is hash-audited below.
            python -m py_compile 'tools/lossless_heic_rotate_experimental.py'
            if($LASTEXITCODE -ne 0){throw 'Lossless generator Python syntax invalid'}
            python 'tools/test_lossless_heic_rotate.py'
            if($LASTEXITCODE -ne 0){throw 'Lossless synthetic fixture preparation failed'}
            # Real WIC decoding, encoding, orientation and EXIF readback must
            # work WITH v0.4 registered; COM registration alone is insufficient.
            $test=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
            $fixture=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
            $fixtureHash=(Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
            Push-Location 'wictest'
            try {
              & $test
              if($LASTEXITCODE -ne 0){throw 'WIC decoder/encoder/orientation regression with v0.4 preview installed'}
            } finally {Pop-Location}
            if((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $fixtureHash) {
              throw 'CI input HEIC was changed by WIC interoperability test'
            }
            Write-Host 'HEIC_NATIVE_WIC_DECODE_ENCODE_ROTATE_AND_V04_PREVIEW_COEXIST_PASS'
            & (Join-Path $stage 'Uninstall_WIC_Trial_RestorePreview.ps1') -CheckOnly
            if(-not $?){throw 'Field trial pre-uninstall guard failed'}
            & (Join-Path $stage 'Uninstall_WIC_Trial_RestorePreview.ps1')
            if(-not $?){throw 'Field trial rollback script failed'}
            $g=$false
            TestGlobal $false;TestPreview $true
            Write-Host 'HEIC_FIELD_TRIAL_INSTALL_ROLLBACK_PRESERVES_EXISTING_V04_PASS'
            Msi 'x' $preview;$p=$false
            TestGlobal $false;TestPreview $false
            Write-Host 'HEIC_V040_PREVIEW_THEN_GLOBAL_COINSTALL_AND_INDEPENDENT_ROLLBACK_PASS'
          } finally {
            if($g){Msi 'x' $global}
            if($p){Msi 'x' $preview}
          }
          if(@(git diff --name-only -- 'Installer/' 'wic_heic/').Count -ne 0) {
            throw 'Disposable CI modified the tracked production files.'
          }
          Write-Host 'NO_USER_PC_TESTED=1 WINDOWS_PHOTOS_EDITOR_UNVERIFIED=1 NO_AUTO_INSTALL=1'
      - name: Assemble clean one-time opt-in trial package only after both complete passes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
          $out=Join-Path $env:RUNNER_TEMP 'WIC_Photos_P0_Win10_Trial_Candidate'
          if(Test-Path -LiteralPath $out){throw 'Field artifact staging collision'}
          New-Item -ItemType Directory -Path $out | Out-Null
          foreach($name in @(
            'WicHeic-Repair-EXPERIMENTAL-x64.msi','Install_Experimental_WIC.ps1',
            'Uninstall_WIC_Trial_RestorePreview.ps1','WIC_Preflight_ReadOnly.ps1',
            'EXPECTED_GLOBAL_WIC_DLL_SHA256.txt','README_JA.md','Synthetic_Test_Only.heic'
          )){
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $out $name) -ErrorAction Stop
          }
          if(@(Get-ChildItem -LiteralPath $out -File).Count -ne 7){throw 'Candidate kit incomplete'}
          Write-Host 'HEIC_PHOTOS_SINGLE_P0_TRIAL_PACKAGE_PREPARED_WINDOWS10_UNVERIFIED'
      - name: Fetch SHA-pinned old 1.1.18 for synthetic WIC arbitration A/B
        uses: actions/download-artifact@v4
        with:
          name: WicHeic-HEIC-x64-MSI-only-Win10-Photos-UNVERIFIED
          run-id: 39433397223
          repository: taku077/wic_heic
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historical118
      - name: Measure original and research decoder arbitration on the same public synthetic HEIC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Source-of-truth: the SHA-pinned 1.1.18 MSI artifact in Actions
          # run 39433397223 was built at a18b9ab, NOT at later f5b66fe.
          # The intervening 59 commits include material 10-bit frame decoder
          # and ICC changes, so using f5 as the binary's source baseline
          # misattributes real WIC pixel and color-context differences.
          $historicalRun=Invoke-RestMethod -Method Get -Uri 'https://api.github.com/repos/taku077/wic_heic/actions/runs/39433397223' -Headers @{
            Authorization='Bearer '+ '${{ github.token }}'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='WIC-Photos-Research-CI'
          }
          if($historicalRun.head_sha -cne 'a18b9ab146ca4d6f7b46a86507d7f0d0d882dc87' -or
             $historicalRun.conclusion -cne 'success') {
            throw 'Historical 1.1.18 MSI source provenance changed unexpectedly'
          }
          Write-Host 'WIC_118_SOURCE_COMMIT_PROVENANCE_PINNED_PASS'
          # Reuse the existing read-only MF diagnostic source; no codec
          # activation, Photos UI, license acquisition or user files.
          $mfDir=Join-Path $env:RUNNER_TEMP 'PhotosMfWicAB'
          if(Test-Path -LiteralPath $mfDir){throw 'MF probe staging collision'}
          New-Item -ItemType Directory -Path $mfDir | Out-Null
          msbuild 'diagnostics/photos_trace/HevcMfReadOnlyProbe.vcxproj' /nologo /m:1 /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$mfDir\" /v:minimal
          if($LASTEXITCODE -ne 0){throw 'Read-only Media Foundation probe build failed'}
          $mfExe=Join-Path $mfDir 'HevcMfReadOnlyProbe.exe'
          if(!(Test-Path -LiteralPath $mfExe -PathType Leaf)){throw 'MF inventory executable missing'}
          function MFInventory([string]$label) {
            $lines=@(& $mfExe 2>&1)
            if($LASTEXITCODE -ne 0 -or -not ($lines -match '^HEVC_MF_PROBE_COMPLETE')) {
              throw ('Read-only MF enumeration failed '+$label)
            }
            $rows=@($lines | Where-Object {$_ -match '^HEVC_MF_INVENTORY codec='})
            if($rows.Count -ne 4){throw 'Expected exactly four MF inventory rows'}
            foreach($line in $rows) {
              if($line -notmatch '^HEVC_MF_INVENTORY codec=(HEVC|H264) route=\S+ hr=0x00000000 count=\d+ scope=process_enumeration_only license_not_verified=1 photos_not_verified=1$') {
                throw ('MF inventory output invalid: '+$label)
              }
            }
            $normalized=($rows | ForEach-Object {($_ -replace ' scope=process_enumeration_only.*$','').Trim()} | Sort-Object) -join '|'
            Write-Host ('WIC_PHOTOS_HEVC_MF_MSI_AB_'+$label+'='+$normalized)
            return $normalized
          }
          $baselineMf=MFInventory 'BASELINE_NO_WIC'
          Write-Host 'WIC_PHOTOS_HEVC_MF_MSI_AB_BASELINE_PASS'
          $old=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'historical118') -Recurse -Filter '*.msi' -File)
          if($old.Count -ne 1){throw 'Historical 1.1.18 MSI missing or ambiguous'}
          if((Get-FileHash -LiteralPath $old[0].FullName -Algorithm SHA256).Hash -ne '4FE1809A98C0B7EB7E7A505A6105BE57A34052DE74D79A13DB0853A9EC2AACE6'){throw 'Historical MSI hash mismatch'}
          $new=(Resolve-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'wic_coexist/global.msi')).Path
          $exe=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
          function Msi([string]$op,[string]$file){
            $arg='/'+$op+' "'+$file+'" /qn /norestart'
            $p=Start-Process msiexec.exe -ArgumentList $arg -Wait -PassThru
            if($p.ExitCode -ne 0){throw ('MSI '+$op+' exit='+$p.ExitCode)}
          }
          function Survey([string]$label){
            Push-Location 'wictest'
            $env:WIC_HEIC_CAPABILITY_SURVEY_ONLY='1'
            try {
              $lines=@(& $exe 2>&1)
              if($LASTEXITCODE -ne 0){
                # These are fixed public synthetic HEIC probe metrics only.
                # Do not print user paths, image pixels or metadata.
                Write-Host ('WIC_HISTORICAL_SYNTHETIC_SURVEY_FAILURE label='+$label+
                   ' lines='+($lines -join ';'))
                throw ('Survey failed: '+$label)
              }
              $output=$lines -join [Environment]::NewLine
              if($output -notmatch 'WIC_PHOTOS_CAPABILITY_SURVEY_COMPLETE_PASS'){throw 'Survey incomplete'}
              $m=[regex]::Match($output,'WIC_PHOTOS_CAPABILITY_SURVEY_MASK=0x([a-fA-F0-9]+)')
              if(!$m.Success){throw 'Survey failed to return capability mask'}
              # Repeat in a FRESH process with the SAME installed codec.
              # The old and research RGB fingerprints unexpectedly differed,
              # despite equal geometry and pinned native dependency refs.
              # Distinguish a stable codec-version difference from unstable
              # decoding or per-process memory state before attributing cause.
              $repeatLines=@(& $exe 2>&1)
              if($LASTEXITCODE -ne 0){throw ('Repeated WIC survey failed: '+$label)}
              $repeatOutput=$repeatLines -join [Environment]::NewLine
              foreach($repeatKey in @('WIC_PHOTOS_PIXEL_SIZE',
                                      'WIC_PHOTOS_PIXEL_FULLRES_BYTES',
                                      'WIC_PHOTOS_PIXEL_READBACK_FNV64',
                                      'WIC_PHOTOS_8BIT_PLAIN_RGB_FNV64',
                                      'WIC_PHOTOS_8BIT_ICC_RGB_FNV64')){
                $regex='(?m)^'+[regex]::Escape($repeatKey)+'=([^\r\n]+)'
                $v1=[regex]::Match($output,$regex)
                $v2=[regex]::Match($repeatOutput,$regex)
                if(-not $v1.Success -or -not $v2.Success){
                  throw ('Missing repeated WIC readback: '+$label+' '+$repeatKey)
                }
                $stable=$v1.Groups[1].Value.Trim() -ceq $v2.Groups[1].Value.Trim()
                Write-Host ('WIC_PHOTOS_PIXEL_SAME_CODEC_REPEAT_STABLE label='+$label+
                  ' metric='+$repeatKey+' equal='+[int]$stable)
                if(-not $stable -and $label -eq 'RESEARCH'){
                  throw ('Research WIC non-deterministic full-resolution decoding: '+$repeatKey)
                }
              }
              $script:abSurveys[$label]=$output
              Write-Host ('WIC_PHOTOS_AB_'+$label+'='+$output.Replace([Environment]::NewLine,';'))
              & (Join-Path $env:GITHUB_WORKSPACE 'diagnostics/photos_trace/Compare_WIC_Encoder_RAM.ps1') -Label $label -Probe $mfExe
              return [Convert]::ToUInt32($m.Groups[1].Value,16)
            } finally {
              Remove-Item Env:\WIC_HEIC_CAPABILITY_SURVEY_ONLY -ErrorAction SilentlyContinue
              Pop-Location
            }
          }
          $script:abSurveys=@{}
          $installed=''
          try {
            Msi i $old[0].FullName
            $installed='old'
            $oldMask=Survey 'ORIGINAL118'
            $oldMf=MFInventory 'HISTORICAL118_INSTALLED'
            Msi x $old[0].FullName
            $installed=''
            Msi i $new
            $installed='new'
            $newMask=Survey 'RESEARCH'
            $newMf=MFInventory 'RESEARCH_INSTALLED'
            if($baselineMf -cne $oldMf -or $baselineMf -cne $newMf){
              throw 'Unexpected Media Foundation inventory mutation by WIC MSI'
            }
            Write-Host 'WIC_PHOTOS_HEVC_MFT_INVENTORY_UNCHANGED_ACROSS_BOTH_WIC_MSIS_PASS'
            Msi x $new
            $installed=''
            if($oldMask -ne 0x15){throw ('Unexpected legacy mask '+$oldMask)}
            if(($newMask -band 0x4) -eq 0 -or ($newMask -band 0x1) -ne 0){throw ('Invalid new capability mask '+$newMask)}
            Write-Host ('WIC_PHOTOS_AB_HISTORIC_MASK=0x{0:X}' -f $oldMask)
            Write-Host ('WIC_PHOTOS_AB_RESEARCH_MASK=0x{0:X}' -f $newMask)
            # Narrow the actual observed WIC differences without presuming
            # that any single flag controls Microsoft Photos GUI behavior.
            $stableMetrics=@(
              'WIC_PHOTOS_CAPABILITY_SURVEY_DEFAULT_IS_CUSTOM',
              'WIC_PHOTOS_EDITOR_CONTAINER_MATCHES_PRIVATE',
              'WIC_PHOTOS_EDITOR_NATIVE_HEIF_CONTAINER_VS_CUSTOM_DIFFER',
              'WIC_PHOTOS_EDITOR_DECODED_CONTAINER_IS_NATIVE_HEIF',
              'WIC_PHOTOS_EDITOR_NATIVE_HEIF_CONTAINER_ENCODER_HRESULT',
              'WIC_PHOTOS_EDITOR_NATIVE_HEIF_WITH_PRIVATE_VENDOR_HRESULT',
              'WIC_PHOTOS_EDITOR_NATIVE_HEIF_PRIVATE_DECODER_HRESULT',
              'WIC_PHOTOS_EDITOR_DECODER_PREVIEW_HRESULT',
              'WIC_PHOTOS_EDITOR_CONTAINER_METADATA_HRESULT',
              'WIC_PHOTOS_EDITOR_CONTAINER_COLORCONTEXTS_COUNT',
              'WIC_PHOTOS_EDITOR_FRAME_COLORCONTEXTS_COUNT',
              'WIC_PHOTOS_EDITOR_FRAME_METADATA_HRESULT',
              'WIC_PHOTOS_EDITOR_DEFAULT_ENCODER_HRESULT',
              'WIC_PHOTOS_EDITOR_DEFAULT_ENCODER_METADATA_WRITER_HRESULT',
              'WIC_PHOTOS_EDITOR_VENDOR_ENCODER_HRESULT',
              'WIC_PHOTOS_EDITOR_VENDOR_ENCODER_METADATA_WRITER_HRESULT',
              'WIC_PHOTOS_EDITOR_CREATE_FRAME_HRESULT',
              'WIC_PHOTOS_EDITOR_FRAME_INIT_HRESULT'
            )
            foreach($key in $stableMetrics) {
              $values=@()
              foreach($label in @('ORIGINAL118','RESEARCH')){
                $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                $match=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                if(-not $match.Success){throw ('Missing editor observation: '+$label+' '+$key)}
                $values+= $match.Groups[1].Value.Trim()
              }
              if($values[0] -cne $values[1]){
                throw ('Previously stable editor API differs unexpectedly: '+$key+' '+($values -join ' vs '))
              }
            }
            # Compare TWO already-generated 8-bit HEICs with the same exact
            # file bytes in both codecs. PLAIN is a disposable PNG->HEIC RGB
            # encode; ICC is a 64x64 synthetic sRGB ICC roundtrip. Unlike the
            # previous 10-bit comparison, BOTH should advertise RGB24. This
            # controls for the historical 10-bit forced-RGB24 difference.
            foreach($kind in @('PLAIN','ICC')) {
              $keys=@(
                "WIC_PHOTOS_8BIT_${kind}_WIC_BPP",
                "WIC_PHOTOS_8BIT_${kind}_GEOMETRY",
                "WIC_PHOTOS_8BIT_${kind}_COPY_HRESULT",
                "WIC_PHOTOS_8BIT_${kind}_RGB_BYTES",
                "WIC_PHOTOS_8BIT_${kind}_RGB_FNV64",
                "WIC_PHOTOS_8BIT_${kind}_RGB_CHANNEL_TOTALS",
                "WIC_PHOTOS_8BIT_${kind}_ADJACENT_CHANGES"
              )
              $metrics=@{}
              foreach($key in $keys) {
                $pair=@()
                foreach($label in @('ORIGINAL118','RESEARCH')){
                  $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                  $m=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                  if(-not $m.Success){throw ('Missing 8bit comparison: '+$label+' '+$key)}
                  $pair+= $m.Groups[1].Value.Trim()
                }
                $metrics[$key]=$pair
              }
              if($metrics["WIC_PHOTOS_8BIT_${kind}_WIC_BPP"][0] -cne '24' -or
                 $metrics["WIC_PHOTOS_8BIT_${kind}_WIC_BPP"][1] -cne '24' -or
                 $metrics["WIC_PHOTOS_8BIT_${kind}_COPY_HRESULT"][0] -cne '0x00000000' -or
                 $metrics["WIC_PHOTOS_8BIT_${kind}_COPY_HRESULT"][1] -cne '0x00000000') {
                throw ('8bit fixture did not read as native WIC RGB24 in both versions: '+$kind)
              }
              foreach($stable in @("WIC_PHOTOS_8BIT_${kind}_GEOMETRY",
                                  "WIC_PHOTOS_8BIT_${kind}_RGB_BYTES")) {
                if($metrics[$stable][0] -cne $metrics[$stable][1]){
                  throw ('8bit A/B compared different image geometries: '+$kind)
                }
              }
              foreach($metric in @('RGB_FNV64','RGB_CHANNEL_TOTALS','ADJACENT_CHANGES')) {
                $key="WIC_PHOTOS_8BIT_${kind}_$metric"
                $matching=[int]($metrics[$key][0] -ceq $metrics[$key][1])
                Write-Host ("WIC_PHOTOS_AB_8BIT_${kind}_${metric}_MATCH=$matching")
              }
              Write-Host ("WIC_PHOTOS_AB_8BIT_${kind}_WIC_RGB24_BOTH_PASS")
            }
            Write-Host 'WIC_PHOTOS_AB_EIGHT_BIT_PLAIN_AND_ICC_READBACK_COMPLETE_PASS'
            # Matched 8-bit HEIC image capability and metadata behavior.
            # The historical decoder advertises SameEncoder and Thumbnail
            # unconditionally. Preserve the API facts, not a Photos UI claim.
            foreach($kind in @('PLAIN','ICC')) {
              $prefix='WIC_PHOTOS_8BIT_'+$kind+'_'
              foreach($key in @('QUERYCAP_HRESULT','QUERYCAP_MASK',
                                 'CONTAINER_THUMBNAIL_HRESULT','FRAME_THUMBNAIL_HRESULT',
                                 'CONTAINER_ICC_HRESULT','CONTAINER_ICC_COUNT',
                                 'FRAME_ICC_HRESULT','FRAME_ICC_COUNT')) {
                $pair=@()
                foreach($label in @('ORIGINAL118','RESEARCH')) {
                  $pattern='(?m)^'+[regex]::Escape($prefix+$key)+'=([^\r\n]+)'
                  $match=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                  if(-not $match.Success){throw ('Missing 8bit WIC capability survey '+$kind+' '+$label+' '+$key)}
                  $pair+=$match.Groups[1].Value.Trim()
                }
                if($key -eq 'QUERYCAP_HRESULT' -and
                   ($pair[0] -cne '0x00000000' -or $pair[1] -cne '0x00000000')) {
                  throw ('Unexpected WIC QueryCapability error '+$kind)
                }
                if($key -eq 'QUERYCAP_MASK') {
                  $oldCap=[Convert]::ToUInt32($pair[0].Substring(2),16)
                  $newCap=[Convert]::ToUInt32($pair[1].Substring(2),16)
                  if($oldCap -ne 0x15 -or ($newCap -band 0x4) -eq 0 -or
                     ($newCap -band 0x1) -ne 0) {
                    throw ('Unexpected synthetic 8bit WIC capability '+$kind)
                  }
                }
                Write-Host ('WIC_PHOTOS_8BIT_'+$kind+'_'+$key+'_AB old='+$pair[0]+' research='+$pair[1])
              }
            }
            Write-Host 'WIC_PHOTOS_8BIT_CAPABILITY_THUMBNAIL_ICC_OBSERVATION_PASS'
            # Historical 1.1.18 (MSI run 39433397223 at a18b9ab)
            # FORCES RGB24 after its dormant 10/12-bit branches. Research
            # decodes the same 10-bit public HEIC using WIC RGB48. Compare
            # actual API formats rather than assuming the old 48bpp branch
            # ran; both paths must write all the bytes they advertise.
            foreach($label in @('ORIGINAL118','RESEARCH')) {
              $source=[string]$script:abSurveys[$label]
              $expectedBits=if($label -eq 'ORIGINAL118'){'24'}else{'48'}
              $checks=@{
                'WIC_PHOTOS_NATIVE_HEIC_WIC_BPP'=$expectedBits
                'WIC_PHOTOS_NATIVE_HEIC_ROI_HRESULT'='0x00000000'
                'WIC_PHOTOS_NATIVE_HEIC_ROI_LAST_QUARTER_CHANGED_ROWS'='8'
              }
              foreach($key in $checks.Keys) {
                $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                $match=[regex]::Match($source,$pattern)
                if(-not $match.Success){throw ('Missing historical pixel-format evidence: '+$label+' '+$key)}
                $value=$match.Groups[1].Value.Trim()
                if($value -cne $checks[$key]){
                  throw ('Legacy vs research native pixel format differs from verified expectation: '+$label+' '+$key+'='+$value)
                }
              }
            }
            Write-Host 'WIC_ACTUAL_118_FORCES_RGB24_WHILE_RESEARCH_PRESERVES_RGB48_PASS'
            # Old 1.1.18 and research are installed separately on
            # Server 2022. Windows 10 may additionally register the
            # Microsoft Store HEIF codec. Count HEIC signature candidates
            # instead of assuming 'default is custom' proves Windows 10 UI
            # compatibility. A difference here would invalidate this A/B.
            foreach($key in @('WIC_PHOTOS_WIC_DECODER_CENSUS_TESTED',
                               'WIC_PHOTOS_HEIC_PATTERN_MATCHING_DECODERS',
                               'WIC_PHOTOS_HEIC_PATTERN_CUSTOM_DECODERS',
                               'WIC_PHOTOS_HEIC_PATTERN_COMPETITOR_DECODERS',
                               'WIC_PHOTOS_WIC_DECODER_CENSUS_QUERY_ERRORS')){
              $values=@()
              foreach($label in @('ORIGINAL118','RESEARCH')){
                $pat='(?m)^'+[regex]::Escape($key)+'=(\d+)'
                $m=[regex]::Match([string]$script:abSurveys[$label],$pat)
                if(-not $m.Success) {
                  throw ('HEIC registry candidate census missing '+$label+' '+$key)
                }
                $values+=[int]$m.Groups[1].Value
              }
              if($values[0] -ne $values[1]){
                throw ('HEIC candidate count changed between MSI installations: '+$key)
              }
              Write-Host ('WIC_PHOTOS_WIC_HEIC_AB_'+$key+'='+$values[0])
            }
            Write-Host 'WIC_PHOTOS_WIC_HEIC_CANDIDATE_SET_SAME_ON_BOTH_MSIS_PASS'
            # WIC may register Microsoft's native HEIF decoder even when
            # MFVideoFormat_HEVC has no enumerated decoder. Its COM activation
            # and actual CopyPixels result are observed separately, not
            # inferred from registration or from the custom decoder.
            foreach($label in @('ORIGINAL118','RESEARCH')){
              if([string]$script:abSurveys[$label] -notmatch 'WIC_PHOTOS_MS_HEIF_NATIVE_DISPATCH_SURVEY_PASS') {
                throw ('Microsoft HEIF native candidate not examined in Windows Server A/B: '+$label)
              }
            }
            foreach($key in @('CREATE_HRESULT','INITIALIZE_HRESULT',
                               'FRAME0_HRESULT','FRAME_SIZE_HRESULT',
                               'RGB24_CONVERT_HRESULT','RGB24_COPYPixels_HRESULT')) {
              $name='WIC_PHOTOS_MS_HEIF_NATIVE_'+$key
              $vals=@()
              foreach($label in @('ORIGINAL118','RESEARCH')){
                $m=[regex]::Match([string]$script:abSurveys[$label],
                   '(?m)^'+[regex]::Escape($name)+'=(0x[0-9A-F]+)')
                $vals+= $(if($m.Success){$m.Groups[1].Value}else{'NOT_REACHED'})
              }
              Write-Host ('WIC_PHOTOS_MS_HEIF_NATIVE_AB_'+$key+' old='+$vals[0]+' research='+$vals[1])
              if($vals[0] -cne $vals[1]) {
                throw ('Microsoft native HEIF stage unexpectedly changed after WIC MSI swap: '+$key)
              }
            }
            Write-Host 'WIC_PHOTOS_MS_HEIF_NATIVE_DECODER_WIC_MF_SEPARATION_PASS'
            Write-Host 'WIC_PHOTOS_EDITOR_13_API_STABLE_ACROSS_118_AND_RESEARCH_PASS'
            # New A/B: both codecs may win arbitration, but only a real
            # full-resolution CopyPixels proves that the WIC pixel path works.
            # The old codec's rotation/display is known broken; fingerprint
            # mismatches are reported, NOT treated as an old-version baseline
            # that the research codec must reproduce.
            $fullresKeys=@(
              'WIC_PHOTOS_PIXEL_FRAMECOUNT',
              'WIC_PHOTOS_PIXEL_SIZE',
              'WIC_PHOTOS_PIXEL_FULLRES_BYTES',
              'WIC_PHOTOS_PIXEL_READBACK_FNV64'
            )
            $observed=@{}
            foreach($key in $fullresKeys){
              $values=@()
              foreach($label in @('ORIGINAL118','RESEARCH')){
                $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                $match=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                if(-not $match.Success){throw ('Missing full-resolution result: '+$label+' '+$key)}
                $values+= $match.Groups[1].Value.Trim()
              }
              $observed[$key]=$values
            }
            foreach($label in @('ORIGINAL118','RESEARCH')){
              foreach($key in @('WIC_PHOTOS_PIXEL_GETFRAME_HRESULT',
                                 'WIC_PHOTOS_PIXEL_GETSIZE_HRESULT',
                                 'WIC_PHOTOS_PIXEL_RGB24_CONVERT_HRESULT',
                                 'WIC_PHOTOS_PIXEL_FULLRES_COPY_HRESULT')){
                $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                $match=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                if(-not $match.Success -or $match.Groups[1].Value.Trim() -cne '0x00000000'){
                  throw ('Full-resolution HEIC readback failed: '+$label+' '+$key)
                }
              }
            }
            Write-Host ('WIC_PHOTOS_AB_FULLRES_GEOMETRY_MATCH='+[int](
              $observed['WIC_PHOTOS_PIXEL_SIZE'][0] -ceq $observed['WIC_PHOTOS_PIXEL_SIZE'][1]))
            Write-Host ('WIC_PHOTOS_AB_FULLRES_RGB_FINGERPRINT_MATCH='+[int](
              $observed['WIC_PHOTOS_PIXEL_READBACK_FNV64'][0] -ceq
              $observed['WIC_PHOTOS_PIXEL_READBACK_FNV64'][1]))
            Write-Host 'WIC_PHOTOS_118_VS_RESEARCH_FULLRES_PIXEL_API_AB_PASS'

            foreach($kind in @('CONTAINER','FRAME')){
              $key='WIC_PHOTOS_EDITOR_'+$kind+'_COLORCONTEXTS_HRESULT'
              $oldMatch=[regex]::Match([string]$script:abSurveys['ORIGINAL118'],
                  '(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)')
              $newMatch=[regex]::Match([string]$script:abSurveys['RESEARCH'],
                  '(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)')
              if(-not $oldMatch.Success -or -not $newMatch.Success -or
                 $oldMatch.Groups[1].Value -cne '0x88982F81' -or
                 $newMatch.Groups[1].Value -cne '0x00000000'){
                throw ('Unexpected color-context A/B diff: '+$key)
              }
            }
            Write-Host 'WIC_PHOTOS_COLORCONTEXT_ONLY_REPORTED_HRESULT_CHANGE_PASS'
            # The legacy GUI buttons were enabled, but the raster rotation
            # Save path could silently re-encode HEIC and strip metadata.
            # Preserve this precise historical-vs-guarded behavior evidence.
            foreach($method in @(0,2)) {
              $key='WIC_PHOTOS_EDITOR_MEMONLY_ROTATOR_WRITESOURCE_METHOD_'+$method
              foreach($label in @('ORIGINAL118','RESEARCH')) {
                $pattern='(?m)^'+[regex]::Escape($key)+'=([^\r\n]+)'
                $m=[regex]::Match([string]$script:abSurveys[$label],$pattern)
                if(-not $m.Success){throw ('Missing rotator probe '+$label+' '+$key)}
                $expect=if($label -eq 'ORIGINAL118'){'0x00000000'}else{'0x88982F81'}
                if($m.Groups[1].Value.Trim() -cne $expect) {
                  throw ('Unexpected WIC rotated-raster result '+$label+' '+$key+': '+$m.Groups[1].Value)
                }
              }
            }
            Write-Host 'WIC_LEGACY_118_UNSAFE_RASTER_ROTATION_ACCEPTED_AND_RESEARCH_REJECTS_AB_PASS'
            Write-Host 'PHOTOS_WIC_SYNTHETIC_118_VS_RESEARCH_ARBITRATION_AB_PASS'
            Write-Host 'WINDOWS10_PHOTOS_GUI_NOT_TESTED_MSI_RELEASE_WITHHELD'
          } finally {
            if($installed -eq 'new'){Msi x $new}
            elseif($installed -eq 'old'){Msi x $old[0].FullName}
          }
      # The Windows 10 Photos 2026.11090.22001.0 field report explicitly
      # showed HEVC extension warning + edit/rotate disabled AFTER the trial
      # global WIC MSI was installed. Native WIC CI success is not Photos UI
      # compatibility. Do not issue or reissue an unverified MSI artifact.
      - name: P0 release gate - WITHHELD until actual Windows 10 Photos editor works
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $built=Join-Path $env:RUNNER_TEMP 'WIC_Photos_P0_Win10_Trial_Candidate'
          if(-not (Test-Path -LiteralPath (Join-Path $built 'README_JA.md'))){
            throw 'Synthetic kit staging verification failed'
          }
          Write-Host 'PHOTOS_2026_EDITOR_HEVC_WARNING_PERSISTS_AFTER_GLOBAL_WIC_INSTALL'
          Write-Host 'WINDOWS10_PHOTOS_ACTUAL_ROTATE_EDIT_PASS=0'
          Write-Host 'EXPERIMENTAL_MSI_ARTIFACT_RELEASE_BLOCKED_NO_FURTHER_FIELD_TESTS'

      # B diagnostic is not a certified working Photos release. Users opt in.
      - name: Stage exact-old/experimental-new B field comparison kit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'Photos_RealGUI_B_Trial'
          if(Test-Path -LiteralPath $stage){throw 'Refuse to overwrite old B stage'}
          New-Item -ItemType Directory -Path $stage | Out-Null
          $old=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'historical118') -Recurse -Filter '*.msi' -File)
          if($old.Count -ne 1){throw 'Missing exact old MSI'}
          if((Get-FileHash -LiteralPath $old[0].FullName -Algorithm SHA256).Hash -cne '4FE1809A98C0B7EB7E7A505A6105BE57A34052DE74D79A13DB0853A9EC2AACE6'){
            throw 'Historical 118 installer differs from verified original'
          }
          $new=Join-Path $env:RUNNER_TEMP 'wic_coexist/global.msi'
          $dll=Join-Path $env:RUNNER_TEMP 'wic_coexist/global.dll'
          if(!(Test-Path -LiteralPath $new) -or !(Test-Path -LiteralPath $dll)){throw 'Missing research WIC build'}
          $files=@{
            'diagnostics/photos_trace/WIC120_OneTimeTrial.ps1'='WIC120_OneTimeTrial.ps1'
            'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1'='WIC_Preflight_ReadOnly.ps1'
            'diagnostics/photos_trace/WIC_Preflight_Compare.ps1'='WIC_Preflight_Compare.ps1'
            'diagnostics/photos_trace/B_Field_Install_Admin.cmd'='B_Field_Install_Admin.cmd'
            'diagnostics/photos_trace/B_Field_Restore_Admin.cmd'='B_Field_Restore_Admin.cmd'
            'diagnostics/photos_trace/B_Field_Restore_Latest.ps1'='B_Field_Restore_Latest.ps1'
            'diagnostics/photos_trace/B_FieldTrial_GUI_Readme_JA.txt'='README_まずお読みください.txt'
            'diagnostics/photos_trace/B_GUI_Capture_and_Pack.cmd'='B_GUI_Capture_and_Pack.cmd'
            'diagnostics/photos_trace/B_Result_Collect.ps1'='B_Result_Collect.ps1'
            'diagnostics/photos_trace/Photos_AB_Capture.ps1'='Photos_AB_Capture.ps1'
          }
          foreach($item in $files.GetEnumerator()){
            Copy-Item -LiteralPath $item.Key -Destination (Join-Path $stage $item.Value) -ErrorAction Stop
          }
          Copy-Item -LiteralPath $old[0].FullName -Destination (Join-Path $stage 'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi')
          Copy-Item -LiteralPath $new -Destination (Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi')
          [IO.File]::WriteAllText((Join-Path $stage 'WIC120_MSI_SHA256.txt'),
              (Get-FileHash -LiteralPath $new -Algorithm SHA256).Hash+[Environment]::NewLine,[Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $stage 'WIC120_DLL_SHA256.txt'),
              (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash+[Environment]::NewLine,[Text.Encoding]::ASCII)
          $fixture='wictest/samples/fixture-irot3-exif6-noaux.heic'
          if((Get-Item -LiteralPath $fixture).Length -ne 10597 -or
             (Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -cne
             'D874948C2E6F218A45C740A270FE5E10F0344C8F3A525B59FD44FDCE898DCC95'){throw 'Invalid synthetic comparison HEIC'}
          Copy-Item -LiteralPath $fixture -Destination (Join-Path $stage 'SYNTHETIC_REFERENCE_DO_NOT_EDIT.heic')
          Copy-Item -LiteralPath $fixture -Destination (Join-Path $stage 'fixture-irot3-exif6-noaux.heic')
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'PhotosMfWicAB/HevcMfReadOnlyProbe.exe') -Destination (Join-Path $stage 'HevcMfReadOnlyProbe.exe')
          $msiObject=New-Object -ComObject WindowsInstaller.Installer
          function Props([string]$path){
            $database=$msiObject.OpenDatabase($path,0)
            $out=@{}
            foreach($name in @('ProductName','ProductVersion','ProductCode','UpgradeCode')){
              $view=$database.OpenView("SELECT Value FROM Property WHERE Property = '$name'")
              try{$null=$view.Execute();$result=$view.Fetch();$out[$name]=if($result){[string]$result.StringData(1)}else{''}}
              finally{$view.Close()}
            }
            return $out
          }
          $a=Props (Join-Path $stage 'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi')
          $b=Props (Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi')
          if($a.ProductName -cne $b.ProductName -or $a.UpgradeCode -cne $b.UpgradeCode -or
              $a.ProductVersion -cne '1.1.18' -or $b.ProductVersion -cne '1.1.20' -or
              $a.ProductCode -ceq $b.ProductCode){
            throw 'MSI major-upgrade identity mismatch'
          }
          $control=$b = $null
          # No explorer.exe shutdown even when the MSI is launched directly.
          $control=Props (Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi')
          # Property is queried below using the MSI database, not inferred from source.
          $view=$msiObject.OpenDatabase((Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi'),0).OpenView(
            "SELECT Value FROM Property WHERE Property = 'MSIRESTARTMANAGERCONTROL'")
          try{$null=$view.Execute();$row=$view.Fetch()
            if(!$row -or $row.StringData(1) -cne 'Disable'){
              throw 'Research MSI lacks embedded Restart Manager shutdown prevention'
            }
          }finally{$view.Close()}
          if(@(Get-ChildItem -LiteralPath $stage -File).Count -ne 17){throw 'B trial staging incomplete'}
          Write-Host 'PHOTOS_RESEARCH_MSI_DISABLES_RESTART_MANAGER_EXPLORER_SHUTDOWN_PASS'
          Write-Host 'PHOTOS_REAL_GUI_AB_B_MSI_AND_EXACT118_RESTORE_STAGED_PASS'
      - name: Prove old118 researchB old118 restoration with kit scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'Photos_RealGUI_B_Trial'
          foreach($script in @('WIC120_OneTimeTrial.ps1','B_Field_Restore_Latest.ps1',
              'Photos_AB_Capture.ps1','B_Result_Collect.ps1')){
            $tok=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $stage $script),[ref]$tok,[ref]$errors)|Out-Null
            if(@($errors).Count){throw ('PS5.1 trial script invalid: '+$script)}
          }
          $old=Join-Path $stage 'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi'
          $proc=Start-Process -FilePath 'msiexec.exe' -ArgumentList ('/i "'+$old+'" /qn /norestart') -Wait -PassThru
          if($proc.ExitCode -ne 0){throw 'Could not stage original 1.1.18 in disposable CI'}
          $trial=Join-Path $stage 'WIC120_OneTimeTrial.ps1'
          & $trial -CheckOnly
          if(-not $?){throw 'Trial check-only gate failed'}
          & $trial -Install
          if(-not $?){throw 'B trial installation failed on isolated runner'}
          if(@(Get-ChildItem -LiteralPath $stage -Filter 'WIC120_Session_*.json' -File).Count -ne 1){
            throw 'B trial session file missing'
          }
          # Test self-contained B capture, preserving old sessions.
          & (Join-Path $stage 'Photos_AB_Capture.ps1') -Phase B -CiDryRun
          if(-not $?){throw 'B capture after trial install failed'}
          & (Join-Path $stage 'B_Result_Collect.ps1')
          if(-not $?){throw 'B evidence packaging failed'}
          $packed=@(Get-ChildItem -LiteralPath (Join-Path $stage 'Photos_AB_Results') -Filter 'Photos_B_Result_*.zip' -File)
          if($packed.Count -ne 1){throw 'B result ZIP missing'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead($packed[0].FullName)
          try {
            $names=@($archive.Entries | ForEach-Object {$_.Name})
            if($names.Count -ne 2 -or
                @($names|Where-Object {$_ -match '^Photos_AB_B_.*\.json$'}).Count -ne 1 -or
                -not ($names -contains 'synthetic-working.heic')){
              throw 'B evidence ZIP leaked unexpected files or missing B record'
            }
          }finally{$archive.Dispose()}
          Write-Host 'PHOTOS_B_ONE_CLICK_SYNTHETIC_EVIDENCE_ZIP_PASS'
          # The restore script can be executed from a *new* kit even when
          # the session was created by a previous kit, e.g. user incident.
          $newKit=Join-Path $env:RUNNER_TEMP 'B_RestoreProxy_NoSession'
          New-Item -ItemType Directory -Path $newKit -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath (Join-Path $stage 'B_Field_Restore_Latest.ps1') -Destination $newKit
          Copy-Item -LiteralPath (Join-Path $stage 'WIC120_OneTimeTrial.ps1') -Destination $newKit
          & (Join-Path $newKit 'B_Field_Restore_Latest.ps1') -PreviousKitDirectory $stage
          if(-not $?){throw 'Previous-kit session restoration failed'}
          Write-Host 'PHOTOS_RESTORE_USING_PREVIOUS_KIT_SESSION_AND_NEW_SAFE_RUNNER_PASS'
          & $trial -CheckOnly
          if(-not $?){throw 'Original 118 was not restored'}
          Write-Host 'PHOTOS_REAL_GUI_AB_B_INSTALL_AND_ORIGINAL118_FULL_RESTORE_CI_PASS'
      - name: Publish only vetted user-action files (never CI session logs)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'Photos_RealGUI_B_Trial'
          $dest='dist/Photos_RealGUI_B_Release'
          if(Test-Path -LiteralPath $dest){throw 'Refuse to overwrite B release directory'}
          New-Item -ItemType Directory -Path $dest | Out-Null
          $releaseFiles=@(
            'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi',
            'WicHeic-Repair-1.1.20-TRIAL-x64.msi',
            'WIC120_MSI_SHA256.txt','WIC120_DLL_SHA256.txt',
            'WIC120_OneTimeTrial.ps1','WIC_Preflight_ReadOnly.ps1',
            'WIC_Preflight_Compare.ps1','B_Field_Install_Admin.cmd',
            'B_Field_Restore_Admin.cmd','B_Field_Restore_Latest.ps1',
            'README_まずお読みください.txt','SYNTHETIC_REFERENCE_DO_NOT_EDIT.heic',
            'B_GUI_Capture_and_Pack.cmd','B_Result_Collect.ps1','Photos_AB_Capture.ps1',
            'HevcMfReadOnlyProbe.exe','fixture-irot3-exif6-noaux.heic'
          )
          foreach($name in $releaseFiles){
            Copy-Item -LiteralPath (Join-Path $src $name) -Destination (Join-Path $dest $name) -ErrorAction Stop
          }
          if(@(Get-ChildItem -LiteralPath $dest -File).Count -ne 17){throw 'Missing B field release files'}
          if(@(Get-ChildItem -LiteralPath $dest -Filter '*.json' -File).Count -ne 0){
            throw 'CI private logs must not enter field kit'
          }
          Write-Host 'PHOTOS_B_AB_USER_INITIATED_DIAGNOSTIC_KIT_RELEASE_GATE_PASS'
      - name: Upload opt-in B/old118 comparative diagnostic (not working Photos claim)
        uses: actions/upload-artifact@v4
        with:
          name: Photos_Win10_Research_B_ExplorerSafe_v0_2
          path: dist/Photos_RealGUI_B_Release/
          if-no-files-found: error
          retention-days: 14
