name: HEIC WIC save-route one-click CI
on:
  push:
    branches:
      - fix/grid-rotation-lossless-safety-20261028
    paths:
      - diagnostics/photos_trace/HEIC_Save_WIC_OneClick.ps1
      - diagnostics/photos_trace/HEIC_Save_CommitCorrelation.ps1
      - diagnostics/photos_trace/HEIC_SaveShell_PassiveMonitor.ps1
      - diagnostics/photos_trace/PhotosTrace_Start.ps1
      - diagnostics/photos_trace/PhotosTrace_Stop.ps1
      - diagnostics/photos_trace/03_保存経路WIC診断_ダブルクリック.cmd
      - diagnostics/photos_trace/README_保存経路WIC診断_JA.txt
      - .github/workflows/heic-save-wic-commit-oneclick-ci.yml
  workflow_dispatch:
jobs:
  save-route-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run exact CMD entry point and assert WIC registry cleanup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/photos_trace'
          $launchers=@(Get-ChildItem -LiteralPath $root -File -Filter '03_*.cmd')
          if($launchers.Count -ne 1){throw 'Expected exactly one WIC save-route launcher'}
          $r=Get-ItemProperty -LiteralPath 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($r -and ($r.PSObject.Properties.Name -contains 'TraceFile' -or
                      $r.PSObject.Properties.Name -contains 'TraceUntilFileTime')){
            throw 'Cannot test against existing WIC trace settings'
          }
          try {
            & $launchers[0].FullName --ci-selftest
            if($LASTEXITCODE -ne 0){throw ('WIC save-route synthetic CI failed '+$LASTEXITCODE)}
            $reports=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'HEIC_Save_WIC_Report_*.txt')
            if($reports.Count -lt 1){throw 'No commit analysis result was saved'}
            $last=$reports|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            $report=Get-Content -LiteralPath $last.FullName -Encoding UTF8
            if(-not ($report -match 'WIC_COMMIT_SUMMARY entered=3 succeeded=1 failed=1 incomplete=1') -or
               -not ($report -match 'ASSESSMENT=WIC_ENCODER_COMMIT_FAILED')){
              throw 'Synthetic commit analyzer produced incorrect outcomes'
            }
            $shellLogs=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'HEIC_ShellWatch_*.txt')
            if($shellLogs.Count -lt 1){throw 'Shell observer output missing'}
            $lastShell=$shellLogs|Sort-Object LastWriteTime -Descending|Select-Object -First 1
            $traceCopies=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'WIC_Photos_Trace_*.txt')
            if($traceCopies.Count -lt 2){throw 'Raw WIC trace was not copied into the results folder'}
            $raw=@(Get-Content -LiteralPath ($traceCopies | Sort-Object LastWriteTime -Descending | Select-Object -Last 1).FullName -Encoding UTF8)
            if(-not ($raw -match 'EncoderCommitRejected')){throw 'Expected raw WIC fixture missing'}
            $shell=Get-Content -LiteralPath $lastShell.FullName -Encoding UTF8
            if(-not ($shell -match 'channel=FS event=CHANGED scope=target') -or
               -not ($shell -match 'channel=SHELL event=UPDATEITEM scope=target')){
              throw 'Shell/FS notification instrumentation failed'
            }
            Write-Host 'WIC_SAVE_TRACE_COMPLETE_SYNTHETIC_PASS'
          } finally {
            $r=Get-ItemProperty -LiteralPath 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
            if($r -and ($r.PSObject.Properties.Name -contains 'TraceFile' -or
                        $r.PSObject.Properties.Name -contains 'TraceUntilFileTime')){
              throw 'WIC trace HKCU values were not cleaned up'
            }
            if(Test-Path -LiteralPath (Join-Path $root 'WIC_Photos_Trace_ACTIVE.txt')){
              throw 'Session ownership file remains after exit'
            }
            Write-Host 'WIC_TRACE_REGISTRY_CLEANUP_PASS'
          }
      - name: Upload one-click save-route diagnostic ZIP source files
        uses: actions/upload-artifact@v4
        with:
          name: IMG4425-WIC-Save-Commit-Diagnostic-Win10
          path: |
            diagnostics/photos_trace/03_保存経路WIC診断_ダブルクリック.cmd
            diagnostics/photos_trace/HEIC_Save_WIC_OneClick.ps1
            diagnostics/photos_trace/HEIC_Save_CommitCorrelation.ps1
            diagnostics/photos_trace/HEIC_SaveShell_PassiveMonitor.ps1
            diagnostics/photos_trace/PhotosTrace_Start.ps1
            diagnostics/photos_trace/PhotosTrace_Stop.ps1
            diagnostics/photos_trace/README_保存経路WIC診断_JA.txt
          retention-days: 30
