name: COM CPU / WIC PID correlation kit - Windows PowerShell 5.1

on:
  push:
    branches:
      - diagnostic/com-cpu-wic-correlation-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps51-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic UTC and PID correlation regression (PS 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'PowerShell 5.1 required'}
          $out=Join-Path $env:RUNNER_TEMP 'wic-cpu-compare'
          New-Item -Path $out -ItemType Directory -Force | Out-Null
          $csv=Join-Path $out 'cpu.csv'
          $trace=Join-Path $out 'trace.txt'
          $report=Join-Path $out 'result.txt'
          $when=[DateTime]::UtcNow.AddSeconds(-3)
          $timestamp=$when.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          @(
            'UtcTime,PID,Name,CpuPctTotal,WorkingSetMB,Threads',
            ('"{0}",31337,dllhost,55.5,40,13' -f $timestamp),
            ('"{0}",31338,Photos,41.0,80,12' -f $timestamp)
          ) | Set-Content -LiteralPath $csv -Encoding ASCII
          ('WIC_HEIC_TRACE v1 tick=10 pid=31337 event=DecoderFullDecode width=4032 height=3024 transform=0 compression=0 source=libheif-cold hr=0x00000000 tid=1 operation=0 elapsed_ms=200 utc_filetime={0}' -f $when.ToFileTimeUtc()) | Set-Content -LiteralPath $trace -Encoding ASCII
          & ./diagnostics/photos_trace/COM_CPU_WIC_Analyze.ps1 -CpuFile $csv -TraceFile $trace -OutFile $report
          $raw=Get-Content -LiteralPath $report -Raw
          if($raw -notmatch 'WicFullDecodes=1' -or
             $raw -notmatch '31337\|dllhost\|1\|55.5\|55.5\|1\|200\|1\|55.5' -or
             $raw -notmatch '31338\|Photos\|1\|41\|41\|0\|0\|0\|0') {
             throw ('Bad synthetic per-PID CPU/WIC attribution: '+$raw)
          }
          Write-Host 'CPU_WIC_SYNTHETIC_PID_TIME_PASS'
      - name: 5-second opt-in live capture and registry-cleanup smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/photos_trace'
          $before=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($before -and ($before.PSObject.Properties.Name -contains 'TraceFile')) {
              throw 'Refusing to take over existing trace settings'
          }
          & ./diagnostics/photos_trace/COM_CPU_WIC_Capture.ps1 -DurationSeconds 5
          $settings=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($settings -and (($settings.PSObject.Properties.Name -contains 'TraceFile') -or
              ($settings.PSObject.Properties.Name -contains 'TraceUntilFileTime'))) {
              throw 'Trace keys not removed'
          }
          $zip=Get-ChildItem -LiteralPath $root -Filter 'COM_CPU_WIC_Result_*.zip' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $zip){throw 'Capture did not produce result ZIP'}
          Add-Type -AssemblyName System.IO.Compression
          $zipReader=[IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names=@($zipReader.Entries | ForEach-Object {$_.Name})
            foreach($need in @('Process_CPU_1s.csv','WIC_Decode_Events.txt','CPU_WIC_Summary.txt')) {
                if($names -notcontains $need){throw "ZIP missing $need"}
            }
          } finally {$zipReader.Dispose()}
          Write-Host 'CPU_WIC_CAPTURE_PS51_CLEANUP_PASS'
      - name: Package only checked portable scripts and instructions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/photos_trace'
          $list=@('01_Start_CPU_WIC_Diagnostic.cmd','COM_CPU_WIC_Capture.ps1',
             'COM_CPU_WIC_Analyze.ps1','PhotosTrace_Start.ps1','PhotosTrace_Stop.ps1',
             'README_COM_CPU_WIC_JA.md')
          foreach($file in $list){
              if(-not(Test-Path -LiteralPath (Join-Path $root $file) -PathType Leaf)){
                  throw "Packaging input missing: $file"
              }
          }
          New-Item -ItemType Directory -Force -Path 'cpu-wic-dist' | Out-Null
          foreach($file in $list){Copy-Item -LiteralPath (Join-Path $root $file) -Destination (Join-Path 'cpu-wic-dist' $file)}
          Write-Host 'CPU_WIC_PORTABLE_PACKAGE_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: COM-CPU-WIC-PS51-Diagnostic-Verified-20261029
          path: cpu-wic-dist/*
          if-no-files-found: error
          retention-days: 14
