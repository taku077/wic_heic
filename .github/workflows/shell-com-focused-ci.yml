name: Focused Shell COM activation diagnosis (no MSI)
on:
  push:
    branches:
      - experiment/shell-com-focused-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Restore native project NuGet dependencies
        shell: pwsh
        run: |
          msbuild wic_heic.sln /t:Restore /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Restore failed'}
      - name: Compute fixed native submodule signature
        shell: pwsh
        run: |
          $refs=(git submodule status --recursive) -join "`n"
          $hash=[System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))
          $key=[Convert]::ToHexString($hash).Substring(0,20)
          "CODEC_DEPS=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build native libs only if cache absent
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            if(Test-Path 'C:\Program Files\NASM\nasm.exe'){$env:PATH="C:\Program Files\NASM;$env:PATH"}
            else { choco install nasm -y --no-progress; if($LASTEXITCODE -ne 0){throw 'NASM unavailable'} }
          }
          foreach($part in @('libde265','kvazaar','libheif')){
            cmd /c "call build-$part.bat x64"
            if($LASTEXITCODE -ne 0){throw "Native $part build failed"}
          }
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Compile test WIC DLL
        shell: pwsh
        run: |
          msbuild wic_heic/wic_heic.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'WIC DLL build failed'}

      - name: Generate real HEVC container with embedded 320x240 thumbnail
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/SyntheticEmbeddedHevcThumb.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Cannot build independent HEVC thumb fixture generator'}
          $exe=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/SyntheticEmbeddedHevcThumb.exe').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_embedded_4032x3024.heic'
          if(Test-Path -LiteralPath $fixture){throw 'Refuse existing synthetic embedded fixture'}
          & $exe $fixture
          if($LASTEXITCODE -ne 0){throw 'Cannot write artificial HEVC embedded thumbnail'}
          if(-not(Test-Path -LiteralPath $fixture)){throw 'Embedded HEVC fixture missing'}


      - name: Verify 1024px and missing-embedded-image fallback using actual WIC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/wictest.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          if($LASTEXITCODE -ne 0){throw 'Fallback test compiler failed'}
          $generator=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/SyntheticEmbeddedHevcThumb.exe').Path
          & $generator (Join-Path $env:RUNNER_TEMP 'wicfast_no_thumb_4032x3024.heic') --without-thumbnail
          if($LASTEXITCODE -ne 0){throw 'No-thumbnail HEIC fixture failed'}
          & $generator (Join-Path $env:RUNNER_TEMP 'wicfast_with_icc_4032x3024.heic') --with-icc
          if($LASTEXITCODE -ne 0){throw 'ICC-bearing HEIC fixture failed'}
          & $generator (Join-Path $env:RUNNER_TEMP 'wicfast_with_alpha_4032x3024.heic') --with-alpha
          if($LASTEXITCODE -ne 0){throw 'Alpha-bearing HEIC fixture failed'}
          foreach($mode in @('pq','hlg')){
            & $generator (Join-Path $env:RUNNER_TEMP ('wicfast_with_'+$mode+'_4032x3024.heic')) ('--with-'+$mode)
            if($LASTEXITCODE -ne 0){throw ('NCLX transfer test fixture failed: '+$mode)}
          }
          $wic=(Resolve-Path 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $exe=(Resolve-Path 'wictest/(Build)/x64/Release/wictest.exe').Path
          $r=Start-Process "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $wic)) -Wait -PassThru
          if($r.ExitCode -ne 0){throw 'Cannot register test decoder'}
          try {
            $trace=Join-Path $env:RUNNER_TEMP 'wicfast_fallback_events.txt'
            $env:WIC_HEIC_TRACE_FILE=$trace
            & $exe --shell-orientation-gate
            if($LASTEXITCODE -ne 0){throw 'Orientation metadata gate failed'}
            & $exe --shell-thumb-provider-fallback
            if($LASTEXITCODE -ne 0){throw 'Fallback native assertions failed'}
            $events=Get-Content -LiteralPath $trace -Raw
            $fallback=([regex]::Matches($events,'event=ShellLabFullFallback ')).Count
            $full=([regex]::Matches($events,'event=DecoderFullDecode width=4032 height=3024')).Count
            Write-Host "SHELL_FALLBACK_COUNT events=$fallback full_12mp=$full"
            if($fallback -ne 3 -or $full -ne 3){throw 'Fallback did not use original full-frame WIC exactly three times'}
            if(-not $events.Contains('event=ShellLabFullFallback width=256') -or
               -not $events.Contains('icc-primary')) {
               throw 'ICC fallback was not traced'
            }
            Write-Host 'SHELL_FALLBACK_1024_NO_EMBEDDED_ICC_PASS'
          } finally {
            Remove-Item Env:\WIC_HEIC_TRACE_FILE -ErrorAction SilentlyContinue
            $r=Start-Process "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $wic)) -Wait -PassThru
            if($r.ExitCode -ne 0){Write-Warning 'WIC test unregister failed'}
          }

      - name: Verify actual isolated Shell activation of custom HEIC thumbnail handler
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeicShellThumbnailLab.vcxproj /p:Configuration=Release /p:Platform=x64 /m:1
          if($LASTEXITCODE -ne 0){throw 'CI COM thumbnail lab DLL did not build'}
          $lab=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/HeicShellThumbnailLab.dll').Path
          $wic=(Resolve-Path -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_embedded_4032x3024.heic'
          $labFixture=Join-Path $env:RUNNER_TEMP 'wicfast_shell_lab_4032x3024.heic'
          if(Test-Path -LiteralPath $labFixture){throw 'Refuse existing CI Shell fixture'}
          Copy-Item -LiteralPath $fixture -Destination $labFixture -ErrorAction Stop
          $reg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/s',('"{0}"' -f $wic)) -Wait -PassThru
          if($reg.ExitCode -ne 0){throw 'WIC test registration failed'}
          $cls='{98E34B24-DAFA-44C7-89A4-5FB39F72B791}'
          $handler='{E357FCCD-A995-4576-B01F-234630154E96}'
          $root='HKCU:\Software\Classes'
          $server=Join-Path $root ('CLSID\'+$cls)
          $ext=Join-Path $root ('.heic\ShellEx\'+$handler)
          $system=Join-Path $root ('SystemFileAssociations\.heic\ShellEx\'+$handler)
          $keys=@($server,$ext,$system)
          # Isolated COM surrogate may not see HKCU-only class registration.
          # Only experiment with a fresh HKLM class if there is no existing key.
          $machineServer=Join-Path 'HKLM:\SOFTWARE\Classes\CLSID' $cls
          $machineInproc=Join-Path $machineServer 'InprocServer32'
          $machineOwned=$false
          $traceOn=$false
          # Same runner / same fixture / fresh filenames / forced extraction,
          # rather than comparing isolated one-off cold and warm timings.
          $baselineSamples=New-Object 'System.Collections.Generic.List[double]'
          $getSample={
            param($file)
            $rows=@(& './diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1' -ImagePath $file -Size 256 -ForceReextractAfterSnapshot)
            $line=@($rows | Where-Object {$_ -match '^FORCE_REEXTRACT status=OK'}) | Select-Object -Last 1
            if(-not $line){throw ('Shell benchmark extraction failed: '+($rows -join ' | '))}
            $m=[regex]::Match([string]$line,'elapsed_ms=(\d+)')
            if(-not $m.Success){throw 'Missing Shell elapsed_ms from extraction'}
            return [double]$m.Groups[1].Value
          }
          for($k=0;$k -lt 8;$k++){
            $name=Join-Path $env:RUNNER_TEMP ("wicfast_bench_default_{0:D2}.heic" -f $k)
            if(Test-Path -LiteralPath $name){throw 'Default benchmark fixture already exists'}
            Copy-Item -LiteralPath $fixture -Destination $name
            try {$baselineSamples.Add([double](& $getSample $name))}
            finally {Remove-Item -LiteralPath $name -Force -ErrorAction SilentlyContinue}
          }
          $baselineMedian=@($baselineSamples | Sort-Object)[3..4] | Measure-Object -Average
          Write-Host ('SHELL_A_B_DEFAULT_MEDIAN_MS={0:F2} samples=8' -f $baselineMedian.Average)
          # In-memory pixel baseline BEFORE any ShellEx override.
          # Native CI fixtures only; sample pixels are never written/logged.
          $refSamples=@{}
          $fastReference=[WicShellCacheAB20261028.Inspect]::One($fixture,256,4,'FAST_FULL_WIC_REFERENCE')
          if($fastReference.Status -ne 'OK'){throw 'Missing full WIC baseline thumbnail pixels'}
          # Release gate: Shell output must match the pre-registration
          # default orientation, geometry and RGB (64x64 in-memory samples).
          function Assert-ShellParity([string]$label,$reference,$actual,[string]$comparison) {
            if($reference.Width -ne $actual.Width -or $reference.Height -ne $actual.Height){
              throw ('SHELL_PARITY_GEOMETRY_MISMATCH: '+$label)
            }
            $match=[regex]::Match($comparison,'rgb_mae_64=([0-9]+(?:\.[0-9]+)?)')
            $severe=[regex]::Match($comparison,'pixels_gt20_percent_64=([0-9]+(?:\.[0-9]+)?)')
            if(-not $match.Success -or -not $severe.Success){throw ('SHELL_PARITY_NO_RGB_SAMPLES: '+$label)}
            $mae=[double]::Parse($match.Groups[1].Value,[System.Globalization.CultureInfo]::InvariantCulture)
            $percent=[double]::Parse($severe.Groups[1].Value,[System.Globalization.CultureInfo]::InvariantCulture)
            if($mae -gt 1.0 -or $percent -gt 0.01){
              throw ('SHELL_PARITY_RGB_MISMATCH: '+$label+' '+$comparison)
            }
            Write-Host ('SHELL_PARITY_{0}_GEOMETRY_RGB_PASS' -f $label)
          }
          $sourceByLabel=@{
            'NO_EMBEDDED'=(Join-Path $env:RUNNER_TEMP 'wicfast_no_thumb_4032x3024.heic')
            'IROT3_EXIF6'=(Resolve-Path 'wictest/samples/fixture-irot3-exif6.heic').Path
            'IROT3_EXIF6_NOAUX'=(Resolve-Path 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
            'ICC'=(Join-Path $env:RUNNER_TEMP 'wicfast_with_icc_4032x3024.heic')
            'ALPHA'=(Join-Path $env:RUNNER_TEMP 'wicfast_with_alpha_4032x3024.heic')
            'PQ'=(Join-Path $env:RUNNER_TEMP 'wicfast_with_pq_4032x3024.heic')
            'HLG'=(Join-Path $env:RUNNER_TEMP 'wicfast_with_hlg_4032x3024.heic')
          }
          foreach($label in @('NO_EMBEDDED','IROT3_EXIF6','IROT3_EXIF6_NOAUX','ICC','ALPHA','PQ','HLG')) {
            $source=$sourceByLabel[$label]
            $ref=[WicShellCacheAB20261028.Inspect]::One($source,256,4,'BEFORE_HANDLER')
            if($ref.Status -ne 'OK'){throw ('Cannot capture baseline for '+$label+' status='+$ref.Status)}
            $refSamples[$label]=$ref
            Write-Host ('SHELL_PARITY_BASELINE_CAPTURED label={0} dims={1}x{2}' -f $label,$ref.Width,$ref.Height)
          }
          try {
            # No override or deletion of pre-existing per-user settings.
            foreach($key in $keys){
              if(Test-Path -LiteralPath $key){throw "Refusing to overwrite an existing Shell registration: $key"}
            }
            $inproc=Join-Path $server 'InprocServer32'
            New-Item -Path $inproc -Force | Out-Null
            Set-Item -Path $inproc -Value $lab
            New-ItemProperty -Path $inproc -Name 'ThreadingModel' -Value 'Apartment' -PropertyType String | Out-Null
            foreach($key in @($ext,$system)){
              New-Item -Path $key -Force | Out-Null
              Set-Item -Path $key -Value $cls
            }
            # Official Shell requirement: announce changed file associations.
            # A previous CI phase already used the same ".heic" extension
            # with the Windows default handler. Refresh the provider mapping.
            if(-not ('WicHeicShellAssociation.Notify' -as [type])){
              $signature='[System.Runtime.InteropServices.DllImport("shell32.dll")] public static extern void SHChangeNotify(uint eventId,uint flags,System.IntPtr item1,System.IntPtr item2);'
              Add-Type -Namespace WicHeicShellAssociation -Name Notify -MemberDefinition $signature
            }
            [WicHeicShellAssociation.Notify]::SHChangeNotify(
              0x08000000,0,[IntPtr]::Zero,[IntPtr]::Zero)
            Start-Sleep -Milliseconds 350
            Write-Host 'SHELL_ASSOCIATIONS_REFRESHED_AFTER_REGISTER'
            # Verify the class is genuinely registered before asking Shell.
            $merged="Registry::HKEY_CLASSES_ROOT\CLSID\$cls\InprocServer32"
            if(-not(Test-Path -LiteralPath $merged)) {
              throw "New COM class not present in HKCR: $cls"
            }
            $registered=(Get-Item -LiteralPath $merged).GetValue('')
            $model=(Get-Item -LiteralPath $merged).GetValue('ThreadingModel')
            Write-Host "SHELL_LAB_COM_REGISTRY_CHECK binary_match=$([string]::Equals($registered,$lab,[StringComparison]::OrdinalIgnoreCase)) threading=$model"
            if($registered -ine $lab -or $model -ne 'Apartment'){
              throw 'Registered DLL path/threading model mismatch'
            }
            try {
              $classType=[type]::GetTypeFromCLSID([guid]$cls,$true)
              $object=[Activator]::CreateInstance($classType)
              if($null -eq $object){throw 'COM object null'}
              [void][Runtime.InteropServices.Marshal]::ReleaseComObject($object)
              Write-Host 'SHELL_LAB_DIRECT_COM_ACTIVATION_PASS'
            } catch {
              throw ('Direct lab COM activation failed before Shell: '+$_.Exception.ToString())
            }
            & './diagnostics/photos_trace/PhotosTrace_Start.ps1'
            $traceOn=$true
            $trace=[string](Get-ItemProperty 'HKCU:\Software\WicHeic').TraceFile
            $out=@(& './diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1' -ImagePath $labFixture -Size 256 -ForceReextractAfterSnapshot)
            $out | ForEach-Object {Write-Host $_ }
            $hkcuSuccess=(($out -join ' ') -match 'FORCE_REEXTRACT status=OK')
            Write-Host "SHELL_USER_CLASS_ONLY_RESULT success=$hkcuSuccess"
            if(-not $hkcuSuccess){
              # Strictly disposable Windows runner: compare HKLM COM class only.
              # Never overwrite an existing machine registration.
              if(Test-Path -LiteralPath $machineServer){
                throw "Machine COM CLSID exists; refusing to overwrite: $machineServer"
              }
              $machineOwned=$true
              New-Item -Path $machineInproc -Force | Out-Null
              Set-Item -Path $machineInproc -Value $lab
              New-ItemProperty -Path $machineInproc -Name 'ThreadingModel' -Value 'Apartment' -PropertyType String | Out-Null
              $systemVisible=(Get-Item -LiteralPath $machineInproc).GetValue('')
              if($systemVisible -ine $lab){throw 'HKLM registration verification failed'}
              [WicHeicShellAssociation.Notify]::SHChangeNotify(0x08000000,0,[IntPtr]::Zero,[IntPtr]::Zero)
              Start-Sleep -Milliseconds 450
              $machineFixture=Join-Path $env:RUNNER_TEMP 'wicfast_shell_lab_machine_4032x3024.heic'
              if(Test-Path -LiteralPath $machineFixture){throw 'Refusing existing machine fixture'}
              Copy-Item -LiteralPath $fixture -Destination $machineFixture -ErrorAction Stop
              $after=@(& './diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1' -ImagePath $machineFixture -Size 256 -ForceReextractAfterSnapshot)
              $after | ForEach-Object {Write-Host $_}
              $machineSuccess=(($after -join ' ') -match 'FORCE_REEXTRACT status=OK')
              Write-Host "SHELL_MACHINE_CLASS_RESULT success=$machineSuccess"
              if(-not $machineSuccess) {
                throw ('Shell still unable to extract with system COM class. HKCU='+($out -join ' | ')+' HKLM='+($after -join ' | '))
              }
            }
            $log=Get-Content -LiteralPath $trace -Raw
            $provider=([regex]::Matches($log,'event=ShellLabProviderEnter ')).Count
            $embedded=([regex]::Matches($log,'event=DecoderThumbnailEmbedded ')).Count
            $full=([regex]::Matches($log,'event=DecoderFullDecode width=4032 height=3024')).Count
            Write-Host "SHELL_REGISTERED_LAB_RESULT provider=$provider embedded=$embedded full_12mp=$full"
            if($provider -lt 1){throw 'Shell did not invoke isolated registered thumbnail provider'}
            if($embedded -lt 1){throw 'Registered Shell handler did not use embedded HEVC thumbnail'}
            if($full -ne 0){throw 'Registered Shell handler decoded full 12MP primary'}
            Write-Host 'SHELL_REGISTERED_EMBEDDED_HEVC_FAST_PATH_PASS'
            # Compare the *optimized* embedded thumbnail to the normal 12MP
            # WIC renderer. This is lossy HEVC, so do not demand bitwise parity:
            # report MAE before choosing a grounded quality threshold.
            $fastImage=[WicShellCacheAB20261028.Inspect]::One($labFixture,256,4,'FAST_SHELL_PROVIDER')
            if($fastImage.Status -ne 'OK'){throw ('Fast image sample failed: '+$fastImage.Status)}
            $fastParity=[WicShellCacheAB20261028.Inspect]::CompareSamples($fastReference,$fastImage)
            if($fastReference.Width -ne $fastImage.Width -or
               $fastReference.Height -ne $fastImage.Height -or
               $fastParity -notmatch 'PIXEL_COMPARE=OK') {
               throw 'Embedded preview differs in geometry or cannot be RGB compared'
            }
            Write-Host ('SHELL_EMBEDDED_VS_FULL_WIC_QUALITY {0}' -f $fastParity)

            # One real, isolated Shell invocation on a genuine ICC-bearing
            # HEIC fixture must deliberately bypass the embedded shortcut.
            $iccPath=Join-Path $env:RUNNER_TEMP 'wicfast_shell_icc_regression_4032x3024.heic'
            $iccSource=Join-Path $env:RUNNER_TEMP 'wicfast_with_icc_4032x3024.heic'
            if(Test-Path -LiteralPath $iccPath){throw 'ICC regression target already exists'}
            Copy-Item -LiteralPath $iccSource -Destination $iccPath
            try {
               $beforeIcc=Get-Content -LiteralPath $trace -Raw
               $initialFull=([regex]::Matches($beforeIcc,'event=DecoderFullDecode width=4032 height=3024')).Count
               $initialIccFallback=([regex]::Matches($beforeIcc,'icc-primary')).Count
               $iccOutput=@(& './diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1' -ImagePath $iccPath -Size 256 -ForceReextractAfterSnapshot)
               if(-not (($iccOutput -join ' ') -match 'FORCE_REEXTRACT status=OK')){
                  throw ('ICC Shell fixture failed thumbnail extraction: '+($iccOutput -join ' | '))
               }
               $afterIcc=Get-Content -LiteralPath $trace -Raw
               $newFull=([regex]::Matches($afterIcc,'event=DecoderFullDecode width=4032 height=3024')).Count
               $newIccFallback=([regex]::Matches($afterIcc,'icc-primary')).Count
               if(($newFull-$initialFull) -ne 1 -or
                  ($newIccFallback-$initialIccFallback) -ne 1) {
                 throw "Shell ICC handling failed closed? full_delta=$($newFull-$initialFull) fallback_delta=$($newIccFallback-$initialIccFallback)"
               }
               $iccProbe=[WicShellCacheAB20261028.Inspect]::One($iccPath,256,4,'AFTER_HANDLER')
               if($iccProbe.Status -ne 'OK'){throw ('Shell ICC parity capture failed: '+$iccProbe.Status)}
               $iccParity=[WicShellCacheAB20261028.Inspect]::CompareSamples($refSamples['ICC'],$iccProbe)
               Write-Host ('SHELL_IMAGE_PARITY label=ICC dims={0}x{1} compared={2}' -f $iccProbe.Width,$iccProbe.Height,$iccParity)
               Assert-ShellParity 'ICC' $refSamples['ICC'] $iccProbe $iccParity
               Write-Host 'SHELL_REGISTERED_ICC_FULL_WIC_FALLBACK_PASS'
            } finally {
               Remove-Item -LiteralPath $iccPath -Force -ErrorAction SilentlyContinue
            }
            # Registered Shell path (not just direct C++ calls): fail closed
            # for real EXIF+irot files and HEIC without an embedded image.
            # All inputs are CI fixtures and are copied before extraction.
            $negativeCases=@(
              @{Label='NO_EMBEDDED';Source=(Join-Path $env:RUNNER_TEMP 'wicfast_no_thumb_4032x3024.heic');Reason='no-embedded'},
              @{Label='IROT3_EXIF6';Source=(Resolve-Path 'wictest/samples/fixture-irot3-exif6.heic').Path;Reason='orientation-exif-or-unsupported'},
              @{Label='IROT3_EXIF6_NOAUX';Source=(Resolve-Path 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path;Reason='orientation-exif-or-unsupported'},
              @{Label='ALPHA';Source=(Join-Path $env:RUNNER_TEMP 'wicfast_with_alpha_4032x3024.heic');Reason='orientation-exif-or-unsupported'},
              @{Label='PQ';Source=(Join-Path $env:RUNNER_TEMP 'wicfast_with_pq_4032x3024.heic');Reason='orientation-exif-or-unsupported'},
              @{Label='HLG';Source=(Join-Path $env:RUNNER_TEMP 'wicfast_with_hlg_4032x3024.heic');Reason='orientation-exif-or-unsupported'}
            )
            foreach($negative in $negativeCases) {
              $target=Join-Path $env:RUNNER_TEMP ('wicfast_shell_safety_'+$negative.Label+'.heic')
              if(Test-Path -LiteralPath $target){throw 'Refuse existing safety fixture'}
              Copy-Item -LiteralPath $negative.Source -Destination $target -ErrorAction Stop
              try {
                $hashBefore=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
                $before=Get-Content -LiteralPath $trace -Raw
                $p0=([regex]::Matches($before,'event=ShellLabProviderEnter ')).Count
                $e0=([regex]::Matches($before,'event=DecoderThumbnailEmbedded ')).Count
                $f0=([regex]::Matches($before,'event=DecoderFullDecode ')).Count
                $reasonPattern=[regex]::Escape($negative.Reason)
                $r0=([regex]::Matches($before,$reasonPattern)).Count
                $result=@(& './diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1' -ImagePath $target -Size 256 -ForceReextractAfterSnapshot)
                if(-not (($result -join ' ') -match 'FORCE_REEXTRACT status=OK')){
                  throw ('Registered Shell negative case failed: '+$negative.Label+' '+($result -join ' | '))
                }
                $after=Get-Content -LiteralPath $trace -Raw
                $p1=([regex]::Matches($after,'event=ShellLabProviderEnter ')).Count
                $e1=([regex]::Matches($after,'event=DecoderThumbnailEmbedded ')).Count
                $f1=([regex]::Matches($after,'event=DecoderFullDecode ')).Count
                $r1=([regex]::Matches($after,$reasonPattern)).Count
                if(($p1-$p0) -lt 1 -or ($e1-$e0) -ne 0 -or
                   ($f1-$f0) -lt 1 -or ($r1-$r0) -lt 1){
                  throw "Shell safety negative gate failed label=$($negative.Label) provider=$($p1-$p0) embedded=$($e1-$e0) full=$($f1-$f0) fallback=$($r1-$r0)"
                }
                if((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $hashBefore){
                  throw ('Shell test input bytes changed: '+$negative.Label)
                }
                $parityProbe=[WicShellCacheAB20261028.Inspect]::One($target,256,4,'AFTER_HANDLER')
                if($parityProbe.Status -ne 'OK'){throw ('Shell orientation parity capture failed: '+$negative.Label)}
                $parity=[WicShellCacheAB20261028.Inspect]::CompareSamples($refSamples[$negative.Label],$parityProbe)
                Write-Host ('SHELL_IMAGE_PARITY label={0} original={1}x{2} registered={3}x{4} compared={5}' -f $negative.Label,$refSamples[$negative.Label].Width,$refSamples[$negative.Label].Height,$parityProbe.Width,$parityProbe.Height,$parity)
                Assert-ShellParity $negative.Label $refSamples[$negative.Label] $parityProbe $parity
                Write-Host ('SHELL_REGISTERED_{0}_FULL_WIC_FALLBACK_PASS' -f $negative.Label)
              } finally {
                Remove-Item -LiteralPath $target -Force -ErrorAction SilentlyContinue
              }
            }
            $fastSamples=New-Object 'System.Collections.Generic.List[double]'
            for($k=0;$k -lt 8;$k++){
              $name=Join-Path $env:RUNNER_TEMP ("wicfast_bench_registered_{0:D2}.heic" -f $k)
              if(Test-Path -LiteralPath $name){throw 'Registered benchmark fixture already exists'}
              Copy-Item -LiteralPath $fixture -Destination $name
              try {$fastSamples.Add([double](& $getSample $name))}
              finally {Remove-Item -LiteralPath $name -Force -ErrorAction SilentlyContinue}
            }
            $fastMedian=@($fastSamples | Sort-Object)[3..4] | Measure-Object -Average
            $ratio=if($baselineMedian.Average -gt 0){$fastMedian.Average/$baselineMedian.Average}else{999}
            Write-Host ('SHELL_A_B_REGISTERED_MEDIAN_MS={0:F2} samples=8 ratio={1:F3}' -f $fastMedian.Average,$ratio)
            # A performance regression is a release blocker, not a reason
            # to erase successful functional Shell activation results.
            if($ratio -ge 0.85){throw ('Shell thumbnail optimization did not beat baseline by 15% median: ratio='+$ratio)}
            Write-Host 'SHELL_8_FILE_MEDIAN_SPEEDUP_GATE_PASS'
          } finally {
            if($traceOn){& './diagnostics/photos_trace/PhotosTrace_Stop.ps1'}
            if($machineOwned -and (Test-Path -LiteralPath $machineServer)){
              $now=(Get-Item -LiteralPath $machineInproc).GetValue('')
              if($now -ieq $lab){Remove-Item -LiteralPath $machineServer -Recurse -Force}
              else {Write-Warning 'Do not delete changed HKLM test class'}
            }
            if(Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'wicfast_shell_lab_machine_4032x3024.heic')){
              Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'wicfast_shell_lab_machine_4032x3024.heic') -Force
            }
            # Keys were absent before this job and are removed ONLY if their
            # default values still equal our known test CLSID or DLL path.
            foreach($key in @($ext,$system)){
              if(Test-Path -LiteralPath $key){
                $v=(Get-Item -LiteralPath $key).GetValue('')
                if($v -eq $cls){Remove-Item -LiteralPath $key -Force}
                else {Write-Warning "Refusing to delete unexpected Shell registry value: $key"}
              }
            }
            if(Test-Path -LiteralPath $server){
              $v=(Get-Item -LiteralPath $inproc).GetValue('')
              if($v -eq $lab){Remove-Item -LiteralPath $server -Recurse -Force}
              else {Write-Warning 'Refusing to remove modified CI COM class key'}
            }
            $unreg=Start-Process -FilePath "$env:WINDIR\System32\regsvr32.exe" -ArgumentList @('/u','/s',('"{0}"' -f $wic)) -Wait -PassThru
            if($unreg.ExitCode -ne 0){Write-Warning 'WIC lab cleanup returned nonzero'}
            if('WicHeicShellAssociation.Notify' -as [type]){
              [WicHeicShellAssociation.Notify]::SHChangeNotify(
                0x08000000,0,[IntPtr]::Zero,[IntPtr]::Zero)
            }
            if(Test-Path -LiteralPath $labFixture){
              Remove-Item -LiteralPath $labFixture -Force
            }
          }
          foreach($key in $keys){if(Test-Path -LiteralPath $key){throw "Cleanup did not remove isolated test key: $key"}}
          Write-Host 'SHELL_REGISTERED_LAB_REGISTRY_RESTORED_PASS'


      - name: Upload detailed Shell diagnostic traces when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Focused-Shell-Activation-Logs
          path: |
            diagnostics/photos_trace/WIC_Photos_Trace_*.txt
            diagnostics/photos_trace/HEIC_ThumbnailCache_*.txt
          if-no-files-found: ignore
          retention-days: 14
