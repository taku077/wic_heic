name: Windows Photos HEVC Media Foundation read-only diagnostic CI
on:
  push:
    branches: [experiment/heic-gpu-inprocess-avcodec]
    paths:
      - 'diagnostics/photos_trace/HevcMfReadOnlyProbe.cpp'
      - 'diagnostics/photos_trace/HevcMfReadOnlyProbe.vcxproj'
      - '.github/workflows/photos-hevc-mf-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compile x64 Windows SDK Media Foundation capability probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'diagnostics/photos_trace/HevcMfReadOnlyProbe.vcxproj' /nologo /m:1 /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:RUNNER_TEMP\photos_codec_check\" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Native HEVC/MF read-only probe failed to compile' }
      - name: Confirm no file inputs or media/registration operations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=[IO.File]::ReadAllText((Resolve-Path 'diagnostics/photos_trace/HevcMfReadOnlyProbe.cpp').Path)
          foreach($required in @('MFStartup','MFTEnumEx','MFVideoFormat_HEVC','MFT_CATEGORY_VIDEO_DECODER','MFT_CATEGORY_VIDEO_ENCODER','MFShutdown','CoTaskMemFree','CoUninitialize','arguments_not_allowed')){
            if(-not $src.Contains($required)){throw "Missing read-only requirement $required"}
          }
          foreach($forbidden in @('ActivateObject(', 'RegSetValue', 'CreateFile(', 'WriteFile(', 'DeleteFile(', 'Remove-AppxPackage', 'MFTRegister(')){
            if($src.Contains($forbidden)){throw "Read-only diagnostic boundary violated $forbidden"}
          }
          Write-Host 'HEVC_MF_READ_ONLY_SOURCE_GUARD_PASS'
      - name: Execute isolated enumeration only (never test Photos UI)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'photos_codec_check\HevcMfReadOnlyProbe.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Native probe executable absent'}
          $out=@(& $exe 2>&1)
          $ret=$LASTEXITCODE
          $out|ForEach-Object{Write-Host $_}
          if($ret -ne 0){throw "Media Foundation read-only enumeration failed with code $ret"}
          $rows=@($out|Where-Object {$_ -match '^HEVC_MF_INVENTORY codec='})
          if($rows.Count -ne 4){throw 'Expected 4 MF decoder/encoder read-only inventory rows'}
          foreach($line in $rows){
            if($line -notmatch 'scope=process_enumeration_only license_not_verified=1 photos_not_verified=1'){
              throw "Unsafe MF probe conclusion $line"
            }
          }
          if(-not ($out -match 'HEVC_MF_PROBE_COMPLETE no_photos_test=1 no_codec_install=1 no_file_input=1 no_registration_change=1')){
            throw 'Read-only MF completion guard absent'
          }
          Write-Host 'HEVC_MF_INVENTORY_ISOLATED_WINDOWS_CI_PASS'
      - name: Verify portable one-click script and assemble read-only diagnostic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Join-Path $env:GITHUB_WORKSPACE 'diagnostics/photos_trace/Run_Photos_HEVC_ReadOnly.cmd'
          $body=[IO.File]::ReadAllText($cmd)
          foreach($required in @('WIC_Preflight_ReadOnly.ps1','HevcMfReadOnlyProbe.exe','NoProfile','ReadOnly')){
            if(-not $body.Contains($required)){throw "Expected one-click diagnostic token absent: $required"}
          }
          foreach($forbidden in @('reg add','reg delete','Remove-AppxPackage','Add-AppxPackage','msiexec','del /','format ')){
            if($body -match [regex]::Escape($forbidden)){throw "Unsafe diagnostic command token: $forbidden"}
          }
          $target=Join-Path $env:RUNNER_TEMP 'Photos_HEVC_ReadOnly_Win10_x64'
          if(Test-Path -LiteralPath $target){throw 'Refuse to overwrite prepared release staging'}
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'photos_codec_check\HevcMfReadOnlyProbe.exe') -Destination $target
          Copy-Item -LiteralPath $cmd -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/HEVC_MF_READONLY_DIAG_JA.md' -Destination $target
          if(@(Get-ChildItem -LiteralPath $target -File).Count -ne 4){throw 'Read-only test bundle incomplete'}
          Write-Host 'HEVC_MF_SINGLE_READONLY_DIAG_BUNDLE_PASS'
      - name: Save optional single diagnostic ZIP for later approved real-machine checks
        uses: actions/upload-artifact@v4
        with:
          name: Photos_HEVC_ReadOnly_Win10_x64
          path: ${{ runner.temp }}/Photos_HEVC_ReadOnly_Win10_x64/
          if-no-files-found: error
          retention-days: 14
