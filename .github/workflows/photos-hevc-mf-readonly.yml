name: Windows Photos HEVC Media Foundation read-only diagnostic CI
on:
  push:
    branches: [experiment/heic-gpu-inprocess-avcodec, investigate/photos-wic-arbitration-after-120-failure]
    paths:
      - 'diagnostics/photos_trace/HevcMfReadOnlyProbe.cpp'
      - 'diagnostics/photos_trace/HevcMfReadOnlyProbe.vcxproj'
      - 'diagnostics/photos_trace/Run_Photos_WIC_Synthetic_Only.cmd'
      - 'diagnostics/photos_trace/Run_Photos_Batch_ReadOnly.ps1'
      - 'diagnostics/photos_trace/Run_Photos_Batch_ReadOnly.cmd'
      - 'diagnostics/photos_trace/WIC_PHOTOS_ONE_BATCH_POLICY_20261024_JA.md'
      - '.github/workflows/photos-hevc-mf-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compile x64 Windows SDK Media Foundation capability probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild 'diagnostics/photos_trace/HevcMfReadOnlyProbe.vcxproj' /nologo /m:1 /p:Configuration=Release /p:Platform=x64 /p:OutDir="$env:RUNNER_TEMP\photos_codec_check\" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Native HEVC/MF read-only probe failed to compile' }
      - name: Confirm no file inputs or media/registration operations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=[IO.File]::ReadAllText((Resolve-Path 'diagnostics/photos_trace/HevcMfReadOnlyProbe.cpp').Path)
          foreach($required in @('MFStartup','MFTEnumEx','MFVideoFormat_HEVC','MFT_CATEGORY_VIDEO_DECODER','MFT_CATEGORY_VIDEO_ENCODER','MFShutdown','CoTaskMemFree','CoUninitialize','arguments_not_allowed')){
            if(-not $src.Contains($required)){throw "Missing read-only requirement $required"}
          }
          foreach($forbidden in @('ActivateObject(', 'RegSetValue', 'CreateFile(', 'WriteFile(', 'DeleteFile(', 'Remove-AppxPackage', 'MFTRegister(')){
            if($src.Contains($forbidden)){throw "Read-only diagnostic boundary violated $forbidden"}
          }
          Write-Host 'HEVC_MF_READ_ONLY_SOURCE_GUARD_PASS'
      - name: Execute isolated enumeration only (never test Photos UI)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'photos_codec_check\HevcMfReadOnlyProbe.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Native probe executable absent'}
          $out=@(& $exe 2>&1)
          $ret=$LASTEXITCODE
          $out|ForEach-Object{Write-Host $_}
          if($ret -ne 0){throw "Media Foundation read-only enumeration failed with code $ret"}
          $rows=@($out|Where-Object {$_ -match '^HEVC_MF_INVENTORY codec='})
          if($rows.Count -ne 4){throw 'Expected 4 MF decoder/encoder read-only inventory rows'}
          foreach($line in $rows){
            if($line -notmatch 'scope=process_enumeration_only license_not_verified=1 photos_not_verified=1'){
              throw "Unsafe MF probe conclusion $line"
            }
          }
          if(-not ($out -match 'HEVC_MF_PROBE_COMPLETE no_photos_test=1 no_codec_install=1 no_file_input=1 no_registration_change=1')){
            throw 'Read-only MF completion guard absent'
          }
          Write-Host 'HEVC_MF_INVENTORY_ISOLATED_WINDOWS_CI_PASS'
          # No user file paths, no Photos automation and no MFT activation.
          # Passive WIC metadata query must work, including when the Store
          # HEIF codec is registered but cannot be instantiated on this VM.
          $info=@($out | Where-Object {$_ -match '^HEVC_WIC_CODEC_INFO role='})
          if($info.Count -ne 3) {throw 'Expected three WIC HEIF/HEIC metadata rows'}
          if(-not ($out -match '^HEVC_WIC_PROBE_COMPLETE activation=0 no_image=1 no_registry_write=1 no_codec_install=1 photos_not_verified=1')) {
            throw 'Passive WIC scan did not complete without activation'
          }
          Write-Host 'HEVC_WIC_PASSIVE_METADATA_CI_PASS'
          # The one-click command explicitly opts in to COM activation.
          # This loads only the WIC codec DLLs, never processes image data.
          $active=@(& $exe '--wic-activate-no-image' 2>&1)
          if($LASTEXITCODE -ne 0){throw 'WIC COM activation inventory failed'}
          $creation=@($active | Where-Object {$_ -match '^HEVC_WIC_CODEC_CREATE role='})
          if($creation.Count -ne 3){throw 'Expected three WIC COM creation reports'}
          if(-not ($active -match '^HEVC_WIC_NATIVE_HEIF_ENCODER_CREATE hr=0x[0-9A-F]{8} no_image=1 license_not_verified=1 photos_not_verified=1')) {
            throw 'No native HEIF encoder activation result'
          }
          if(-not ($active -match '^HEVC_WIC_PROBE_COMPLETE activation=1 no_image=1 no_registry_write=1 no_codec_install=1 photos_not_verified=1')){
            throw 'Activated image-free WIC scan did not finish'
          }
          $active | ForEach-Object {Write-Host $_}
          Write-Host 'HEVC_WIC_ACTIVE_NO_IMAGE_CI_PASS'
          # Only the exact intentional activation argument is accepted.
          $invalid=@(& $exe '--load-user-image' 2>&1)
          if($LASTEXITCODE -ne 2 -or -not ($invalid -match 'HEVC_MF_INVENTORY_REFUSED arguments_not_allowed=1')){
            throw 'WIC probe accepted an unknown source-selection argument'
          }
          Write-Host 'HEVC_WIC_UNKNOWN_ARGUMENT_REJECTED_PASS'
          # GitHub pwsh wrapper exits with $LASTEXITCODE if it is nonzero.
          # The prior invalid-argument check intentionally returned 2 and
          # was already asserted above; clear that intentional negative-case native exit code.
          $global:LASTEXITCODE=0
      - name: Prove opt-in WIC decode accepts only SHA-pinned public synthetic HEIC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src='wictest/samples/fixture-irot3-exif6-noaux.heic'
          $gitHash=(& git hash-object -- $src).Trim()
          if($LASTEXITCODE -ne 0 -or $gitHash -cne '126b24780e8c36a0e1521df982067ab12f971470'){
            throw 'Public HEIC synthetic fixture Git blob changed unexpectedly'
          }
          $expectedSha256='D874948C2E6F218A45C740A270FE5E10F0344C8F3A525B59FD44FDCE898DCC95'
          if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -cne $expectedSha256){
            throw 'Public synthetic HEIC content does not match SHA-256 pin'
          }
          Write-Host 'HEVC_WIC_SYNTHETIC_SHA256_SOURCE_PINNED_PASS'
          $target=Join-Path $env:RUNNER_TEMP 'photos_codec_check/fixture-irot3-exif6-noaux.heic'
          if(Test-Path -LiteralPath $target){throw 'Refuse synthetic fixture staging overwrite'}
          Copy-Item -LiteralPath $src -Destination $target
          $exe=Join-Path $env:RUNNER_TEMP 'photos_codec_check/HevcMfReadOnlyProbe.exe'
          $valid=@(& $exe '--synthetic-wic-test' 2>&1)
          $exit=$LASTEXITCODE
          $valid|ForEach-Object{Write-Host $_}
          if($exit -ne 0 -or
             -not ($valid -match '^HEVC_SYNTHETIC_GIT_BLOB_VERIFIED_PASS bytes=10597') -or
             -not ($valid -match '^HEVC_SYNTHETIC_AUTO stage=create_decoder hr=0x[0-9A-F]{8}') -or
             -not ($valid -match '^HEVC_SYNTHETIC_WIC_COMPARISON_COMPLETE photos_not_tested=1 source_unchanged=1 no_photo_path_input=1')) {
             throw 'Pinned public synthetic WIC experiment failed'
          }
          Write-Host 'HEVC_WIC_PINNED_SYNTHETIC_IN_MEMORY_CI_PASS'
          # Mutate only the disposable CI staging copy, not the checked-in
          # public fixture. A SHA1 blob mismatch MUST refuse to decode.
          $mutated=[IO.File]::ReadAllBytes($target)
          $mutated[0]=[byte]($mutated[0] -bxor 1)
          [IO.File]::WriteAllBytes($target,$mutated)
          $bad=@(& $exe '--synthetic-wic-test' 2>&1)
          $badCode=$LASTEXITCODE
          if($badCode -ne 8 -or
             -not ($bad -match '^HEVC_SYNTHETIC_REFUSED public_fixture_missing_or_hash_mismatch=1')){
            throw 'WIC synthetic experiment accepted manipulated fixture'
          }
          Copy-Item -LiteralPath $src -Destination $target -Force
          $global:LASTEXITCODE=0
          Write-Host 'HEVC_WIC_SYNTHETIC_TAMPER_REFUSAL_CI_PASS'
      - name: Verify portable one-click script and assemble read-only diagnostic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cmd=Join-Path $env:GITHUB_WORKSPACE 'diagnostics/photos_trace/Run_Photos_HEVC_ReadOnly.cmd'
          $body=[IO.File]::ReadAllText($cmd)
          foreach($required in @('WIC_Preflight_ReadOnly.ps1','HevcMfReadOnlyProbe.exe','NoProfile','ReadOnly','--wic-activate-no-image')){
            if(-not $body.Contains($required)){throw "Expected one-click diagnostic token absent: $required"}
          }
          foreach($forbidden in @('reg add','reg delete','Remove-AppxPackage','Add-AppxPackage','msiexec','del /','format ')){
            if($body -match [regex]::Escape($forbidden)){throw "Unsafe diagnostic command token: $forbidden"}
          }
          $target=Join-Path $env:RUNNER_TEMP 'Photos_HEVC_ReadOnly_Win10_x64'
          if(Test-Path -LiteralPath $target){throw 'Refuse to overwrite prepared release staging'}
          New-Item -ItemType Directory -Path $target | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'photos_codec_check\HevcMfReadOnlyProbe.exe') -Destination $target
          Copy-Item -LiteralPath $cmd -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/HEVC_MF_READONLY_DIAG_JA.md' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/Run_Photos_WIC_Synthetic_Only.cmd' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/Run_Photos_Batch_ReadOnly.ps1' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/Run_Photos_Batch_ReadOnly.cmd' -Destination $target
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC_PHOTOS_ONE_BATCH_POLICY_20261024_JA.md' -Destination $target
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'photos_codec_check/fixture-irot3-exif6-noaux.heic') -Destination $target
          $syntheticCmd=[IO.File]::ReadAllText((Resolve-Path 'diagnostics/photos_trace/Run_Photos_WIC_Synthetic_Only.cmd').Path)
          foreach($required in @('--synthetic-wic-test','fixture-irot3-exif6-noaux.heic','No personal images')) {
            if(-not $syntheticCmd.Contains($required)){throw ('Opt-in synthetic runner requirement missing: '+$required)}
          }
          foreach($forbidden in @('msiexec','reg add','reg delete','Remove-AppxPackage','powershell.exe -Command')) {
            if($syntheticCmd -match [regex]::Escape($forbidden)){throw ('Unsafe synthetic runner command: '+$forbidden)}
          }
          if(@(Get-ChildItem -LiteralPath $target -File).Count -ne 9){throw 'Full-batch test bundle and user instructions incomplete'}
          Write-Host 'HEVC_MF_SINGLE_READONLY_DIAG_BUNDLE_PASS'
      - name: Execute ONE batch and verify a sanitized single ZIP on an isolated Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:RUNNER_TEMP 'Photos_HEVC_ReadOnly_Win10_x64'
          $smoke=Join-Path $env:RUNNER_TEMP 'OneBatchSmoke'
          if(Test-Path -LiteralPath $smoke){throw 'Refuse existing smoke destination'}
          New-Item -ItemType Directory -Path $smoke | Out-Null
          Get-ChildItem -LiteralPath $source -File | Copy-Item -Destination $smoke
          $cmd=[IO.File]::ReadAllText((Join-Path $smoke 'Run_Photos_Batch_ReadOnly.cmd'))
          $ps=[IO.File]::ReadAllText((Join-Path $smoke 'Run_Photos_Batch_ReadOnly.ps1'))
          foreach($needed in @('Run_Photos_Batch_ReadOnly.ps1','-NoProfile','-ExecutionPolicy Bypass')) {
            if(-not $cmd.Contains($needed)){throw ('Batch one-click launcher missing '+$needed)}
          }
          foreach($needed in @('--wic-activate-no-image','--synthetic-wic-test',
                  'WIC_Preflight_ReadOnly.ps1','SHA256','WIC_Batch_Sanitized_Report.txt',
                  'CreateFromDirectory','BATCH_COLLECTION_STATUS=')) {
            if(-not $ps.Contains($needed)){throw ('Batch orchestrator missing '+$needed)}
          }
          foreach($forbidden in @('msiexec','Remove-AppxPackage','reg add','reg delete',
                  'del /','Remove-Item','Set-ItemProperty','Set-Content')) {
            if($ps -match [regex]::Escape($forbidden) -or $cmd -match [regex]::Escape($forbidden)){
              throw ('Unsafe one-click batch command: '+$forbidden)
            }
          }
          $out=@(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $smoke 'Run_Photos_Batch_ReadOnly.ps1') 2>&1)
          $exitCode=$LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if($exitCode -ne 0){throw ('Single batch PowerShell5.1 run failed '+$exitCode)}
          $zips=@(Get-ChildItem -LiteralPath $smoke -Filter 'WIC_Batch_*.zip' -File)
          if($zips.Count -ne 1){throw 'Batch must produce exactly one shareable ZIP'}
          Add-Type -AssemblyName System.IO.Compression
          $archive=[IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try {
            $entries=@($archive.Entries)
            if($entries.Count -ne 1 -or $entries[0].FullName -cne 'WIC_Batch_Sanitized_Report.txt') {
              throw 'Shareable ZIP must contain only one sanitized report, no system paths'
            }
            $reader=New-Object IO.StreamReader($entries[0].Open())
            try { $report=$reader.ReadToEnd() } finally { $reader.Dispose() }
            foreach($key in @('BATCH_COLLECTION_STATUS=COMPLETE','[WIC_AND_MFT_INVENTORY]',
                              '[SYNTHETIC_WIC_EXPLICIT_AND_AUTO]','HEVC_SYNTHETIC_AUTO stage=create_decoder',
                              'HEVC_SYNTHETIC_GIT_BLOB_VERIFIED_PASS bytes=10597',
                              'NativeMicrosoftCopyPixels=','CustomWicCopyPixels=',
                              'AutoSelectedWicDecoder=','Photos editor, HEVC license')) {
              if(-not $report.Contains($key)){throw ('Batch report missing '+$key)}
            }
            foreach($forbidden in @('C:\Users\','C:\Program Files','\AppData\','ProductKey','InprocServer32')) {
              if($report.Contains($forbidden)){throw ('Batch leaked a raw device path/key '+$forbidden)}
            }
          } finally {$archive.Dispose()}
          Write-Host 'WIC_PHOTOS_SINGLE_BATCH_POWERSHELL51_EXECUTION_PASS'
          Write-Host 'WIC_PHOTOS_SINGLE_ZIP_PRIVACY_AND_COMPLETENESS_PASS'
      - name: Save optional single diagnostic ZIP for later approved real-machine checks
        uses: actions/upload-artifact@v4
        with:
          name: Photos_HEVC_ReadOnly_Win10_x64
          path: ${{ runner.temp }}/Photos_HEVC_ReadOnly_Win10_x64/
          if-no-files-found: error
          retention-days: 14
