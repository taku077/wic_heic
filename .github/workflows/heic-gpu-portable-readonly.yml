name: HEIC Intel D3D11VA no-install read-only hardware probe package
on:
  push:
    branches: [experiment/heic-gpu-inprocess-avcodec]
    paths:
      - '.github/workflows/heic-gpu-portable-readonly.yml'
      - 'wictest/isolated_shell/HeicD3D11PortableProbe.cpp'
      - 'wictest/isolated_shell/HeicMain8NativeYuvAudit.h'
      - 'wictest/isolated_shell/HeicD3D11PortableProbe.vcxproj'
      - 'wictest/isolated_shell/gpu_probe_portable/**'
      - 'diagnostics/thumbnail_warmup/Prepare_FFmpeg_Inprocess_GPU_SDK_CI.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Resolve disposable FFmpeg CLI for lossless pinned synthetic image extraction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)){
            choco install ffmpeg -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'FFmpeg in CI unavailable'}
            $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH"
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $cli=(Get-Command ffmpeg -ErrorAction Stop).Source
          "HEIC_CI_FFMPEG=$cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare date-pinned verified FFmpeg LGPL shared SDK and MSVC import libraries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/Prepare_FFmpeg_Inprocess_GPU_SDK_CI.ps1
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'FFmpeg research SDK verification failure'}
      - name: Compile standalone no-registration Intel D3D11VA Main10 hardware probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeicD3D11PortableProbe.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Windows x64 HEVC GPU diagnostic build failure'}
          msbuild wictest/isolated_shell/D3D11HevcCaps.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Read-only D3D11 HEVC capability reporter build failure'}
          Write-Host 'HEIC_GPU_PORTABLE_COMPILED_NO_MSI'
      - name: Stage fixed original-free HEVC fixtures and dynamic LGPL research DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'heic_gpu_readonly_portable'
          if(Test-Path -LiteralPath $root){throw 'Refusing to reuse diagnostic packaging directory'}
          New-Item -ItemType Directory -Path $root | Out-Null
          $samples=Join-Path $root 'samples'
          New-Item -ItemType Directory -Path $samples | Out-Null
          $binary=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeicD3D11PortableProbe.exe').Path
          Copy-Item -LiteralPath $binary -Destination $root
          $caps=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/D3D11HevcCaps.exe').Path
          Copy-Item -LiteralPath $caps -Destination $root
          foreach($file in @('Run_GPU_ReadOnly.cmd','Run_GPU_Thumbnail_Experimental.cmd','README_JA.txt','FFMPEG_LICENSE_NOTICE.txt')){
            Copy-Item -LiteralPath "wictest/isolated_shell/gpu_probe_portable/$file" -Destination $root
          }
          foreach($name in @('04','fixture-irot3-exif6-noaux')){
            $src=(Resolve-Path "wictest/samples/$name.heic").Path
            $shaBefore=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
            $dest=Join-Path $samples "$name.h265"
            & $env:HEIC_CI_FFMPEG -hide_banner -nostdin -loglevel error -i $src -map 0:v:0 -c:v copy -bsf:v hevc_mp4toannexb -f hevc $dest
            if($LASTEXITCODE -ne 0 -or -not (Test-Path $dest)){throw "Pinned synthetic HEVC extract failed: $name"}
            if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $shaBefore){throw "Source synthetic HEIC modified: $name"}
            Write-Host "HEIC_GPU_PORTABLE_FIXTURE name=$name bytes=$((Get-Item $dest).Length) sha256=$((Get-FileHash $dest -Algorithm SHA256).Hash)"
          }
          # HEVC 4032x3024 is a separate hardware capability gate.
          # A real Main10 GPU may decode 1080p but reject portrait 12MP.
          $detail=Join-Path $samples 'synthetic12mp_detail.h265'
          & $env:HEIC_CI_FFMPEG -hide_banner -nostdin -loglevel error -threads 2 -f lavfi -i 'testsrc2=size=4032x3024:rate=1' -vf 'noise=alls=24:allf=t+u' -frames:v 1 -pix_fmt yuv420p10le -c:v libx265 -preset ultrafast -x265-params 'log-level=error:pools=2:frame-threads=1' -f hevc $detail
          if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $detail)){throw 'High-detail synthetic 12MP Main10 source generation failed'}
          $detailBytes=(Get-Item -LiteralPath $detail).Length
          if($detailBytes -lt 1MB -or $detailBytes -gt 64MB){throw "Unreasonable detailed HEVC fixture: $detailBytes"}
          Write-Host "HEIC_GPU_PORTABLE_12MP_FIXTURE coded_width=4032 coded_height=3024 bytes=$detailBytes sha256=$((Get-FileHash -LiteralPath $detail -Algorithm SHA256).Hash)"
          # Additional 8-bit Main (NV12) 12MP synthetic. This is NOT a real HEIC:
          # it measures whether the Intel Main-profile hardware decoder can
          # preserve BGRA pixels and Windows Fant output, independently of Main10.
          $detail8=Join-Path $samples 'synthetic12mp_8bit_detail.h265'
          & $env:HEIC_CI_FFMPEG -hide_banner -nostdin -loglevel error -threads 2 -f lavfi -i 'testsrc2=size=4032x3024:rate=1' -vf 'noise=alls=24:allf=t+u' -frames:v 1 -pix_fmt yuv420p -c:v libx265 -preset ultrafast -x265-params 'log-level=error:pools=2:frame-threads=1' -f hevc $detail8
          if($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $detail8)){throw '12MP HEVC Main 8bit synthetic fixture generation failed'}
          $detail8Bytes=(Get-Item -LiteralPath $detail8).Length
          if($detail8Bytes -lt 1MB -or $detail8Bytes -gt 64MB){throw "Unsafe Main 8bit HEVC fixture: $detail8Bytes"}
          Write-Host "HEIC_GPU_PORTABLE_MAIN8_12MP_FIXTURE coded_width=4032 coded_height=3024 bytes=$detail8Bytes sha256=$((Get-FileHash -LiteralPath $detail8 -Algorithm SHA256).Hash)"
          $libBin=Join-Path $env:FFMPEG_RESEARCH_ROOT 'bin'
          # Package only these codec, pixel-format and audio utility FFmpeg DLLs.
          # The isolated-PATH test below will reject any omitted transitive DLL.
          $dlls=@(Get-ChildItem -LiteralPath $libBin -Filter '*.dll' -File |
            Where-Object {$_.Name -match '^(avcodec|avutil|swscale|swresample)-[0-9]+\.dll$'})
          foreach($required in @('avcodec','avutil','swscale')){
            if(-not @($dlls | Where-Object {$_.Name -match "^$required-[0-9]+\.dll$"}).Count){
              throw "Required FFmpeg runtime library missing: $required"
            }
          }
          foreach($dll in $dlls){
            Copy-Item -LiteralPath $dll.FullName -Destination $root
            Write-Host "HEIC_GPU_PORTABLE_PACKAGED_DLL name=$($dll.Name) bytes=$($dll.Length)"
          }
          $manifest=Join-Path $root 'SHA256_MANIFEST.txt'
          $lines=@(Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring($root.Length+1)
            "$relative SHA256=$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash)"
          })
          [IO.File]::WriteAllLines($manifest,$lines,[Text.Encoding]::UTF8)
          "HEIC_GPU_PORTABLE_STAGING=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "HEIC_GPU_PORTABLE_BUNDLE_FILES=$($lines.Count) bundle_bytes=$((Get-ChildItem $root -Recurse -File|Measure-Object -Property Length -Sum).Sum)"
      - name: Verify all four bundled HEVC sample streams on Windows via isolated-path portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:HEIC_GPU_PORTABLE_STAGING 'HeicD3D11PortableProbe.exe'
          # Eliminate any FFmpeg CLI, Chocolatey or VS Build Tools from PATH.
          # All non-OS decode DLLs must exist inside this portable package.
          $originalPath=$env:PATH
          try {
            $env:PATH="$env:SystemRoot\System32;$env:SystemRoot"
            $sw=@(& $exe --software-selftest 2>&1)
            $exit=$LASTEXITCODE
          } finally {
            $env:PATH=$originalPath
          }
          $sw | ForEach-Object {Write-Host $_}
          if($exit -ne 0){throw "Isolated-PATH HEVC selftest failed code=$exit"}
          if(-not ($sw -match 'HEIC_GPU_PORTABLE_SOFTWARE_SELFTEST_4_OF_4_PASS') -or
             -not ($sw -match 'sample=synthetic12mp_8bit_detail got=1 expected=1') -or
             -not ($sw -match 'sample=synthetic12mp_detail got=2 expected=2') -or
             -not ($sw -match 'sample=04 got=4 expected=4') -or
             -not ($sw -match 'sample=fixture-irot3-exif6-noaux got=4 expected=4')){
            throw 'Native 8bit/10bit synthetic and RExt HEIC-derived profile gates are not verified'
          }
          if(-not ($sw -match 'HEIC_GPU_MAIN8_NATIVE_YUV_POSITIVE_AND_NEGATIVE_SELFTEST_PASS')) {
            throw 'Main8 native YUV positive/negative control did not execute'
          }
          if(-not ($sw -match 'HEIC_GPU_MAIN8_SIMULATED_NV12_PLANAR_COLOR_BYTE_EXACT_PASS')) {
            throw 'NV12 GPU-style chroma-only planar repack did not match actual CPU RGB output'
          }
          Write-Host 'HEIC_GPU_PORTABLE_BUNDLED_CPU_SELFTEST_PASS'
      - name: Verify hardware probe reports unproven without a real D3D11 Main10 device
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:HEIC_GPU_PORTABLE_STAGING 'HeicD3D11PortableProbe.exe'
          $response=@(& $exe 0 2>&1)
          $response | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0){throw 'Portable D3D11 research probe unexpectedly crashed'}
          if((($response -match 'HEIC_GPU_PORTABLE_MAIN10_HARDWARE_.*DECODE_AND_CPU_READBACK_PROVEN') -or
              ($response -match 'HEIC_GPU_PORTABLE_MAIN8_HARDWARE_12MP_FANT_EXACT_PROVEN')) -or
             -not ($response -match 'HEIC_GPU_PORTABLE_NOT_PROVEN')){
            throw 'Virtual runner cannot establish physical Intel hardware decode'
          }
          $preview=@(& $exe thumb:0 2>&1)
          $preview | ForEach-Object {Write-Host $_}
          if($LASTEXITCODE -ne 0 -or
             ($preview -match 'HEIC_GPU_THUMB_TIMES') -or
             -not ($preview -match 'HEIC_GPU_PORTABLE_NOT_PROVEN')){
             throw 'Research-only small-readback cannot claim GPU performance on software CI'
          }
          Write-Host 'HEIC_GPU_PORTABLE_GPU_SUCCESS_UNPROVEN_UNTIL_REAL_INTEL_PC'
      - name: Exercise original user CMD launcher and verify persistent unique read-only log
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=$env:HEIC_GPU_PORTABLE_STAGING
          $cmd=Join-Path $dir 'Run_GPU_ReadOnly.cmd'
          if(-not (Test-Path -LiteralPath $cmd)){throw 'Portable launcher absent'}
          $before=@(Get-ChildItem -LiteralPath $dir -Filter 'GPU_Readonly_Result_*.txt' -File)
          if($before.Count -ne 0){throw 'Unexpected pre-existing diagnostic user logs in archive'}
          $env:HEIC_GPU_PROBE_CI='1'
          try {
            Push-Location $dir
            try {
              & $env:ComSpec /d /c ('"' + $cmd + '"')
              if($LASTEXITCODE -ne 0){throw 'Full portable CMD launcher failed'}
            } finally {Pop-Location}
          } finally {Remove-Item Env:HEIC_GPU_PROBE_CI -ErrorAction SilentlyContinue}
          $logs=@(Get-ChildItem -LiteralPath $dir -Filter 'GPU_Readonly_Result_*.txt' -File)
          if($logs.Count -ne 1){throw 'CMD must save exactly one unique log'}
          $content=[IO.File]::ReadAllText($logs[0].FullName)
          foreach($require in @('HEIC_GPU_PORTABLE_SOFTWARE_SELFTEST_4_OF_4_PASS',
              '=== GPU VIDEO HARDWARE DECODER CAPS ===','HEIC_GPU_CAPS_READONLY_NO_MSI_NO_REGISTRY_PASS',
              '=== GPU INDEX 0 ===','HEIC_GPU_PORTABLE_NOT_PROVEN')){
            if(-not $content.Contains($require)){throw "Unexpected/incomplete user diagnostic log: $require"}
          }
          Write-Host "HEIC_GPU_PORTABLE_REAL_CMD_SMOKETEST_PASSED log=$($logs[0].Name) bytes=$($logs[0].Length)"
          # User logs must NOT be included in the sealed downloadable artifact.
          Remove-Item -LiteralPath $logs[0].FullName
      - name: Smoke-test optional experimental GPU-thumbnail command on software-only CI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=$env:HEIC_GPU_PORTABLE_STAGING
          $cmd=Join-Path $folder 'Run_GPU_Thumbnail_Experimental.cmd'
          if(-not (Test-Path -LiteralPath $cmd)){throw 'Optional thumbnail runner missing'}
          $env:HEIC_GPU_PROBE_CI='1'
          try {
            Push-Location $folder
            try {
              & $env:ComSpec /d /c ('"' + $cmd + '"')
              if($LASTEXITCODE -ne 0){throw 'Optional thumbnail command failed on software-only runner'}
            } finally {Pop-Location}
          } finally {Remove-Item Env:HEIC_GPU_PROBE_CI -ErrorAction SilentlyContinue}
          $logs=@(Get-ChildItem -LiteralPath $folder -Filter 'GPU_Thumbnail_Experimental_*.txt' -File)
          if($logs.Count -ne 1){throw 'Experimental CLI must create unique single report'}
          $content=[IO.File]::ReadAllText($logs[0].FullName)
          if($content -notmatch 'HEIC_GPU_PORTABLE_SOFTWARE_SELFTEST_4_OF_4_PASS' -or
             $content -notmatch 'HEIC_GPU_PORTABLE_NOT_PROVEN' -or
             $content -match 'HEIC_GPU_THUMB_TIMES'){
            throw 'No physical Intel GPU on virtual runner: thumbnail timing must not be fabricated'
          }
          Write-Host 'HEIC_GPU_THUMB_OPTIONAL_COMMAND_NEGATIVE_HARDWARE_CI_PASS'
          Remove-Item -LiteralPath $logs[0].FullName
      - name: Upload portable noninstaller diagnostic (research use only)
        uses: actions/upload-artifact@v4
        with:
          name: HEIC_GPU_ReadOnly_Probe_x64_Research
          path: ${{ runner.temp }}/heic_gpu_readonly_portable/*
          retention-days: 14
          if-no-files-found: error
