name: Photos WIC process module diagnostic - read-only PS5.1 smoke
on:
  push:
    branches: [investigate/photos-wic-arbitration-after-120-failure]
    paths: ['.github/workflows/photos-wic-process-readonly-smoke.yml', 'diagnostics/photos_trace/Photos_WIC_Process_ReadOnly.ps1', 'diagnostics/photos_trace/Run_Photos_WIC_Process_ReadOnly.cmd', 'diagnostics/photos_trace/README_Photos_WIC_ReadOnly_WithSynthetic_JA.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read_only_probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and invoke diagnostic in actual Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Required actual PS5.1'}
          $script='diagnostics/photos_trace/Photos_WIC_Process_ReadOnly.ps1'
          $tok=$null;$err=$null
          $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path,[ref]$tok,[ref]$err)
          if($err.Count -ne 0){throw 'Read-only process probe syntax failed'}
          & $script
          if(!$?){throw 'Read-only process probe failed'}
          $items=@(Get-ChildItem 'diagnostics/photos_trace' -Filter 'Photos_WIC_Process_ReadOnly_*.json' -File)
          if($items.Count -ne 1){throw 'Diagnostic must create exactly one new JSON'}
          $j=Get-Content -LiteralPath $items[0].FullName -Encoding UTF8 -Raw | ConvertFrom-Json
          if($j.Schema -ne 2 -or $j.PersistentSystemChanges -ne $false -or $j.FileContentsOrPhotosAccessed -ne $false){
            throw 'Read-only JSON schema/safety assertions failed'
          }
          if($j.WindowScan -notin @('OK','UNAVAILABLE')){throw 'Window probe must declare its observation quality'}
          $classifications=@('NO_VISIBLE_PHOTOS_PROCESS_OBSERVED',
            'WINDOW_SCAN_UNAVAILABLE','MIXED_VISIBLE_PHOTOS_PROCESSES',
            'VISIBLE_PHOTOS_PROCESS_HAS_CUSTOM_WIC_MODULE',
            'VISIBLE_PHOTOS_PROCESS_WITHOUT_CUSTOM_WIC_MODULE')
          if($j.VisiblePhotosWicCorrelation -notin $classifications){
            throw 'Window/codec correlation classification missing or invalid'
          }

          foreach($proc in @($j.PhotosProcessModuleSnapshot)){
            if($proc.VisibleTopLevelWindowCount -lt 0 -or $proc.VisibleHostedChildWindowCount -lt 0){
              throw 'Visible window associations must be nonnegative'
            }
          }
          # A dedicated privacy guard: process/window observation MUST NOT
          # query window titles, screenshot pixels, real photos or documents.
          $body=Get-Content -LiteralPath $script -Raw -Encoding UTF8
          foreach($forbidden in @('GetWindowText(', 'PrintWindow(', 'BitBlt(', 'CopyFromScreen(')){
            if($body.Contains($forbidden)){throw ('Unexpected privacy-invasive API: '+$forbidden)}
          }
          Write-Host 'PHOTOS_VISIBLE_UWP_WINDOW_PID_MAP_PRIVACY_GUARD_PASS'
          Write-Host 'PHOTOS_PROCESS_WIC_READONLY_PS51_SMOKE_PASS'
      - name: Exercise identical one-click CMD launcher without privilege or photo access
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cmd=(Resolve-Path -LiteralPath 'diagnostics/photos_trace/Run_Photos_WIC_Process_ReadOnly.cmd').Path
          & cmd.exe /d /c ('"' + $cmd + '"')
          if($LASTEXITCODE -ne 0){throw 'One-click read-only CMD launcher failed'}
          $reports=@(Get-ChildItem 'diagnostics/photos_trace' -Filter 'Photos_WIC_Process_ReadOnly_*.json' -File)
          if($reports.Count -ne 2){throw 'Each invocation must write exactly one new report without overwriting existing files'}
          Write-Host 'PHOTOS_WIC_ONECLICK_NO_ADMIN_NO_IMAGE_ACCESS_CI_PASS'
          Write-Host 'Windows Server smoke cannot prove actual Win10 Photos codec routing.'
      - name: Verify and stage complete four-file read-only diagnostic, including synthetic HEIC
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
          $data=[IO.File]::ReadAllBytes($src)
          if($data.Length -lt 128 -or
             [Text.Encoding]::ASCII.GetString($data,4,4) -ne 'ftyp'){
            throw 'Synthetic HEIC missing or not a valid HEIF ftyp file'
          }
          $out=Join-Path $env:RUNNER_TEMP 'Photos_WIC_NoAdmin_WithSynthetic'
          if(Test-Path -LiteralPath $out){throw 'Refuse to overwrite diagnostic staging folder'}
          New-Item -ItemType Directory -Path $out | Out-Null
          $items=@(
            @($src,'Synthetic_Test_Only.heic'),
            @('diagnostics/photos_trace/Photos_WIC_Process_ReadOnly.ps1','Photos_WIC_Process_ReadOnly.ps1'),
            @('diagnostics/photos_trace/Run_Photos_WIC_Process_ReadOnly.cmd','Run_Photos_WIC_Process_ReadOnly.cmd'),
            @('diagnostics/photos_trace/README_Photos_WIC_ReadOnly_WithSynthetic_JA.txt','README_JA.txt')
          )
          foreach($entry in $items) {
            $origin=(Resolve-Path -LiteralPath $entry[0]).Path
            $dest=Join-Path $out $entry[1]
            Copy-Item -LiteralPath $origin -Destination $dest -ErrorAction Stop
            if((Get-FileHash -LiteralPath $origin -Algorithm SHA256).Hash -ne
               (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash){
              throw ('Package file checksum mismatch: '+$entry[1])
            }
          }
          $actual=@(Get-ChildItem -LiteralPath $out -File)
          if($actual.Count -ne 4){throw 'Published kit must contain exactly four files'}
          Write-Host ('SYNTHETIC_HEIC_INCLUDED_AND_HASH_VERIFIED size='+$data.Length)
          Write-Host 'PHOTOS_WIC_FOUR_FILE_NOADMIN_READONLY_KIT_PASS'
      - name: Publish four-file read-only Photos WIC kit with synthetic HEIC
        uses: actions/upload-artifact@v4
        with:
          name: Photos-WIC-ReadOnly-NoAdmin-WithSyntheticHEIC-4Files
          path: ${{ runner.temp }}/Photos_WIC_NoAdmin_WithSynthetic/
          if-no-files-found: error
          retention-days: 30
