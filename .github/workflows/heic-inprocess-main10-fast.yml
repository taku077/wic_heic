name: HEIC in-process Main10 HEVC CPU parity fast test (no native library rebuild)
on:
  push:
    branches: [experiment/heic-gpu-inprocess-avcodec]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inprocess:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Prepare FFmpeg CLI for two pinned HEIC input-only reads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)){
            choco install ffmpeg -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'FFmpeg installation failed on disposable runner'}
            $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH"
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $exe=(Get-Command ffmpeg -ErrorAction Stop).Source
          "FFMPEG_CLI=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate pinned lossless Annex B references from HEIC only under RUNNER_TEMP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $env:RUNNER_TEMP 'heic_native_bridge'
          if(Test-Path $folder){throw 'Refuse pre-existing test folder'}
          New-Item -ItemType Directory -Path $folder | Out-Null
          foreach($stem in @('04','fixture-irot3-exif6-noaux')){
            $src=(Resolve-Path "wictest/samples/$stem.heic").Path
            $hashBefore=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
            $out=Join-Path $folder "$stem.h265"
            $reference=Join-Path $folder "$stem.native.bgra"
            & $env:FFMPEG_CLI -hide_banner -nostdin -loglevel error -i $src -map 0:v:0 -c:v copy -bsf:v hevc_mp4toannexb -f hevc $out
            if($LASTEXITCODE -ne 0){throw "Lossless HEVC extraction failed: $stem"}
            & $env:FFMPEG_CLI -hide_banner -nostdin -loglevel error -f hevc -i $out -frames:v 1 -pix_fmt bgra -f rawvideo $reference
            if($LASTEXITCODE -ne 0){throw "BGRA reference generation failed: $stem"}
            $referenceYuv=Join-Path $folder "$stem.reference.yuv420p10le"
            & $env:FFMPEG_CLI -hide_banner -nostdin -loglevel error -f hevc -i $out -frames:v 1 -pix_fmt yuv420p10le -f rawvideo $referenceYuv
            if($LASTEXITCODE -ne 0){throw "Lossless native 10-bit YUV reference creation failed: $stem"}
            if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $hashBefore){throw "HEIC original modified: $stem"}
          }
          Write-Host 'HEIC_INPROCESS_PINNED_ANNEXB_INPUTS_READONLY_PASS'
      - name: Restore locked LGPL FFmpeg SDK for true library decode
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          & ./diagnostics/thumbnail_warmup/Prepare_FFmpeg_Inprocess_GPU_SDK_CI.ps1
          if($LASTEXITCODE -ne 0 -or -not $?){throw 'Pinned AVCodec SDK failure'}
      - name: Compile standalone in-process decoder
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeicInprocessGpuAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Windows C++ AVCodec decoder build failed'}
          Write-Host 'HEIC_INPROCESS_CPP_BUILD_PASS'
      - name: Assert byte-exact BGRA from both in-process Main10 decodes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeicInprocessGpuAB.exe').Path
          $env:HEIC_INPROCESS_DUMP_YUV='1'
          & $exe software
          if($LASTEXITCODE -ne 0){throw 'In-process software baseline failed'}
          foreach($stem in @('04','fixture-irot3-exif6-noaux')){
            $rawRef=Join-Path $env:RUNNER_TEMP "heic_native_bridge/$stem.reference.yuv420p10le"
            $rawActual=Join-Path $env:RUNNER_TEMP "heic_inprocess_software/$stem.yuv420p10le"
            if(-not (Test-Path -LiteralPath $rawRef) -or -not (Test-Path -LiteralPath $rawActual)){throw "Missing decoder-stage YUV comparison $stem"}
            $rawExact=((Get-FileHash -LiteralPath $rawRef -Algorithm SHA256).Hash -eq
                       (Get-FileHash -LiteralPath $rawActual -Algorithm SHA256).Hash)
            Write-Host "HEIC_INPROCESS_DECODED_YUV10_EXACT file=$stem exact=$rawExact"
            if(-not $rawExact){throw "Raw 10-bit decoder mismatch (not a color conversion issue): $stem"}
            $ref=Join-Path $env:RUNNER_TEMP "heic_native_bridge/$stem.native.bgra"
            $actual=Join-Path $env:RUNNER_TEMP "heic_inprocess_software/$stem.bgra"
            if(-not (Test-Path $actual)){throw "In-process image not created: $stem"}
            $same=((Get-FileHash -LiteralPath $ref -Algorithm SHA256).Hash -eq
                   (Get-FileHash -LiteralPath $actual -Algorithm SHA256).Hash)
            Write-Host "HEIC_INPROCESS_MAIN10_BGRA_PIXEL_EXACT file=$stem exact=$same"
            if(-not $same){throw "CPU decoder colors or pixels differ from FFmpeg CLI reference: $stem"}
          }
          Write-Host 'HEIC_INPROCESS_MAIN10_TWO_IMAGES_EXACT_PASS'
