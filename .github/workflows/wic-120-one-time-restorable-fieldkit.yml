name: WIC 1.1.20 restorable one-time Win10 Photos field kit - isolated CI
on:
  push:
    branches: [feature/photos-120-one-time-restore-kit]
    paths: ['.github/workflows/wic-120-one-time-restorable-fieldkit.yml', 'Installer/Package.wxs', 'wic_heic/**', 'wictest/**', 'diagnostics/photos_trace/WIC120_OneTimeTrial.ps1', 'diagnostics/photos_trace/WIC120_FieldTrial_README_JA.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Reuse existing native library cache keyed to pinned submodules
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $refs=(git submodule status --recursive) -join ([string][char]10)
          $sig=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))).Substring(0,20)
          "CODEC_DEPS=$sig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore known-good native codec libs
        id: native
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Prepare pinned native dependencies on isolated runner only if uncached
        if: steps.native.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            choco install nasm -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'NASM bootstrap failed'}
            $env:PATH="C:\Program Files\NASM;$env:PATH"
          }
          Push-Location 'wic_heic/3rdparty'
          try {
            foreach($part in @('libde265','kvazaar','libheif')){
              cmd /c "call build-$part.bat x64"
              if($LASTEXITCODE -ne 0){throw "Native dependency failed: $part"}
            }
          } finally {Pop-Location}
      - name: Cache matching deps after clean native compile
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build separate global WIC and isolated 0.4.0 private-preview installers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wic_heic.sln /t:Restore /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Solution restore failed'}
          # Build DLL first, then global MSI with FastPreview.wxs excluded only
          # from the disposable runner's working tree. Restoring the .wxs file
          # is mandatory before building the separate v0.4.0 preview MSI.
          msbuild wic_heic/wic_heic.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Global WIC DLL build failed'}
          $previewSource='Installer/FastPreview.wxs'
          $isolatedName='Installer/FastPreview.wxs.ci-global-disabled'
          if((Test-Path -LiteralPath $isolatedName) -or
             !(Test-Path -LiteralPath $previewSource)){throw 'Installer isolation preflight failed'}
          Move-Item -LiteralPath $previewSource -Destination $isolatedName -ErrorAction Stop
          try {
            msbuild Installer/Installer.wixproj /p:Configuration=Release /p:Platform=x64 /nologo
            if($LASTEXITCODE -ne 0){throw 'Global WIC MSI isolated build failed'}
          } finally {
            Move-Item -LiteralPath $isolatedName -Destination $previewSource -ErrorAction Stop
          }
          if(!(Test-Path -LiteralPath $previewSource) -or
             (Test-Path -LiteralPath $isolatedName)){
            throw 'Preview Wix source not restored after global build'
          }
          Write-Host 'GLOBAL_WIC_MSI_AND_V04_WIX_SOURCE_ISOLATION_PASS'
          $msi=@(Get-ChildItem -LiteralPath 'Installer/(Build)' -Filter 'WicHeic.msi' -File -Recurse |
            Where-Object {$_.FullName -match '[\\/]x64[\\/]' -and $_.FullName -match '[\\/]Release[\\/]'})
          if($msi.Count -ne 1){throw "Expected one global WIC x64 MSI"}
          $dir=Join-Path $env:RUNNER_TEMP 'wic_coexist'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $dir 'global.msi')
          Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination (Join-Path $dir 'global.dll')
          # Build WIC read/encode/rotation smoke probe before rebuilding the
          # decoder with the v0.4 private-only macro.
          msbuild wictest/wictest.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'WIC integration test executable build failed'}
          $env:CL='/DWIC_HEIC_PRIVATE_FAST_ADAPTIVE'
          try {
            msbuild wic_heic/wic_heic.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /nologo
            if($LASTEXITCODE -ne 0){throw 'Private 2/4 worker build failed'}
          } finally {Remove-Item Env:\CL -ErrorAction SilentlyContinue}
          Copy-Item 'wic_heic/(Build)/x64/Release/wic_heic.dll' 'Installer/WicHeicPrivateCodec.dll'
          msbuild wictest/isolated_shell/HeicShellFastPreview.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Preview Shell handler build failed'}
          msbuild Installer/FastPreview.wixproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Preview MSI build failed'}
          msbuild wictest/isolated_shell/Synthetic12MpHeic.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo
          if($LASTEXITCODE -ne 0){throw 'Disposable 8bit 12MP HEIC generator build failed'}
          $generator=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/Synthetic12MpHeic.exe').Path
          $codec=(Resolve-Path 'Installer/WicHeicPrivateCodec.dll').Path
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          & $generator $codec $fixture
          if($LASTEXITCODE -ne 0){throw 'Disposable 12MP Main 8bit HEIC generation failed'}
      - name: Prepare one-time opt-in Photos restore field kit on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
          if(Test-Path -LiteralPath $stage){throw 'Refuse to overwrite field trial staging'}
          New-Item -ItemType Directory -Path $stage | Out-Null
          $files=@{
            'Installer/(Build)/x64/Release/en-US/WicHeic.msi'='WicHeic-Repair-EXPERIMENTAL-x64.msi'
            'diagnostics/windows_install/Install_Experimental_WIC.ps1'='Install_Experimental_WIC.ps1'
            'diagnostics/photos_trace/Uninstall_WIC_Trial_RestorePreview.ps1'='Uninstall_WIC_Trial_RestorePreview.ps1'
            'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1'='WIC_Preflight_ReadOnly.ps1'
            'diagnostics/photos_trace/WIC_Photos_P0_OneTimeTrial_README_JA.md'='README_JA.md'
          }
          foreach($pair in $files.GetEnumerator()){
            Copy-Item -LiteralPath $pair.Key -Destination (Join-Path $stage $pair.Value) -ErrorAction Stop
          }
          # Synthetic 4032x3024 8bit Main HEIC generated afresh in isolated CI;
          # avoid using a 10bit RExt diagnostic for the user's initial UI check.
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic') -Destination (Join-Path $stage 'Synthetic_Test_Only.heic') -ErrorAction Stop
          $digest=(Get-FileHash -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Algorithm SHA256).Hash
          # The x64 Global WIC DLL has been overwritten by the PRIVATE adaptive
          # build, so take expected public hash ONLY from pinned global stash.
          $digest=(Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'wic_coexist/global.dll') -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $stage 'EXPECTED_GLOBAL_WIC_DLL_SHA256.txt'),($digest+[Environment]::NewLine),[Text.Encoding]::ASCII)
          foreach($p in @('Install_Experimental_WIC.ps1','Uninstall_WIC_Trial_RestorePreview.ps1','WIC_Preflight_ReadOnly.ps1')){
            $full=(Join-Path $stage $p)
            $errors=$null;$tokens=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($full,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "Windows PS5.1 syntax guard failed: $p"}
          }
          Write-Host 'HEIC_ONE_TIME_TRIAL_KIT_SOURCE_AND_SAFETY_SCRIPTS_PREPARED'
      - name: Verify global decoder-encoder and private preview stay installed independently
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temp=Join-Path $env:RUNNER_TEMP 'wic_coexist'
          $global=(Resolve-Path -LiteralPath (Join-Path $temp 'global.msi')).Path
          $preview=(Resolve-Path -LiteralPath '(Build)/x64/Release/en-US/WicHeicFastPreview.msi').Path
          $expectedWic=(Get-FileHash -LiteralPath (Join-Path $temp 'global.dll') -Algorithm SHA256).Hash
          $expectedPrivate=(Get-FileHash -LiteralPath 'Installer/WicHeicPrivateCodec.dll' -Algorithm SHA256).Hash
          if($expectedWic -eq $expectedPrivate){throw 'Public/private WIC builds unexpectedly identical'}
          $decoder='{6215667C-74CA-4076-A769-3F834C3F25F5}'
          $encoder='{0E8AB687-73A5-455B-8C19-B93CA9AC0EEB}'
          $handler='{D973196C-165C-4FCE-8838-17C37037D384}'
          $shell='{E357FCCD-A995-4576-B01F-234630154E96}'
          function ReadVal([string]$p,[string]$root){
            if($root -eq 'HKLM'){$hive=[Microsoft.Win32.Registry]::LocalMachine}
            else{$hive=[Microsoft.Win32.Registry]::CurrentUser}
            $k=$hive.OpenSubKey($p)
            if(!$k){return ''}
            try{return [string]$k.GetValue('')}finally{$k.Close()}
          }
          function TestGlobal([bool]$exists){
            foreach($cls in @($decoder,$encoder)){
              $p=ReadVal "SOFTWARE\Classes\CLSID\$cls\InprocServer32" 'HKLM'
              if(!$exists){if($p){throw 'Unexpected system WIC registration'};continue}
              if(!$p -or !(Test-Path -LiteralPath $p -PathType Leaf)){throw "Missing global WIC CLSID: $cls"}
              if((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash -ne $expectedWic){throw 'System WIC DLL changed'}
            }
          }
          function TestPreview([bool]$exists){
            $p=ReadVal "SOFTWARE\Classes\CLSID\$handler\InprocServer32" 'HKLM'
            $u=ReadVal "Software\Classes\.heic\ShellEx\$shell" 'HKCU'
            if(!$exists){if($p -or $u){throw 'Thumbnail handler unexpectedly registered'};return}
            if(!$p -or !(Test-Path -LiteralPath $p -PathType Leaf) -or $u -cne $handler){throw 'Preview handler/association missing'}
            $private=Join-Path (Split-Path -Parent $p) 'WicHeicPrivateCodec.dll'
            if(!(Test-Path -LiteralPath $private -PathType Leaf)){throw 'Private preview codec missing'}
            if((Get-FileHash -LiteralPath $private -Algorithm SHA256).Hash -ne $expectedPrivate){throw 'Private preview codec changed'}
          }
          function Msi([string]$operation,[string]$path){
            $argsText="/$operation "+'"'+$path+'"'+' /qn /norestart'
            $process=Start-Process -FilePath 'msiexec.exe' -ArgumentList $argsText -Wait -PassThru
            if($process.ExitCode -ne 0){throw "MSI $operation failed code=$($process.ExitCode)"}
          }
          TestGlobal $false;TestPreview $false
          $g=$false;$p=$false
          try {
            Msi 'i' $global;$g=$true
            TestGlobal $true;TestPreview $false
            Msi 'i' $preview;$p=$true
            TestGlobal $true;TestPreview $true
            Msi 'x' $preview;$p=$false
            TestGlobal $true;TestPreview $false
            Msi 'x' $global;$g=$false
            TestGlobal $false;TestPreview $false
            Write-Host 'HEIC_GLOBAL_THEN_PREVIEW_COINSTALL_AND_ROLLBACK_PASS'
          } finally {
            if($p){Msi 'x' $preview}
            if($g){Msi 'x' $global}
          }
          # This is the actual user repair ordering: leave v0.4 present,
          # add global WIC, remove ONLY global WIC, then remove preview.
          TestGlobal $false;TestPreview $false
          $g=$false;$p=$false
          try {
            Msi 'i' $preview;$p=$true
            TestGlobal $false;TestPreview $true
            $stage=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
            & (Join-Path $stage 'Install_Experimental_WIC.ps1') -CheckOnly
            if(-not $?){throw 'Field trial pre-install gate failed'}
            & (Join-Path $stage 'Install_Experimental_WIC.ps1')
            if(-not $?){throw 'Field trial global WIC installation failed'}
            $g=$true
            TestGlobal $true;TestPreview $true
            # Populate pinned synthetic lossless 90/180/270° fixtures in the
            # disposable runner exactly as the original native WIC CI does.
            # No real user media, and the repo fixture is hash-audited below.
            python -m py_compile 'tools/lossless_heic_rotate_experimental.py'
            if($LASTEXITCODE -ne 0){throw 'Lossless generator Python syntax invalid'}
            python 'tools/test_lossless_heic_rotate.py'
            if($LASTEXITCODE -ne 0){throw 'Lossless synthetic fixture preparation failed'}
            # Real WIC decoding, encoding, orientation and EXIF readback must
            # work WITH v0.4 registered; COM registration alone is insufficient.
            $test=(Resolve-Path -LiteralPath 'wictest/(Build)/x64/Release/wictest.exe').Path
            $fixture=(Resolve-Path -LiteralPath 'wictest/samples/fixture-irot3-exif6-noaux.heic').Path
            $fixtureHash=(Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash
            Push-Location 'wictest'
            try {
              & $test
              if($LASTEXITCODE -ne 0){throw 'WIC decoder/encoder/orientation regression with v0.4 preview installed'}
            } finally {Pop-Location}
            if((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash -ne $fixtureHash) {
              throw 'CI input HEIC was changed by WIC interoperability test'
            }
            Write-Host 'HEIC_NATIVE_WIC_DECODE_ENCODE_ROTATE_AND_V04_PREVIEW_COEXIST_PASS'
            & (Join-Path $stage 'Uninstall_WIC_Trial_RestorePreview.ps1') -CheckOnly
            if(-not $?){throw 'Field trial pre-uninstall guard failed'}
            & (Join-Path $stage 'Uninstall_WIC_Trial_RestorePreview.ps1')
            if(-not $?){throw 'Field trial rollback script failed'}
            $g=$false
            TestGlobal $false;TestPreview $true
            Write-Host 'HEIC_FIELD_TRIAL_INSTALL_ROLLBACK_PRESERVES_EXISTING_V04_PASS'
            Msi 'x' $preview;$p=$false
            TestGlobal $false;TestPreview $false
            Write-Host 'HEIC_V040_PREVIEW_THEN_GLOBAL_COINSTALL_AND_INDEPENDENT_ROLLBACK_PASS'
          } finally {
            if($g){Msi 'x' $global}
            if($p){Msi 'x' $preview}
          }
          if(@(git diff --name-only -- 'Installer/' 'wic_heic/').Count -ne 0) {
            throw 'Disposable CI modified the tracked production files.'
          }
          Write-Host 'NO_USER_PC_TESTED=1 WINDOWS_PHOTOS_EDITOR_UNVERIFIED=1 NO_AUTO_INSTALL=1'
      - name: Assemble clean one-time opt-in trial package only after both complete passes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration'
          $out=Join-Path $env:RUNNER_TEMP 'WIC_Photos_P0_Win10_Trial_Candidate'
          if(Test-Path -LiteralPath $out){throw 'Field artifact staging collision'}
          New-Item -ItemType Directory -Path $out | Out-Null
          foreach($name in @(
            'WicHeic-Repair-EXPERIMENTAL-x64.msi','Install_Experimental_WIC.ps1',
            'Uninstall_WIC_Trial_RestorePreview.ps1','WIC_Preflight_ReadOnly.ps1',
            'EXPECTED_GLOBAL_WIC_DLL_SHA256.txt','README_JA.md','Synthetic_Test_Only.heic'
          )){
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination (Join-Path $out $name) -ErrorAction Stop
          }
          if(@(Get-ChildItem -LiteralPath $out -File).Count -ne 7){throw 'Candidate kit incomplete'}
          Write-Host 'HEIC_PHOTOS_SINGLE_P0_TRIAL_PACKAGE_PREPARED_WINDOWS10_UNVERIFIED'
      - name: Fetch exact historical 1.1.18 installer for upgrade test
        uses: actions/download-artifact@v4
        with:
          name: WicHeic-HEIC-x64-MSI-only-Win10-Photos-UNVERIFIED
          run-id: 39433397223
          repository: taku077/wic_heic
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original118
      - name: Verify MSI upgraded legacy 1.1.18 without conflicting with preview
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $original=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'original118') -Recurse -Filter '*.msi' -File)
          if($original.Count -ne 1){throw 'Historical 1.1.18 MSI absent'}
          $old=$original[0].FullName
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ne '4FE1809A98C0B7EB7E7A505A6105BE57A34052DE74D79A13DB0853A9EC2AACE6'){
            throw 'Historical 1.1.18 MSI hash mismatch'
          }
          $new=(Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration/WicHeic-Repair-EXPERIMENTAL-x64.msi')
          $engine=New-Object -ComObject WindowsInstaller.Installer
          function Props([string]$path){
            $db=$engine.OpenDatabase($path,0);$out=@{}
            foreach($name in @('ProductName','ProductVersion','ProductCode','UpgradeCode')){
              $q=$db.OpenView("SELECT Value FROM Property WHERE Property = '$name'")
              try{[void]$q.Execute();$r=$q.Fetch();$out[$name]=if($r){[string]$r.StringData(1)}else{''}}
              finally{[void]$q.Close()}
            }
            return $out
          }
          $a=Props $old;$b=Props $new
          Write-Host ('OLD_MSI='+($a | ConvertTo-Json -Compress))
          Write-Host ('NEW_MSI='+($b | ConvertTo-Json -Compress))
          if($a.ProductVersion -ne '1.1.18' -or $b.ProductVersion -ne '1.1.20' -or
             $a.ProductName -ne $b.ProductName -or
             $a.UpgradeCode -ne $b.UpgradeCode -or $a.ProductCode -eq $b.ProductCode){
            throw 'MajorUpgrade product identity/version mismatch'
          }
          $dllHash=(Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'wic_coexist/global.dll') -Algorithm SHA256).Hash
          $decoder='Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\CLSID\{6215667C-74CA-4076-A769-3F834C3F25F5}\InprocServer32'
          function Msi([string]$op,[string]$file){
            $arg='/'+$op+' "'+$file+'" /qn /norestart'
            $p=Start-Process msiexec.exe -ArgumentList $arg -PassThru -Wait
            if($p.ExitCode -ne 0){throw ('msiexec '+$op+' failed: '+$p.ExitCode)}
          }
          $oldInstalled=$false;$newInstalled=$false
          try{
            Msi i $old;$oldInstalled=$true
            $oldLocation=[string](Get-Item -LiteralPath $decoder -ErrorAction Stop).GetValue('')
            if(!(Test-Path -LiteralPath $oldLocation -PathType Leaf)){
              throw 'Historical 1.1.18 installed decoder DLL absent'
            }
            $oldDllHash=(Get-FileHash -LiteralPath $oldLocation -Algorithm SHA256).Hash
            Write-Host ('WIC_HISTORICAL_118_DLL_SHA256='+$oldDllHash)
            # The user's 2026-10-23 read-only report explicitly identifies
            # this exact v1.1.18 DLL. A different historical installer is not
            # a valid restore package for their PC.
            if($oldDllHash -ne '9E9D2F17038C03A5BF8840A8BD43BC4FDA19C91E947C4CD5904A8209051F93D4'){
              throw 'Historical 1.1.18 DLL differs from the actual user baseline'
            }
            Write-Host 'WIC_USER_BASELINE_118_DLL_HASH_MATCH_PASS'
            Msi i $new;$newInstalled=$true;$oldInstalled=$false
            $dll=[string](Get-Item -LiteralPath $decoder -ErrorAction Stop).GetValue('')
            if(!(Test-Path -LiteralPath $dll -PathType Leaf)){throw 'Upgraded global decoder missing'}
            if((Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash -ne $dllHash){
              throw 'Upgraded global decoder hash mismatch'
            }
            $former=Join-Path 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' $a.ProductCode
            if(Test-Path -LiteralPath $former){throw 'Legacy 1.1.18 MSI registration remains'}
            Write-Host 'WIC_118_TO_120_REAL_MSI_MAJOR_UPGRADE_PASS'
          }finally{
            if($newInstalled){Msi x $new}
            elseif($oldInstalled){Msi x $old}
          }
          if(Test-Path -LiteralPath $decoder){throw 'Global WIC registration remained after uninstall'}
          Write-Host 'WIC_120_UNINSTALL_CLEAN_REGISTRATION_PASS'
          # Only a fully reversible replacement qualifies for a user's
          # installed historical v1.1.18. Prove reinstall restores the exact
          # old codec DLL bytes before offering any Windows 10 field build.
          $restoredOld=$false
          try {
            Msi i $old;$restoredOld=$true
            $restoredDll=[string](Get-Item -LiteralPath $decoder -ErrorAction Stop).GetValue('')
            if(!(Test-Path -LiteralPath $restoredDll -PathType Leaf)){
              throw 'Historical WIC was not restored'
            }
            $restoredHash=(Get-FileHash -LiteralPath $restoredDll -Algorithm SHA256).Hash
            if($restoredHash -ne $oldDllHash){
              throw 'Restored historical WIC DLL differs from pre-upgrade bytes'
            }
            Write-Host 'WIC_120_TO_118_HISTORICAL_MSI_BYTE_IDENTICAL_RESTORE_PASS'
          } finally {
            if($restoredOld){Msi x $old}
          }
          if(Test-Path -LiteralPath $decoder){
            throw 'Historical WIC registration remains after restore/cleanup'
          }
      - name: Assemble fully restorable field kit with historical 1.1.18 and 1.1.20 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'WIC120_OneTime_CompleteKit'
          if(Test-Path -LiteralPath $stage){throw 'Unsafe field kit destination collision'}
          New-Item -ItemType Directory -Path $stage | Out-Null
          $old=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'original118') -Recurse -Filter '*.msi' -File)
          if($old.Count -ne 1){throw 'The historical 1.1.18 MSI is not uniquely available'}
          if((Get-FileHash -LiteralPath $old[0].FullName -Algorithm SHA256).Hash -ne '4FE1809A98C0B7EB7E7A505A6105BE57A34052DE74D79A13DB0853A9EC2AACE6'){
            throw 'Historical 1.1.18 restore MSI hash mismatch'
          }
          $new=Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration/WicHeic-Repair-EXPERIMENTAL-x64.msi'
          Copy-Item -LiteralPath $old[0].FullName -Destination (Join-Path $stage 'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi')
          Copy-Item -LiteralPath $new -Destination (Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi')
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC120_OneTimeTrial.ps1' -Destination $stage
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC_Preflight_ReadOnly.ps1' -Destination $stage
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC_Preflight_Compare.ps1' -Destination $stage
          Copy-Item -LiteralPath 'diagnostics/photos_trace/WIC120_FieldTrial_README_JA.md' -Destination (Join-Path $stage 'README_JA.md')
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'Photos_WIC_P0_Trial_Integration/Synthetic_Test_Only.heic') -Destination $stage
          $sha=(Get-FileHash -LiteralPath (Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi') -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $stage 'WIC120_MSI_SHA256.txt'),
             $sha+[Environment]::NewLine,[Text.Encoding]::ASCII)
          foreach($script in @('WIC120_OneTimeTrial.ps1','WIC_Preflight_ReadOnly.ps1','WIC_Preflight_Compare.ps1')){
            $p=Join-Path $stage $script
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ('PowerShell 5.1 syntax validation failed: '+$script)}
          }
          if(@(Get-ChildItem -LiteralPath $stage -File).Count -ne 8){throw 'Complete kit expected exactly eight files'}
          Write-Host 'WIC120_EXACT_OLD_MSI_AND_NEW_MSI_WITH_RECOVERY_SCRIPTS_STAGED_PASS'
          Write-Host ('WIC120_FIELDKIT_MSI_SHA256='+$sha)
      - name: Exercise identical Win10 field kit scripts: precheck, upgrade and exact rollback in disposable CI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'WIC120_OneTime_CompleteKit'
          $runnerScript=Join-Path $stage 'WIC120_OneTimeTrial.ps1'
          $old=Join-Path $stage 'WicHeic-Repair-1.1.18-ORIGINAL-x64.msi'
          $new=Join-Path $stage 'WicHeic-Repair-1.1.20-TRIAL-x64.msi'
          $preview=(Resolve-Path -LiteralPath '(Build)/x64/Release/en-US/WicHeicFastPreview.msi').Path
          function Msi([string]$op,[string]$file){
            $arg='/'+$op+' "'+$file+'" /qn /norestart'
            $p=Start-Process msiexec.exe -ArgumentList $arg -Wait -PassThru
            if($p.ExitCode -ne 0){throw ("Disposable CI msiexec $op exit=$($p.ExitCode)")}
          }
          $oldInstalled=$false;$newInstalled=$false;$previewInstalled=$false
          try {
            Msi i $preview;$previewInstalled=$true
            Msi i $old;$oldInstalled=$true
            & $runnerScript -CheckOnly
            if(-not $?){throw 'Full kit read-only precheck failed'}
            Write-Host 'WIC120_FIELDKIT_CHECKONLY_USER_BASELINE_PASS'
            & $runnerScript -Install
            if(-not $?){throw 'Full kit installer rejected legitimate 1.1.18 state'}
            $newInstalled=$true;$oldInstalled=$false
            $sessions=@(Get-ChildItem -LiteralPath $stage -Filter 'WIC120_Session_*.json' -File)
            if($sessions.Count -ne 1){throw 'Trial session not uniquely and safely persisted'}
            Write-Host 'WIC120_FIELDKIT_118_TO_120_UPGRADE_PASS'
            & $runnerScript -Restore -Session $sessions[0].FullName
            if(-not $?){throw 'Full kit original 1.1.18 restore failed'}
            $newInstalled=$false;$oldInstalled=$true
            Write-Host 'WIC120_FIELDKIT_118_RESTORATION_AND_V04_PRESERVATION_PASS'
          } finally {
            # GitHub disposable Windows runner only; never auto-uninstall any
            # component on a user computer. Independently preserve candidate
            # and original MSIs for recovery even if the test fails.
            if($newInstalled){Msi x $new}
            if($oldInstalled){Msi x $old}
            if($previewInstalled){Msi x $preview}
          }
          Write-Host 'WIC120_COMPLETEKIT_TESTED_ONLY_ON_WINDOWS_SERVER_WIN10_PHOTOS_GUI_UNVERIFIED'
      - name: Verify exact x64 MSI artifact identity and digest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'WIC_120_CI_Only'
          New-Item -ItemType Directory -Path $stage | Out-Null
          $source=Join-Path $env:RUNNER_TEMP 'WIC_Photos_P0_Win10_Trial_Candidate/WicHeic-Repair-EXPERIMENTAL-x64.msi'
          $target=Join-Path $stage 'WicHeic-Repair-1.1.20-x64.msi'
          Copy-Item -LiteralPath $source -Destination $target -ErrorAction Stop
          $hash=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          [IO.File]::WriteAllText((Join-Path $stage 'MSI_SHA256.txt'), $hash+[Environment]::NewLine)
          Write-Host ('WIC_120_FINAL_MSI_SHA256='+$hash)
          Write-Host 'WINDOWS_SERVER_WIC_NATIVE_AND_UPGRADE_TESTED; WINDOWS10_PHOTOS_UI_UNVERIFIED'
      - name: Upload MSI as a CI candidate (not Windows Photos verified)
        uses: actions/upload-artifact@v4
        with:
          name: WicHeic-Repair-1.1.20-x64-CI-candidate-Photos-UNVERIFIED
          path: ${{ runner.temp }}/WIC_120_CI_Only/
          if-no-files-found: error
          retention-days: 30

      - name: Publish one-time complete recovery kit as UNVERIFIED CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIC120-Win10-Photos-OneTime-CompleteRecoveryKit-UNVERIFIED
          path: ${{ runner.temp }}/WIC120_OneTime_CompleteKit/
          if-no-files-found: error
          retention-days: 30
