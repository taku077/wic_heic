name: Manual-stop real-HEIC WPR / CPU-WIC diagnostic PS5.1
on:
  push:
    branches:
      - diagnostic/wpr-manual-real-heic-20261029
      - diagnostic/wpr-stop-evidence-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps51:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify manual mode has no duration limit and artificial requirement
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $s=Get-Content -LiteralPath 'diagnostics/photos_trace/COM_CPU_WPR_Manual.ps1' -Raw
          foreach($term in @('Read-Host','GeneralProfile.Verbose','CPU.Verbose','-instancename','Compress-Archive')) {
            if(-not $s.Contains($term)){throw "Missing diagnostic requirement: $term"}
          }
          if($s -match '\[ValidateRange\([^)]+\)\]\[int\]\$DurationSeconds') {
            throw 'Timed user capture accidentally reintroduced'
          }
          Write-Host 'WPR_MANUAL_NO_TIMEOUT_SOURCE_GATE_PASS'
      - name: One-run real WPR stack smoke on Windows PowerShell 5.1 (CI-only 5s)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Must test Windows PowerShell 5.1'}
          & ./diagnostics/photos_trace/COM_CPU_WPR_Manual.ps1 -CiSmoke
          # The script emits Write-Host, which is not pipeline output. Use the
          # ETL ZIP and manifest as authoritative completion evidence.
          $settings=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($settings -and (($settings.PSObject.Properties.Name -contains 'TraceFile') -or
              ($settings.PSObject.Properties.Name -contains 'TraceUntilFileTime'))){
            throw 'WIC opt-in trace registry keys were left behind'
          }
          $archive=Get-ChildItem 'diagnostics/photos_trace' -Filter 'COM_CPU_WPR_Manual_*.zip' -File |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $archive){throw 'No diagnostic ZIP was created'}
          Add-Type -AssemblyName System.IO.Compression
          $z=[IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            foreach($target in @('CPU_Stacks.etl','Process_CPU_1s.csv','WIC_Decode_Events.txt',
                                 'CPU_WIC_Summary.txt','Capture_Manifest.txt')){
              if(@($z.Entries | Where-Object {$_.Name -eq $target}).Count -ne 1){
                throw "ZIP missing: $target"
              }
            }
            $entry=$z.Entries | Where-Object {$_.Name -eq 'CPU_Stacks.etl'} | Select-Object -First 1
            if($entry.Length -lt 1024){throw 'WPR ETL too small'}
          } finally {$z.Dispose()}
          Write-Host 'WPR_MANUAL_ONEPASS_WINDOWS_PS51_PASS'
      - name: Simulate a Windows 10-like WPR save failure and preserve partial diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='./diagnostics/photos_trace/COM_CPU_WPR_Manual.ps1'
          $failed=$false
          try {
            & $script -CiSmoke -CiForceStopFailure
          } catch {
            $failed=$true
            Write-Host ('EXPECTED_INJECTED_STOP_FAILURE '+$_.Exception.Message)
          }
          if(-not $failed){throw 'Fault injection did not fail closed'}
          $folder=Get-ChildItem -LiteralPath 'diagnostics/photos_trace' -Directory -Filter 'COM_CPU_WPR_Manual_*' |
             Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $folder){throw 'Failure capture directory missing'}
          $status=Get-Content -LiteralPath (Join-Path $folder.FullName 'Capture_Manifest.txt') -Raw
          if($status -notmatch 'ResultStatus=FAILED_PARTIAL' -or
             $status -notmatch 'WPRStopExitCode=777' -or
             $status -notmatch 'CPU_Stacks.etl unavailable'){
             throw 'Fault injection lost WPR failure details'
          }
          $parent=Split-Path $folder.FullName -Parent
          $statusLogs=Get-ChildItem $parent -File -Filter 'WPR_Child_Status_*.txt'
          if(-not($statusLogs | Where-Object {
            (Get-Content $_.FullName -Raw) -match 'WPR STOP exit=777'
          })) {throw 'No persistent WPR stop diagnostics'}
          foreach($name in @('Process_CPU_1s.csv','WIC_Decode_Events.txt','CPU_WIC_Summary.txt')){
            if(-not(Test-Path -LiteralPath (Join-Path $folder.FullName $name))){
               throw "Partial capture lost: $name"
            }
          }
          $zip=$folder.FullName+'.zip'
          if(-not(Test-Path -LiteralPath $zip)){throw 'Failure ZIP missing'}
          $settings=Get-ItemProperty -Path 'HKCU:\Software\WicHeic' -ErrorAction SilentlyContinue
          if($settings -and (($settings.PSObject.Properties.Name -contains 'TraceFile') -or
                            ($settings.PSObject.Properties.Name -contains 'TraceUntilFileTime'))){
             throw 'Failure scenario left WIC trace registry settings'
          }
          Write-Host 'WPR_FAULT_INJECTION_PRESERVED_LOGS_PASS'

      - name: Package only reviewed diagnostic source (no MSI, no HEIC)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/photos_trace'
          New-Item -ItemType Directory -Path wpr-manual-distribution -Force | Out-Null
          foreach($name in @('01_Start_CPU_Manual.cmd','COM_CPU_WPR_Manual.ps1',
                 'COM_CPU_WIC_Analyze.ps1','PhotosTrace_Start.ps1',
                 'PhotosTrace_Stop.ps1','README_CPU_WPR_MANUAL_JA.md')){
             if(-not(Test-Path -LiteralPath (Join-Path $root $name))){throw "Missing $name"}
             Copy-Item -LiteralPath (Join-Path $root $name) -Destination (Join-Path 'wpr-manual-distribution' $name)
          }
          Write-Host 'WPR_MANUAL_DISTRIBUTION_READY'
      - uses: actions/upload-artifact@v4
        with:
          name: WicHeic-1.1.30-WPR-Manual-RealFolder-PS51-Verified
          path: wpr-manual-distribution/*
          if-no-files-found: error
          retention-days: 14
