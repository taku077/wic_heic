name: HEIC FFmpeg HEVC software decoder feasibility - no MSI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avx2-ab:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Compute precise dependency cache key
        shell: pwsh
        run: |
          $refs=(git submodule status --recursive) -join ([string][char]10)
          $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))).Substring(0,20)
          "CODEC_DEPS=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore baseline native dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Install NASM on baseline native build cache miss
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            choco install nasm -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'NASM setup failed'}
            $env:PATH="C:\Program Files\NASM;$env:PATH"
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Compile baseline libheif and libde265 if not cached
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('libde265','kvazaar','libheif')){
            cmd /c "call build-$name.bat x64"
            if($LASTEXITCODE -ne 0){throw "Baseline native dependency failed: $name"}
          }
      - name: Save baseline native build cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build baseline WIC HEIC DLL and test tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:CL='/DWIC_HEIC_PRIVATE_FAST_ADAPTIVE'
          msbuild wic_heic/wic_heic.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Baseline WIC decoder compile failed'}
          Remove-Item Env:\CL
          $root=(Resolve-Path $env:RUNNER_TEMP).Path
          $base=Join-Path $root 'BaselineWicCodec.dll'
          Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination $base
          "BASELINE_CODEC=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          msbuild wictest/isolated_shell/Synthetic12MpHeic.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Synthetic12MpHeic compile failed'}
          msbuild wictest/isolated_shell/AVX2PrivateAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'MSVC AVX2 COM A/B runner compile failed'}
      - name: Generate synthetic 12MP HEIC for equal-input A/B and record SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:RUNNER_TEMP 'wicfast_synthetic_4032x3024.heic'
          $tool=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/Synthetic12MpHeic.exe').Path
          & $tool $env:BASELINE_CODEC $fixture
          if($LASTEXITCODE -ne 0){throw 'Synthetic HEIC creation failed'}
          "AVX2_INPUT=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AVX2_INPUT_SHA=$((Get-FileHash -LiteralPath $fixture -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Profile raw HEVC decode plus colorspace conversion RGB vs YCbCr (no image writes)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeifColorAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'HEIF color decode decomposition compilation failed'}
          $bench=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifColorAB.exe').Path
          & $bench $env:AVX2_INPUT
          if($LASTEXITCODE -ne 0){throw 'Raw YCbCr-vs-RGB HEIF cost benchmark failed'}
          if((Get-FileHash -LiteralPath $env:AVX2_INPUT -Algorithm SHA256).Hash -ne $env:AVX2_INPUT_SHA) {
            throw 'Color decomposition changed synthetic source'
          }
          Write-Host 'HEIC_YCBCR_RGB_INTERNAL_COLOR_COST_MEASURED'
      - name: Find Windows FFmpeg HEIC input support (research, no user files)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Get-Command ffmpeg -ErrorAction SilentlyContinue
          if(-not $candidate){
            choco install ffmpeg -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'FFmpeg research CLI install failed in temporary runner'}
            $env:PATH="C:\ProgramData\chocolatey\bin;$env:PATH"
            $candidate=Get-Command ffmpeg -ErrorAction SilentlyContinue
          }
          if(-not $candidate){throw 'FFmpeg command still unavailable'}
          $exe=$candidate.Source
          Write-Host "FFMPEG_EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
          & $exe -version | Select-Object -First 2
          if($LASTEXITCODE -ne 0){throw 'FFmpeg version failed'}
          "FFMPEG_CLI=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Probe FFmpeg HEIC decoder and compare thread counts and CLI overhead
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=$env:FFMPEG_CLI
          $file=$env:AVX2_INPUT
          if(-not $file.StartsWith($env:RUNNER_TEMP+'\')){throw 'Not a disposable CI image path'}
          if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $env:AVX2_INPUT_SHA){
            throw 'Fixture hash changed before FFmpeg study'
          }
          $ok=$true
          $bench=@{}
          foreach($workers in @(1,2,4)){
            $samples=New-Object 'System.Collections.Generic.List[double]'
            for($i=0;$i -lt 4;$i++){
              $sw=[Diagnostics.Stopwatch]::StartNew()
              & $exe -hide_banner -nostdin -loglevel error -threads $workers -i $file -frames:v 1 -vf 'scale=256:192:flags=bicubic' -pix_fmt bgra -f rawvideo -y NUL
              $code=$LASTEXITCODE
              $sw.Stop()
              if($code -ne 0){
                Write-Host "FFMPEG_HEIC_RESEARCH_NOT_AVAILABLE worker_threads=$workers exit_code=$code"
                $ok=$false; break
              }
              $samples.Add($sw.Elapsed.TotalMilliseconds)
              Write-Host ('FFMPEG_HEIC_CLI_SAMPLE threads={0} elapsed_ms={1:N2}' -f $workers,$sw.Elapsed.TotalMilliseconds)
            }
            if(-not $ok){break}
            $sorted=@($samples|Sort-Object)
            $median=($sorted[1]+$sorted[2])/2
            $bench[$workers]=$median
            Write-Host ('FFMPEG_HEIC_CLI_MEDIAN threads={0} process_included_ms={1:N2}' -f $workers,$median)
          }
          if($ok){
            Write-Host 'FFMPEG_HEIC_CLI_DECODE_AND_SCALE_AVAILABLE'
          } else {
            Write-Host 'FFMPEG_HEIC_CLI_INPUT_UNSUPPORTED_NO_SPEEDUP_CLAIM'
          }
          if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $env:AVX2_INPUT_SHA){
            throw 'Synthetic HEIC modified by FFmpeg research'
          }
          Write-Host 'FFMPEG_HEIC_RESEARCH_INPUT_UNCHANGED'
      - name: Research only, no MSI or registry changes
        shell: pwsh
        run: |
          Write-Host 'FFMPEG_HEVC_COMPARATIVE_FEASIBILITY_NOT_INTEGRATED_OR_PIXEL_PARITY_VERIFIED'
