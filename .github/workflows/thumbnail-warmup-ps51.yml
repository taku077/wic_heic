name: HEIC Explorer warmup - Windows PowerShell 5.1 preflight

on:
  push:
    branches:
      - diagnostic/photos-wic-calltrace
  workflow_dispatch:

jobs:
  ps51-parse-and-interop:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate script grammar and Shell interop on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5) { throw 'PS5.1 required for this smoke test' }
          foreach($file in @(
            'diagnostics/thumbnail_warmup/Explorer_HEIC_Warmup.ps1',
            'diagnostics/thumbnail_warmup/Run_Synthetic_Explorer_Test.ps1'
          )) {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,[ref]$errors
            )
            if($errors.Count -gt 0) {
              $messages=($errors | ForEach-Object { $_.ToString() }) -join '; '
              throw "PowerShell 5.1 syntax invalid in $file : $messages"
            }
          }
          $result=@(& ./diagnostics/thumbnail_warmup/Explorer_HEIC_Warmup.ps1 -Mode SelfTest)
          if(-not ($result -match 'WARMUP_SELFTEST_PASSED')) {
            throw 'Native Shell cache interop did not compile on PowerShell 5.1'
          }
          Write-Host 'WIN10_POWERSHELL_5_1_PARSE_AND_NATIVE_INTEROP_PASSED'

          # Reproduce real one-click process invocation. Previously the 20s
          # watcher printed its completion marker but did not exit in time.
          $exe=Join-Path $env:WINDIR 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $script=(Resolve-Path -LiteralPath 'diagnostics/thumbnail_warmup/Explorer_HEIC_Warmup.ps1').Path
          $out=Join-Path $env:RUNNER_TEMP 'watcher-child-stdout.txt'
          $err=Join-Path $env:RUNNER_TEMP 'watcher-child-stderr.txt'
          $args='-NoProfile -ExecutionPolicy Bypass -File "'+$script+'" -Mode Watch -DurationSeconds 5 -MaxFiles 1 -ExitWhenDone'
          $started=Get-Date
          $child=Start-Process -FilePath $exe -ArgumentList $args -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if(-not $child.WaitForExit(20000)) {
            Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
            throw 'WATCHER_CHILD_EXIT_TIMEOUT: stdout='+(Get-Content -LiteralPath $out -Raw)
          }
          $stdout=Get-Content -LiteralPath $out -Raw
          $stderr=Get-Content -LiteralPath $err -Raw
          $child.Refresh()
          # Start-Process -PassThru on Windows PowerShell 5.1 may expose an
          # empty ExitCode after waiting, even when the process has exited.
          # The explicit lifecycle assertion is HasExited + completion marker.
          if(-not $child.HasExited -or -not $stdout.Contains('WARMUP_WATCH_COMPLETED')) {
            throw "WATCHER_CHILD_LIFECYCLE_FAILED exited=$($child.HasExited) exit_code=$($child.ExitCode) out=$stdout err=$stderr"
          }
          $elapsed=((Get-Date)-$started).TotalSeconds
          if($elapsed -ge 20) {throw "WATCHER_CHILD_TOO_SLOW seconds=$elapsed"}
          Write-Host ('WIN10_POWERSHELL_5_1_CHILD_EXIT_PASSED seconds='+[Math]::Round($elapsed,2))

