name: HEIC RExt unregistered private Shell versus WIC parity
on:
  push:
    branches: [experiment/heic-gpu-inprocess-avcodec]
    paths:
      - '.github/workflows/heic-rext-direct-parity.yml'
      - 'wictest/isolated_shell/HeicRextDirectCorpus.h'
      - 'wictest/isolated_shell/HeicBitmapFrameDecodeProfileCI.cpp'
      - 'wictest/isolated_shell/HeifRextThreadsAB.cpp'
      - 'wictest/isolated_shell/HeifRextThreadsAB.vcxproj'
      - 'wictest/isolated_shell/HeifRextColorStageAB.cpp'
      - 'wictest/isolated_shell/HeifRextColorStageAB.vcxproj'
      - 'wictest/isolated_shell/ShellEmbeddedDirect.cpp'
      - 'wictest/isolated_shell/HeicTrialThumbnail.cpp'
      - 'wictest/isolated_shell/HeicShellFastPreview.vcxproj'
      - 'wic_heic/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-private-codec:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Get fixed native dependency cache key
        shell: pwsh
        run: |
          $refs=(git submodule status --recursive) -join ([string][char]10)
          $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($refs))).Substring(0,20)
          "CODEC_DEPS=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore pinned native libheif dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Install NASM if dependencies uncached
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if(-not (Get-Command nasm -ErrorAction SilentlyContinue)){
            choco install nasm -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'NASM dependency failed'}
            $env:PATH="C:\Program Files\NASM;$env:PATH"
            "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build fixed native deps if cache misses
        if: steps.deps.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: wic_heic/3rdparty
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in @('libde265','kvazaar','libheif')){
            cmd /c "call build-$name.bat x64"
            if($LASTEXITCODE -ne 0){throw "Build dependency failed: $name"}
          }
      - name: Save fixed native library cache if necessary
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wic_heic/3rdparty/_out/x64
          key: wic-repair-x64-${{ env.CODEC_DEPS }}-v1
      - name: Build three isolated DLL/EXE binaries without registering any codec
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # CI runner checkout ONLY: temporarily substitute a separately
          # tracked research copy. Restore the original immediately after
          # build, without touching the repository, production artifacts,
          # Windows WIC registration, Photos or HEIC Manager.
          $source='wic_heic/HeicBitmapFrameDecode.cpp'
          $research='wictest/isolated_shell/HeicBitmapFrameDecodeProfileCI.cpp'
          $sha=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if(-not (Select-String -Path $research -Pattern 'WIC_HEIC_REXT_TIMING_CI' -Quiet)){
            throw 'CI-only decoder research source lacks isolation guard'
          }
          $stash=Join-Path $env:RUNNER_TEMP 'heic_rext_profile_binaries'
          if(Test-Path -LiteralPath $stash){throw 'CI benchmark scratch must be new'}
          New-Item -ItemType Directory -Path $stash | Out-Null
          try {
            Copy-Item -LiteralPath $research -Destination $source -Force
            $env:CL='/DWIC_HEIC_REXT_TIMING_CI'
            msbuild wic_heic/wic_heic.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64
            if($LASTEXITCODE -ne 0){throw 'CI private scalar baseline decoder build failed'}
            Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination (Join-Path $stash 'Scalar.dll') -ErrorAction Stop
            $env:CL='/DWIC_HEIC_REXT_TIMING_CI /DWIC_HEIC_REXT_NBIT_LUT_CI'
            msbuild wic_heic/wic_heic.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64
            if($LASTEXITCODE -ne 0){throw 'CI private exact-LUT decoder build failed'}
            Copy-Item -LiteralPath 'wic_heic/(Build)/x64/Release/wic_heic.dll' -Destination (Join-Path $stash 'Lut.dll') -ErrorAction Stop
          } finally {
            Remove-Item Env:\CL -ErrorAction SilentlyContinue
            git restore -- $source
            if($LASTEXITCODE -ne 0){throw 'CI source restoration failed'}
          }
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $sha){
            throw 'Production source not restored exactly after CI-only build'
          }
          if((Get-FileHash -LiteralPath (Join-Path $stash 'Scalar.dll') -Algorithm SHA256).Hash -eq
             (Get-FileHash -LiteralPath (Join-Path $stash 'Lut.dll') -Algorithm SHA256).Hash){
            throw 'Distinct scalar and exact-LUT private decoder DLLs required'
          }
          Write-Host 'HEIC_REXT_CI_SCALAR_AND_LUT_BINARIES_BUILT_SOURCE_SHA256_RESTORED'
          foreach($project in @(
            'wictest/isolated_shell/HeicShellFastPreview.vcxproj',
            'wictest/isolated_shell/ShellEmbeddedDirect.vcxproj'
          )){
            msbuild $project /p:Configuration=Release /p:Platform=x64
            if($LASTEXITCODE -ne 0){throw "RExt unregistered provider/probe build failed: $project"}
          }
          Write-Host 'HEIC_REXT_UNREGISTERED_PROVIDER_PRIVATE_CODEC_COMPILED'
      - name: Build isolated libheif RExt 10bit 1-2-4 thread ABBA evaluator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeifRextThreadsAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'RExt thread-count research test failed compilation'}
      - name: Build isolated native 10bit YUV versus RGB HEIC decoder research probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          msbuild wictest/isolated_shell/HeifRextColorStageAB.vcxproj /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'RExt 10bit native YUV/RGB stage split benchmark failed to build'}
      - name: Analyze two real RExt HEIC 10bit YUV-versus-RGB decode modes with stable hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'wictest\samples'
          $names=@('04','fixture-irot3-exif6-noaux','03','fixture-irot3-exif6')
          $before=@{}
          foreach($name in $names){
            $src=(Resolve-Path -LiteralPath (Join-Path $root ($name+'.heic'))).Path
            $before[$name]=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
          }
          $exe=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/HeifRextColorStageAB.exe').Path
          $logs=@(& $exe $root 2>&1)
          $code=$LASTEXITCODE
          $logs|ForEach-Object {Write-Host $_}
          if($code -ne 0){throw 'RExt YUV RGB decode profiling encountered an unsafe error'}
          if(-not ($logs -match 'HEIC_REXT_COLOR_4FILES_2WORKERS_2FORMATS_4REPEATS_VALID_CI_ONLY_PASS')){
            throw 'All RExt native YUV and RGB decode modes were not observed'
          }
          $rows=@($logs|Where-Object {$_ -match '^HEIC_REXT_COLOR_SPLIT sample='})
          if($rows.Count -ne 8){throw 'Eight alpha/opaque 10bit RExt stage split measurements are required'}
          foreach($line in $rows){
            if($line -notmatch 'repeats=4' -or
               $line -notmatch 'each_route_stable_hash=1' -or
               $line -notmatch 'equivalent_image_color_not_claimed=1 production_enabled=0'){
              throw ('Invalid RExt decoder profiling route: '+$line)
            }
          }
          foreach($name in $names){
            $src=(Resolve-Path -LiteralPath (Join-Path $root ($name+'.heic'))).Path
            if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $before[$name]){
              throw ('Original RExt HEIC file changed: '+$name)
            }
          }
          Write-Host 'HEIC_REXT_YCBCR420_VS_RGB48_RGBA64_EIGHT_STABLE_READONLY_CASES_PASS'
      - name: Verify raw ten-bit RExt decoder threading effects with exact full-RGB parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sources=Join-Path $env:GITHUB_WORKSPACE 'wictest\samples'
          $fixed=@('04','fixture-irot3-exif6-noaux')
          $before=@{}
          foreach($stem in $fixed){
            $input=(Resolve-Path -LiteralPath (Join-Path $sources ($stem+'.heic'))).Path
            $before[$stem]=(Get-FileHash -LiteralPath $input -Algorithm SHA256).Hash
          }
          $program=(Resolve-Path 'wictest/isolated_shell/(Build)/x64/Release/HeifRextThreadsAB.exe').Path
          $measure=@(& $program $sources 2>&1)
          $ret=$LASTEXITCODE
          $measure|ForEach-Object {Write-Host $_}
          if($ret -ne 0){throw 'RExt 10bit decoded pixels vary or benchmark failed'}
          if(-not ($measure -match 'HEIC_REXT_THREADS_TWO_OPAQUE_HEIC_12PASS_EACH_PIXEL_PARITY_PASS')){
            throw 'Full-RGB parity against 1/2/4 thread counts not verified'
          }
          $rows=@($measure|Where-Object {$_ -match '^HEIC_REXT_THREADS_MEDIAN sample='})
          if($rows.Count -ne 2){throw 'Missing RExt worker comparison for two pinned inputs'}
          foreach($line in $rows){
            if($line -notmatch 'passes=12' -or $line -notmatch 'exact_rgb_all=1 production_enabled=0'){
              throw "Unsafe RExt 10bit pixel or thread report: $line"
            }
          }
          foreach($stem in $fixed){
            $input=(Resolve-Path -LiteralPath (Join-Path $sources ($stem+'.heic'))).Path
            if((Get-FileHash -LiteralPath $input -Algorithm SHA256).Hash -ne $before[$stem]){
              throw "Original RExt HEIC changed: $stem"
            }
          }
          Write-Host 'HEIC_REXT_THREADS_1_2_4_CI_READONLY_PIXEL_PARITY_PASS'
      - name: Verify seven original file hashes and 4x ABBA 256px provider pixel parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'heic_rext_direct_ab'
          if(Test-Path -LiteralPath $root){throw 'Refusing temporary output folder overwrite'}
          New-Item -ItemType Directory -Path $root | Out-Null
          $names=@('03','04','05','06','07','fixture-irot3-exif6-noaux','fixture-irot3-exif6')
          $hashes=@{}
          foreach($stem in $names){
            $src=(Resolve-Path -LiteralPath "wictest/samples/$stem.heic").Path
            $hashes[$stem]=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
          }
          $stash=Join-Path $env:RUNNER_TEMP 'heic_rext_profile_binaries'
          Copy-Item -LiteralPath (Join-Path $stash 'Lut.dll') -Destination (Join-Path $root 'WicHeicPrivateCodec.dll') -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $stash 'Scalar.dll') -Destination (Join-Path $root 'WicHeicPrivateCodecScalar.dll') -ErrorAction Stop
          Copy-Item -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/WicHeicFastPreview.dll' -Destination (Join-Path $root 'WicHeicFastPreview.dll') -ErrorAction Stop
          $probe=(Resolve-Path -LiteralPath 'wictest/isolated_shell/(Build)/x64/Release/ShellEmbeddedDirect.exe').Path
          $out=@(& $probe --rext-corpus (Join-Path $root 'WicHeicFastPreview.dll') (Join-Path $root 'WicHeicPrivateCodec.dll') (Join-Path $env:GITHUB_WORKSPACE 'wictest\samples') 2>&1)
          $code=$LASTEXITCODE
          $out|ForEach-Object {Write-Host $_}
          if($code -ne 0){throw "Unregistered RExt pixel parity EXE rejected: $code"}
          $rows=@($out|Where-Object {$_ -match '^HEIC_REXT_DIRECT_AB sample='})
          if($rows.Count -ne 7){throw "Not all RExt test cases ran: $($rows.Count)"}
          foreach($line in $rows){
            if($line -notmatch 'passes=4 exact_bytes_all_passes=1' -or
               $line -notmatch 'no_registry=1'){
              throw "Missing strict provider PBGRA parity evidence: $line"
            }
          }
          if(-not ($out -match 'HEIC_REXT_DIRECT_PROVIDER_7_OF_7_WIC_FANT_PBGRA_EXACT_PASS')){
            throw 'Private codec and Shell provider color/geometry parity not proven'
          }
          $stages=@($out|Where-Object {$_ -match '^HEIC_REXT_STAGES sample='})
          if($stages.Count -ne 7){throw 'Missing HEVC/RGB, 16bpp copy, and WIC Fant stage medians'}
          foreach($stage in $stages){
            foreach($key in @('provider_hevc_rgb_ms','provider_native_copy_ms',
                  'reference_hevc_rgb_ms','reference_native_copy_ms',
                  'reference_wic_copy_pixels_ms','reference_wic_downstream_ms',
                  'reference_setup_ms')){
              if($stage -notmatch ("(?:^| )"+$key+"=([0-9]+(?:\\.[0-9]+)?)")){
                throw ('Missing numeric RExt stage '+$key+': '+$stage)
              }
            }
            if($stage -notmatch 'passes=4' -or $stage -notmatch 'data_scope=private_WIC_only source_unchanged=1'){
              throw ('Invalid HEIC profiling scope: '+$stage)
            }
          }
          $lut=@($out|Where-Object {$_ -match '^HEIC_REXT_LUT_AB sample='})
          if($lut.Count -ne 7){throw 'Missing seven RExt scalar-versus-LUT benchmarking lines'}
          foreach($line in $lut){
            if($line -notmatch 'trials=4' -or
               $line -notmatch 'pixel_bytes_identical_all_4=1' -or
               $line -notmatch 'distinct_scalar_and_lut_binaries=1 production_enabled=0'){
              throw ('RExt LUT introduced possible output mismatch: '+$line)
            }
          }
          if(-not ($out -match 'HEIC_REXT_LUT_VS_SCALAR_7_OF_7_4PASS_WIC_BYTE_EXACT_PASS')){
            throw 'LUT versus scalar native 16bit normalization parity not proven'
          }
          $native=@($out|Where-Object {$_ -match '^HEIC_REXT_NATIVE_FULL_AB sample='})
          if($native.Count -ne 7){throw 'Exact full native 8/10/12bit WIC raster test is incomplete'}
          foreach($line in $native){
            if($line -notmatch 'full_native_wic_bytes_identical=1 no_reencoding=1'){
              throw ('Native WIC full-raster differed between LUT and scalar: '+$line)
            }
          }
          if(-not ($out -match 'HEIC_REXT_LUT_VS_SCALAR_7_OF_7_FULL_NATIVE_WIC_PIXEL_EXACT_PASS')){
            throw 'Full native WIC 24/32/48/64bpp strict image quality not proven'
          }
          Write-Host 'HEIC_REXT_COPYPIXELS_7_OF_7_STAGES_ISOLATED_AND_PIXEL_EXACT_PASS'
          Write-Host 'HEIC_REXT_EXACT_10_12BIT_LUT_AB_TESTS_PASSED_WITHOUT_PRODUCT_CHANGE'
          foreach($stem in $names){
            $src=(Resolve-Path -LiteralPath "wictest/samples/$stem.heic").Path
            if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $hashes[$stem]){
              throw "Read-only HEIC source changed: $stem"
            }
          }
          Write-Host 'HEIC_REXT_DIRECT_PRIVATE_SHELL_WIC_7X4_ABBA_SHA256_UNCHANGED_PASS'
          Write-Host 'HEIC_REXT_NO_MSI_NO_REGISTRY_NO_HEIC_MANAGER_INTERFERENCE'
