name: HEIC passive Shell notification diagnostic CI
on:
  push:
    branches:
      - fix/grid-rotation-lossless-safety-20261028
    paths:
      - diagnostics/photos_trace/HEIC_SaveShell_PassiveMonitor.ps1
      - diagnostics/photos_trace/02_保存通知診断_ダブルクリック.cmd
      - diagnostics/photos_trace/README_保存通知診断_JA.txt
      - .github/workflows/heic-shell-save-notification-ci.yml
  workflow_dispatch:
jobs:
  passive-shell-monitor:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate double-click monitoring with a synthetic file (NO HEIC originals)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='diagnostics/photos_trace'
          $launchers=@(Get-ChildItem -LiteralPath $root -File -Filter '02_*.cmd')
          if($launchers.Count -ne 1){throw 'Expected exactly one passive monitor launcher'}
          & $launchers[0].FullName --ci-selftest
          if($LASTEXITCODE -ne 0) {throw ('Synthetic passive monitor failed: '+$LASTEXITCODE)}
          $files=@(Get-ChildItem -LiteralPath $root -Recurse -File -Filter 'HEIC_ShellWatch_*.txt')
          if($files.Count -lt 1){throw 'Expected output text file'}
          $latest=$files|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          $lines=Get-Content -LiteralPath $latest.FullName -Encoding UTF8
          if(-not ($lines -match 'HEIC_PASSIVE_FS_SHELL_MONITOR_V2') -or
             -not ($lines -match 'GUI_SHOWN=True') -or
             -not ($lines -match 'PHOTOS_LAUNCH=SKIPPED_CI') -or
             -not ($lines -match 'SHELL_REGISTRATION=OK') -or
             -not ($lines -match 'channel=SHELL event=UPDATEITEM scope=target') -or
             -not ($lines -match 'channel=FS event=CHANGED scope=target')){
            throw 'Passive monitor output missing core evidence'
          }
          Write-Host 'PASSIVE_SHELL_MONITOR_SYNTHETIC_CI_PASS'
      - name: Upload passive Shell notification diagnostic ONLY (no MSI or images)
        uses: actions/upload-artifact@v4
        with:
          name: IMG4425-SaveShellMonitor-OneClick-Win10
          path: |
            diagnostics/photos_trace/02_保存通知診断_ダブルクリック.cmd
            diagnostics/photos_trace/HEIC_SaveShell_PassiveMonitor.ps1
            diagnostics/photos_trace/README_保存通知診断_JA.txt
          retention-days: 30
