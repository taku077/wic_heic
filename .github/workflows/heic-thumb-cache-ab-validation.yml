name: HEIC thumbnail-cache A/B diagnostic smoke
on:
  push:
    branches:
      - fix/grid-rotation-lossless-safety-20261028
    paths:
      - diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1
      - diagnostics/photos_trace/HEIC_Thumbnail_DoubleClick_GUI.ps1
      - diagnostics/photos_trace/01_診断開始_ダブルクリック.cmd
      - diagnostics/photos_trace/README_ダブルクリック診断_JA.txt
      - .github/workflows/heic-thumb-cache-ab-validation.yml
  workflow_dispatch:
jobs:
  cache-ab-synthetic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 source-only synthetic PNG thumbnail comparison
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          $path=Join-Path $env:RUNNER_TEMP ('wic_heic_cacheab_'+[Guid]::NewGuid().ToString('N')+'.png')
          $bitmap=New-Object System.Drawing.Bitmap(240,160)
          try {
            $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.Clear([System.Drawing.Color]::CornflowerBlue)
              $graphics.FillRectangle([System.Drawing.Brushes]::White,20,25,45,80)
            } finally { $graphics.Dispose() }
            $bitmap.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
          } finally { $bitmap.Dispose() }
          try {
            $before=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            $result=@(& ./diagnostics/photos_trace/HEIC_ThumbnailCache_AB_ReadOnly.ps1 -ImagePath $path -Size 128 -CiSyntheticOnly -CiPrimeCache -ForceReextractAfterSnapshot)
            $result | ForEach-Object { Write-Host $_ }
            if(-not ($result -match 'CI_SYNTHETIC_PRIME=OK') -or
               -not ($result -match 'CACHE_ONLY status=OK')) {
              throw 'Synthetic primed thumbnail cache-hit test failed'
            }
            if(-not ($result -match 'COMPARE=IDENTICAL_CACHED_VS_FORCED_EXTRACTION')) {
              throw 'Primed cache and independent thumbnail extraction are not pixel-identical'
            }
            if(-not ($result -match 'FORCE_REEXTRACT status=OK')) {
              throw 'Forced extraction failed for synthetic PNG'
            }
            if(-not ($result -match 'INPUT_LENGTH_AND_MTIME_UNCHANGED=True')) {
              throw 'Input changed unexpectedly'
            }
            $after=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if($before -ne $after) { throw 'Image bytes mutated by diagnostic' }
            Write-Host 'THUMB_CACHE_AB_SYNTHETIC_READ_ONLY_PASS'
          } finally {
            Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
          }

      - name: Validate real CMD double-click entry point in noninteractive synthetic mode
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $launchers=@(Get-ChildItem -LiteralPath 'diagnostics/photos_trace' -File -Filter '01_*.cmd')
          if($launchers.Count -ne 1){throw 'Expected exactly one double-click CMD launcher'}
          $start=$launchers[0].FullName
          & $start --ci-selftest
          if($LASTEXITCODE -ne 0){throw ('GUI double-click CMD self-test failed: '+$LASTEXITCODE)}
          Write-Host 'THUMB_DOUBLECLICK_CMD_CI_PASS'
